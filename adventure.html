<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNDBOX · 冒险</title>
<style>
  :root {
    --ink:       #3d2b1f;
    --ink-soft:  #6b4e3d;
    --paper:     #faf6ee;
    --paper-light: #fdfbf7;
    --paper-card:  #fffdf7;
    --paper-dark:  #e5dbca;
    --accent:    #8b5a2b;
    --accent-glow: #b8783e;
    --border:    rgba(61, 43, 31, 0.12);
    --shadow:    rgba(61, 43, 31, 0.12);
    --slot:      rgba(61, 43, 31, 0.06);
    --line-color: rgba(61, 43, 31, 0.35);
    --danger:    #b53b3b;
    --left-panel-w: 240px;
    --right-panel-w: 260px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "Songti SC", Georgia, serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  body.page-in { opacity: 1; }

  /* ── top bar ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--paper);
    flex-shrink: 0;
  }

  .top-bar .brand {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-back-lobby {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color 0.15s, border-color 0.15s;
  }

  .btn-back-lobby:hover {
    color: var(--ink);
    border-color: var(--ink-soft);
  }

  /* ── adventure body ── */
  .adventure-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── left panel（尺寸随面板宽度等比缩放） ── */
  .left-panel {
    width: var(--left-panel-w);
    min-width: 0;
    flex-shrink: 0;
    padding: calc(var(--left-panel-w) * 0.048) calc(var(--left-panel-w) * 0.041);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: calc(var(--left-panel-w) * 0.041);
    overflow-y: auto;
    transition: none;
  }

  .context-section {
    border: 1px solid var(--border);
    border-radius: calc(var(--left-panel-w) * 0.03);
    padding: calc(var(--left-panel-w) * 0.036) calc(var(--left-panel-w) * 0.041);
    background: var(--paper-light);
  }

  .context-section h3 {
    font-size: calc(var(--left-panel-w) * 0.039);
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: calc(var(--left-panel-w) * 0.024);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .context-section h4 {
    font-size: calc(var(--left-panel-w) * 0.036);
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: calc(var(--left-panel-w) * 0.018);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.8;
  }

  .context-location {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(var(--left-panel-w) * 0.024) calc(var(--left-panel-w) * 0.036);
    background: var(--slot);
    border-radius: calc(var(--left-panel-w) * 0.024);
    cursor: pointer;
    transition: background 0.15s;
  }

  .context-location:hover {
    background: rgba(139, 90, 43, 0.10);
  }

  .location-name {
    font-size: calc(var(--left-panel-w) * 0.041);
    font-weight: 600;
    color: var(--ink);
  }

  .location-type-tag {
    font-size: calc(var(--left-panel-w) * 0.033);
    color: var(--ink-soft);
    padding: calc(var(--left-panel-w) * 0.006) calc(var(--left-panel-w) * 0.024);
    border: 1px solid var(--border);
    border-radius: calc(var(--left-panel-w) * 0.018);
  }

  .context-list {
    display: flex;
    flex-direction: column;
    gap: calc(var(--left-panel-w) * 0.012);
  }

  .context-item {
    display: flex;
    align-items: center;
    gap: calc(var(--left-panel-w) * 0.024);
    padding: calc(var(--left-panel-w) * 0.018) calc(var(--left-panel-w) * 0.03);
    border-radius: calc(var(--left-panel-w) * 0.018);
    cursor: pointer;
    transition: background 0.15s;
    font-size: calc(var(--left-panel-w) * 0.039);
  }

  .context-item:hover {
    background: rgba(139, 90, 43, 0.08);
  }

  .context-item-icon {
    width: calc(var(--left-panel-w) * 0.084);
    height: calc(var(--left-panel-w) * 0.084);
    border-radius: 50%;
    background: rgba(139, 90, 43, 0.12);
    color: var(--accent);
    font-size: calc(var(--left-panel-w) * 0.039);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .context-item-name {
    flex: 1;
    color: var(--ink);
    font-weight: 500;
  }

  .context-item-meta {
    font-size: calc(var(--left-panel-w) * 0.033);
    color: var(--ink-soft);
  }

  /* ── 任务子项（侧边栏展开用） ── */
  .quest-subtasks { width: 100%; padding-top: calc(var(--left-panel-w) * 0.012); border-top: 1px solid rgba(139,90,43,0.1); margin-top: calc(var(--left-panel-w) * 0.012); }
  .quest-subtask {
    display: flex; align-items: flex-start; gap: calc(var(--left-panel-w) * 0.018);
    padding: calc(var(--left-panel-w) * 0.012) 0 calc(var(--left-panel-w) * 0.012) calc(var(--left-panel-w) * 0.012); font-size: calc(var(--left-panel-w) * 0.036); color: var(--ink-soft);
    cursor: pointer; border-radius: calc(var(--left-panel-w) * 0.012); transition: background 0.15s;
  }
  .quest-subtask:hover { background: rgba(139,90,43,0.06); }
  .quest-subtask.done { opacity: 0.65; }
  .quest-subtask.done .quest-subtask-text { text-decoration: line-through; }
  .quest-subtask-check {
    width: calc(var(--left-panel-w) * 0.048);
    height: calc(var(--left-panel-w) * 0.048);
    border-radius: 50%;
    border: calc(var(--left-panel-w) * 0.004) solid var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: calc(var(--left-panel-w) * 0.003); font-size: calc(var(--left-panel-w) * 0.03); color: transparent;
  }
  .quest-subtask.done .quest-subtask-check { border-color: var(--accent); background: var(--accent); color: #fff; }
  .quest-subtask-text { flex: 1; line-height: 1.5; }
  .quest-item { cursor: pointer; flex-wrap: wrap; }
  .quest-expand-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: calc(var(--left-panel-w) * 0.067);
    height: calc(var(--left-panel-w) * 0.067);
    flex-shrink: 0;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.25s ease, color 0.2s ease;
  }
  .quest-expand-btn svg {
    width: calc(var(--left-panel-w) * 0.05);
    height: calc(var(--left-panel-w) * 0.05);
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .quest-expand-btn:hover { color: var(--accent); }
  .quest-expand-btn.open { transform: rotate(180deg); color: var(--accent); }

  /* ── 任务详情模态框（完全照抄 lobby.html） ── */
  .task-columns {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 20px;
    align-items: flex-start;
  }
  .task-sidebar {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-height: 480px;
    overflow-y: auto;
  }
  .task-category {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .task-category-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(61, 43, 31, 0.04);
    margin-bottom: 4px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s ease;
  }
  .task-category-title:hover {
    background: rgba(61, 43, 31, 0.08);
  }
  .task-category-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    color: var(--ink-soft);
    transition: transform 0.25s ease;
  }
  .task-category-arrow svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .task-category.collapsed .task-category-arrow {
    transform: rotate(-90deg);
  }
  .task-category.collapsed .task-category-list {
    display: none;
  }
  .task-category-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .task-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .task-nav-item:hover {
    background: rgba(184, 115, 51, 0.08);
  }
  .task-nav-item.active {
    background: rgba(184, 115, 51, 0.16);
    color: var(--ink);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .task-nav-item.task-completed {
    color: var(--ink-soft);
  }
  .task-nav-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .task-nav-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--ink-soft);
    transition: transform 0.25s ease;
  }
  .task-nav-arrow svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .task-nav-item.expanded .task-nav-arrow {
    transform: rotate(180deg);
  }
  .task-nav-item.no-expand {
    padding-right: 12px;
  }
  .task-nav-status {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .task-nav-status.ongoing {
    color: var(--paper-light);
    background: var(--accent);
  }
  .task-nav-status.completed {
    color: var(--ink-soft);
    background: rgba(61, 43, 31, 0.08);
  }
  .task-sub-nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px 7px 28px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .task-sub-nav-item:hover {
    background: rgba(184, 115, 51, 0.06);
  }
  .task-sub-nav-item.active {
    background: rgba(184, 115, 51, 0.12);
    color: var(--ink);
  }
  .task-sub-nav-item.completed {
    color: var(--ink-soft);
  }
  .task-sub-nav-item.completed .sub-nav-dot {
    background: var(--accent);
    opacity: 0.5;
  }
  .task-sub-nav-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sub-nav-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .task-detail {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px var(--shadow);
    min-height: 420px;
  }
  .task-detail-header {
    margin-bottom: 24px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .task-detail-tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    margin-bottom: 10px;
  }
  .task-detail-tag.ongoing {
    color: var(--paper-light);
    background: var(--accent);
  }
  .task-detail-tag.completed {
    color: var(--ink-soft);
    background: rgba(61, 43, 31, 0.08);
  }
  .task-detail-header h2 {
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin: 0;
  }
  .task-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .task-section-title::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .task-subtasks {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: 24px;
    background: rgba(255, 255, 255, 0.45);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .subtask {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .subtask:last-child { border-bottom: none; }
  .subtask-check {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .subtask-check svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .subtask.completed .subtask-check svg { color: var(--accent); }
  .subtask-text {
    font-size: 14px;
    color: var(--ink);
  }
  .subtask.completed .subtask-text {
    text-decoration: line-through;
    color: var(--ink-soft);
  }
  .task-description {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.7;
  }

  .context-placeholder {
    font-size: calc(var(--left-panel-w) * 0.036);
    color: var(--ink-soft);
    font-style: italic;
    opacity: 0.6;
    text-align: center;
    padding: calc(var(--left-panel-w) * 0.024) 0;
  }

  .context-empty {
    font-size: calc(var(--left-panel-w) * 0.036);
    color: var(--ink-soft);
    opacity: 0.5;
    text-align: center;
    padding: calc(var(--left-panel-w) * 0.012) 0;
  }

  /* ── center area ── */
  .center-area {
    flex: 1;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .location-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--paper-light);
    flex-shrink: 0;
    text-align: center;
  }

  .location-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }

  .location-meta {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
    font-style: italic;
  }

  /* ── narrative log ── */
  .narrative-log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .narrative-log::-webkit-scrollbar {
    width: 6px;
  }

  .narrative-log::-webkit-scrollbar-track {
    background: transparent;
  }

  .narrative-log::-webkit-scrollbar-thumb {
    background: rgba(61, 43, 31, 0.15);
    border-radius: 3px;
  }

  .log-entry {
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.75;
    max-width: 720px;
  }

  .log-entry.gm {
    background: rgba(61, 43, 31, 0.03);
    border-left: 3px solid var(--accent);
    align-self: flex-start;
  }

  .log-entry.player {
    background: rgba(139, 90, 43, 0.06);
    border-left: 3px solid var(--ink-soft);
    align-self: flex-end;
    text-align: right;
  }

  .log-entry.system {
    background: rgba(139, 90, 43, 0.04);
    border-left: 3px solid var(--danger);
    align-self: center;
    text-align: center;
    font-size: 13px;
    padding: 10px 16px;
  }

  .log-entry.check {
    background: rgba(139, 90, 43, 0.04);
    border: 1px dashed var(--border);
    align-self: center;
    text-align: center;
    font-size: 13px;
    padding: 10px 16px;
  }

  .log-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .log-text {
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .gm .log-label { color: var(--accent); }
  .player .log-label { color: var(--ink-soft); }
  .system .log-label { color: var(--danger); }
  .check .log-label { color: var(--ink-soft); }

  /* ── input area ── */
  .input-area {
    padding: 12px 24px 16px;
    border-top: 1px solid var(--border);
    background: var(--paper-light);
    flex-shrink: 0;
    display: flex;
    gap: 10px;
  }

  .input-area input {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    outline: none;
    transition: border-color 0.15s;
  }

  .input-area input::placeholder {
    color: var(--ink-soft);
    opacity: 0.5;
  }

  .input-area input:focus {
    border-color: var(--accent);
  }

  .input-area button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .input-area button:hover {
    background: var(--accent-glow);
  }

  /* ── right panel ── */
  .right-panel {
    width: var(--right-panel-w);
    min-width: 0;
    flex-shrink: 0;
    padding: calc(var(--right-panel-w) * 0.011) calc(var(--right-panel-w) * 0.010);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: calc(var(--right-panel-w) * 0.010);
    overflow-y: auto;
    transition: none;
  }

  .char-card {
    width: 100%;
    box-sizing: border-box;
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: calc(var(--right-panel-w) * 0.015);
    padding: calc(var(--right-panel-w) * 0.027) calc(var(--right-panel-w) * 0.015);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .char-card-placeholder {
    font-size: calc(var(--right-panel-w) * 0.018);
    color: var(--ink-soft);
    text-align: center;
    padding: calc(var(--right-panel-w) * 0.038) 0;
  }

  .char-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .char-name {
    font-size: calc(var(--right-panel-w) * 0.027);
    font-weight: 700;
    color: var(--ink);
  }

  /* 名字紧贴头像框上侧，不再独立占一整行 */
  .portrait-mid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--right-panel-w) * 0.045);
    transform: translateY(calc(var(--right-panel-w) * -0.03)); 
  }

  .char-portrait-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--right-panel-w) * 0.02);
  }

  .equipment-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--right-panel-w) * 0.018);
    justify-content: flex-start;
    width: calc(var(--right-panel-w) * 0.129);
  }

  .left-slots { align-items: flex-start; }
  .right-slots { align-items: flex-end; }

  .slot {
    width: calc(var(--right-panel-w) * 0.10);
    height: calc(var(--right-panel-w) * 0.111);
    border-radius: calc(var(--right-panel-w) * 0.018);
    background: var(--slot);
    border: 1px dashed var(--border);
    display: flex;
    flex-direction: column;

  /* ── resize handles ── */

<script>
(function() {
  /* ── 常量 ── */
  const ADVENTURE_ID = 'lost-mine-of-phandelver';
  const CHAPTER_ID = 'ch1';

  /* ── 全局状态 ── */
  let state = {
    adventureId: ADVENTURE_ID,
    chapterId: CHAPTER_ID,
    currentSceneId: null,
    data: null,
    character: null,
    log: [],
    quests: {},
    npcStates: {},
    locationStates: {},
    containerTaken: {},
    takenLocationItems: [],
    tempEquipItems: [],
    droppedItems: {},
    merchantStates: {},
    playerInventory: [],
    tradeLog: [],
    hostileNpcs: [],
    suspicion: {},
    arrest: null,
    caught: {},
    wantedLocation: null,
    npcAlerts: {},
    merchantTheft: {},
    playerStealth: {},
    playerHp: {},
    spellSlotsUsed: {},
    shortRestsLeft: 2,
    sessionStarted: false,
    sessionId: null
  };

  /* ── 辅助 ── */
  function getCurrentScene() {
    if (!state.data || !state.currentSceneId) return null;
    return state.data.scenes[state.currentSceneId] || null;
  }

  function getCurrentLocation() {
    const scene = getCurrentScene();
    if (!scene) return null;
    return state.data.locations[scene.location] || null;
  }

  /* ── DOM 引用 ── */
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  const narrativeLog = $('#narrative-log');
  const playerInput = $('#player-input');
  const sendBtn = $('#send-btn');
  const charCard = $('#char-card');
  const modalOverlay = $('#detail-modal-overlay');
  const modalContent = $('#detail-modal-content');
  const modalClose = $('#detail-modal-close');

  /* ── 数据加载 ── */
  const DEFAULT_CHAR_ID = 'char_20260727180516_c8081c';

  function getAbility(char, key) {
    /* 兼容两种角色卡格式：后端嵌套 abilities.str.value / 前端扁平 str/dex */
    if (char.abilities && char.abilities[key] && char.abilities[key].value != null) {
      return char.abilities[key].value;
    }
    const flatMap = { str: 'strength', dex: 'dexterity', con: 'constitution', int: 'intelligence', wis: 'wisdom', cha: 'charisma' };
    const flatKey = flatMap[key] || key;
    if (char[flatKey] != null) return char[flatKey];
    if (char[key] != null) return char[key];
    return 10;
  }

  function getAbilitiesArray(char) {
    return [
      { name: '力量', key: 'str', abbr: 'STR', val: getAbility(char, 'str') },
      { name: '敏捷', key: 'dex', abbr: 'DEX', val: getAbility(char, 'dex') },
      { name: '体质', key: 'con', abbr: 'CON', val: getAbility(char, 'con') },
      { name: '智力', key: 'int', abbr: 'INT', val: getAbility(char, 'int') },
      { name: '感知', key: 'wis', abbr: 'WIS', val: getAbility(char, 'wis') },
      { name: '魅力', key: 'cha', abbr: 'CHA', val: getAbility(char, 'cha') }
    ];
  }

  async function loadCharacter() {
    /* 角色数据以后端 JSON 为权威（金币等由后端维护，前端只读）；localStorage 仅作兜底 */
    try {
      const raw = localStorage.getItem('currentCharacter');
      const localChar = raw ? JSON.parse(raw) : null;
      const charId = (localChar && localChar.id) || DEFAULT_CHAR_ID;
      const resp = await fetch(`/api/characters/${charId}`);
      if (resp.ok) {
        state.character = normalizeChar(await resp.json());
        return;
      }
      if (localChar) {
        state.character = normalizeChar(localChar);
        return;
      }
    } catch (e) {
      console.warn('角色加载失败:', e);
    }
    state.character = null;
  }

  function normalizeAbilities(abilities) {
    if (!abilities) return {};
    const result = {};
    const keys = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
    const labels = { str: '力', dex: '敏', con: '体', int: '智', wis: '感', cha: '魅' };
    for (const key of keys) {
      const raw = abilities[key];
      if (typeof raw === 'object' && raw !== null) {
        result[key] = {
          label: raw.label || labels[key] || key,
          value: raw.value != null ? raw.value : 10,
          save_bonus: raw.save_bonus || '+0',
          highlighted: !!raw.highlighted,
        };
      } else {
        const score = typeof raw === 'number' ? raw : 10;
        const mod = Math.floor((score - 10) / 2);
        result[key] = {
          label: labels[key] || key,
          value: score,
          save_bonus: mod >= 0 ? '+' + mod : String(mod),
          highlighted: false,
        };
      }
    }
    return result;
  }

  function normalizeChar(char) {
    if (!char) return char;
    return {
      ...char,
      combat: char.combat || { ac: 10, hp: '0 / 0' },
      xp: char.xp || { current: 0, max: 300, display: '0 / 300' },
      attack: char.attack || {
        melee: { label: '近战', bonus: '+0', damage: '1d4' },
        ranged: { label: '远程', bonus: '+0', damage: '1d4' },
      },
      inventory: char.inventory || { gold: 0, items: [] },
      features: char.features || { status_ids: [], resistance_ids: [], class_feature_ids: [], trait_ids: [] },
      skills: char.skills || { proficiency_bonus: '+2', sections: [] },
      spells: char.spells || { caster_level: 1, action_ids: { normal: ["jump", "throw", "dash"], class: [] }, passive_ids: [], spell_ids: {} },
      background: char.background || {
        class: '', race: '', attributes: {},
        traits: { personality: '', ideal: '', bond: '', flaw: '' },
        story: [],
      },
      abilities: normalizeAbilities(char.abilities),
    };
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  const _CACHE_BUST = Date.now();
  const DATA_URLS = {
    meta: `/data/adventures/${ADVENTURE_ID}/meta.json?t=${_CACHE_BUST}`,
    globalNpcs: `/data/adventures/${ADVENTURE_ID}/global/npcs.json?t=${_CACHE_BUST}`,
    chapter: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/chapter.json?t=${_CACHE_BUST}`,
    locations: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/locations.json?t=${_CACHE_BUST}`,
    chapterNpcs: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/npcs.json?t=${_CACHE_BUST}`,
    items: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/items.json?t=${_CACHE_BUST}`,
    quests: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/quests.json?t=${_CACHE_BUST}`,
    encounters: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/encounters.json?t=${_CACHE_BUST}`
  };

  async function loadAllData() {
    const results = {};
    const keys = Object.keys(DATA_URLS);

    const responses = await Promise.all(
      keys.map(k => fetch(DATA_URLS[k]).then(r => r.json()))
    );

    keys.forEach((k, i) => { results[k] = responses[i]; });

    // 合并数据
    const allNpcs = {
      ...results.globalNpcs.npcs,
      ...results.chapterNpcs.npcs
    };

    const allItems = results.items.items;
    const chapter = results.chapter;

    // 构建场景索引
    const scenes = {};
    (chapter.scenes || []).forEach(s => { scenes[s.id] = s; });

    state.data = {
      meta: results.meta,
      chapter,
      scenes,
      locations: results.locations.locations,
      npcs: allNpcs,
      items: allItems,
      quests: results.quests.quests,
      encounters: results.encounters.encounters
    };

    state.currentSceneId = chapter.starting_scene || (chapter.scenes && chapter.scenes[0] ? chapter.scenes[0].id : null);
    state.quests = { ...results.quests.quests };
    state.sessionStarted = true;
  }

  /* ── 日志操作 ── */
  /* 过滤 GM 输出里偶发泄漏的工具调用 XML（某些模型会把 process_action 原样输出） */
  function cleanGmText(t) {
    return String(t || '')
      .replace(/<process_action>[\s\S]*?<\/process_action>/g, '')
      .replace(/<\/?process_action\/?>/g, '');
  }

  function appendLog(type, text, meta) {
    state.log.push({ type, text, timestamp: Date.now(), meta: meta || {} });
    renderNarrativeLog();
  }

  /* ── 直接向 DOM 追加日志条目（用于流式输出初始化） ── */
  function appendLogEntry(entry) {
    state.log.push({ type: entry.type, text: entry.text || '', timestamp: Date.now(), meta: { id: entry.id } });
    const labels = { gm: 'GM', player: '玩家', system: '系统', check: '检定', npc: 'NPC' };
    const el = document.createElement('div');
    el.className = 'log-entry ' + entry.type;
    el.setAttribute('data-log-id', entry.id);
    el.innerHTML = `<div class="log-label">${labels[entry.type] || entry.type}</div><div class="log-text"></div>`;
    narrativeLog.appendChild(el);
    narrativeLog.scrollTop = narrativeLog.scrollHeight;
  }

  /* ── 更新流式日志条目的文本内容 ── */
  function updateLogEntryText(id, newText) {
    // 更新 state.log 中的文本
    const logEntry = state.log.find(e => e.meta && e.meta.id === id);
    if (logEntry) logEntry.text = newText;

    // 直接更新 DOM
    const el = narrativeLog.querySelector(`[data-log-id="${id}"]`);
    if (el) {
      const textEl = el.querySelector('.log-text');
      if (textEl) textEl.textContent = newText;
      narrativeLog.scrollTop = narrativeLog.scrollHeight;
    }
  }

  /* ── 渲染叙事日志 ── */
  function renderNarrativeLog() {
    if (state.log.length === 0) {
      narrativeLog.innerHTML = '';
      return;
    }

    const labels = { gm: 'GM', player: '玩家', system: '系统', check: '检定', npc: 'NPC' };

    narrativeLog.innerHTML = state.log.map(entry => {
      let extra = '';
      const dataId = entry.meta && entry.meta.id ? `data-log-id="${entry.meta.id}"` : '';
      if (entry.type === 'check' && entry.meta) {
        const m = entry.meta;
        const rollText = m.roll ? `d20(${m.roll})+${m.mod||0}` : '';
        const dcText = m.dc ? ` DC ${m.dc}` : '';
        const result = m.success ? '成功' : '失败';
        const resultClass = m.success ? 'color:var(--accent);' : 'color:var(--danger);';
        extra = `<div style="margin-top:6px;font-size:13px;">掷骰: ${rollText}${dcText} — <span style="${resultClass}font-weight:700;">${result}</span></div>`;
      }
      return `
        <div class="log-entry ${entry.type}" ${dataId}>
          <div class="log-label">${labels[entry.type] || entry.type}</div>
          <div class="log-text">${entry.text}</div>
          ${extra}
        </div>
      `;
    }).join('');

    narrativeLog.scrollTop = narrativeLog.scrollHeight;
  }

  /* ── 渲染地点标题 ── */
  function renderLocationHeader() {
    const scene = getCurrentScene();
    const loc = getCurrentLocation();
    if (!scene) return;

    const titleEl = $('#location-title');
    const metaEl = $('#location-meta');

    // 如果有父地点则显示 "父地点 · 子地点"
    if (loc && loc.parent_location) {
      titleEl.textContent = `${loc.parent_location} · ${loc.name}`;
    } else {
      titleEl.textContent = loc ? loc.name : scene.name;
    }
    const chapter = state.data.chapter;
    metaEl.textContent = chapter ? `${chapter.title} · ${scene.name}` : scene.name;
  }

  /* ── 渲染左侧上下文面板 ── */
  function renderContextPanel() {
    const scene = getCurrentScene();
    const loc = getCurrentLocation();
    if (!scene || !loc) return;

    // 当前地点
    const locEl = $('#context-location');
    if (locEl) {
      locEl.querySelector('.location-name').textContent = loc.name;
      locEl.onclick = () => openDetailModal('location', loc.id);
    }

    // 人物：当前地点优先（地点显式定义了 npcs，含空数组），场景兜底
    const npcsEl = $('#context-npcs');
    const rawNpcIds = (loc.npcs !== undefined) ? (loc.npcs || []) : (scene.npcs || []);
    // 兼容字符串 / {id, sub} 两种形式（sub=子区域，仅后端目击者判定用）
    const npcIds = rawNpcIds.map(e => (typeof e === 'string') ? e : (e && e.id)).filter(Boolean);
    // 已离开的 NPC 从列表移除；死亡/眩晕保留并加标记
    const NPC_STATUS_SUFFIX = { dead: '（已死亡）', stunned: '（眩晕）' };
    const visibleNpcIds = npcIds.filter(id => (state.npcStates[id]?.status || '') !== 'left');
    if (visibleNpcIds.length === 0) {
      npcsEl.innerHTML = '<div class="context-empty">此处没有其他人</div>';
    } else {
      npcsEl.innerHTML = visibleNpcIds.map(id => {
        const npc = state.data.npcs[id];
        if (!npc) return '';
        const suffix = NPC_STATUS_SUFFIX[state.npcStates[id]?.status] || '';
        return `
          <div class="context-item" data-type="npc" data-id="${id}">
            <div class="context-item-icon">${npc.name[0]}</div>
            <div class="context-item-name">${npc.name}${suffix}</div>
            <div class="context-item-meta">${npc.role || ''}</div>
          </div>
        `;
      }).join('');
      npcsEl.querySelectorAll('.context-item').forEach(el => {
        el.addEventListener('click', () => openDetailModal('npc', el.dataset.id));
      });
    }

    // 物品：当前地点优先（地点显式定义了 items，含空数组），场景兜底
    const itemsEl = $('#context-items');
    const locHasItems = loc.items !== undefined;
    let visibleItems;
    if (locHasItems) {
      visibleItems = loc.items.filter(i => i.visible !== false);
    } else if (scene.items && scene.items.length > 0) {
      // 场景定义了物品列表，从 items 数据中查找详细信息
      visibleItems = scene.items.map(id => ({ id, visible: true }));
    } else {
      visibleItems = [];
    }
    // 过滤本会话已直接拿走的物品（切场景回来不重复显示）
    visibleItems = visibleItems.filter(entry => !state.takenLocationItems.includes(entry.id));
    // 合并本会话丢弃在当前地点的物品（其他角色可拾取）
    const dropped = (state.droppedItems || {})[loc.id] || [];
    if (dropped.length > 0) {
      const have = new Set(visibleItems.map(e => e.id));
      dropped.forEach(id => { if (!have.has(id)) visibleItems.push({ id, visible: true }); });
    }
    if (visibleItems.length === 0) {
      itemsEl.innerHTML = '<div class="context-empty">此处没有可见物品</div>';
    } else {
      itemsEl.innerHTML = visibleItems.map(entry => {
        const item = findItemDef(entry.id);
        if (!item) return '';
        return `
          <div class="context-item" data-type="item" data-id="${entry.id}">
            <div class="context-item-icon">I</div>
            <div class="context-item-name">${item.name}</div>
          </div>
        `;
      }).join('');
      itemsEl.querySelectorAll('.context-item').forEach(el => {
        el.addEventListener('click', () => openDetailModal('item', el.dataset.id));
      });
    }

    // 可去地点：仅显示当前地点的物理出口
    const exitsSection = $('#context-exits-section');
    const exitsEl = $('#context-exits');
    const exits = buildSceneExits(scene);
    if (exits.length === 0) {
      exitsSection.style.display = 'none';
    } else {
      exitsSection.style.display = '';
      exitsEl.innerHTML = exits.map((exit, i) => `
        <div class="context-item" data-type="exit" data-index="${i}">
          <div class="context-item-icon" style="font-size:11px;">→</div>
          <div class="context-item-name">${exit.name}</div>
        </div>
      `).join('');
      exitsEl.querySelectorAll('.context-item').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.index);
          const exit = exits[idx];
          if (!exit || !exit.targetLocationId) return;

          // 检查目标地点是否属于另一个场景
          const targetScene = Object.values(state.data.scenes).find(
            s => s.location === exit.targetLocationId
          );
          if (targetScene && targetScene.id !== state.currentSceneId) {
            // 跨场景跳转（如洞穴房间之间）
            navigateToScene(targetScene.id);
          } else {
            // 同场景内探索（如绝冬城内各地点）
            navigateToLocation(exit.targetLocationId);
          }
        });
      });
    }

    // 任务
    const questsEl = $('#context-quests');
    const quests = state.quests || state.data.quests;
    const activeQuestIds = Object.keys(quests).filter(id => quests[id].status === 'active');
    if (activeQuestIds.length === 0) {
      questsEl.innerHTML = '<div class="context-empty">暂无任务</div>';
    } else {
      questsEl.innerHTML = activeQuestIds.map(id => {
        const q = quests[id];
        // 只显示：已完成子任务 + 第一个未完成子任务（防剧透）
        const objectives = q.objectives || [];
        let firstIncompleteIdx = objectives.findIndex(o => !o.completed);
        if (firstIncompleteIdx === -1) firstIncompleteIdx = objectives.length;
        const visibleObjectives = objectives.slice(0, firstIncompleteIdx + 1);

        const subtaskHtml = visibleObjectives.length > 0 ? `
          <div class="quest-subtasks" style="display:none;">
            ${visibleObjectives.map((o, idx) => `
              <div class="quest-subtask ${o.completed ? 'done' : ''}" data-quest-id="${id}" data-subtask-idx="${idx}">
                <div class="quest-subtask-check">${o.completed ? '✓' : ''}</div>
                <div class="quest-subtask-text">${o.description}</div>
              </div>
            `).join('')}
          </div>
        ` : '';

        return `
          <div class="context-item quest-item" data-quest-id="${id}">
            <div class="context-item-icon" style="font-size:10px;">Q</div>
            <div class="context-item-name">${q.name}</div>
            ${visibleObjectives.length > 0 ? `
              <button class="quest-expand-btn" type="button" aria-label="展开任务">
                <svg viewBox="0 0 12 8"><polyline points="2,2 6,6 10,2"></polyline></svg>
              </button>` : ''}
            ${subtaskHtml}
          </div>
        `;
      }).join('');

      // 点击任务：展开/收起子任务
      questsEl.querySelectorAll('.quest-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.quest-subtask')) return;
          const subtasksEl = el.querySelector('.quest-subtasks');
          if (subtasksEl) {
            const isOpen = subtasksEl.style.display !== 'none';
            subtasksEl.style.display = isOpen ? 'none' : 'block';
            const btn = el.querySelector('.quest-expand-btn');
            if (btn) btn.classList.toggle('open', !isOpen);
          }
        });
      });

      // 点击子任务：弹出任务详情模态框
      questsEl.querySelectorAll('.quest-subtask').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const questId = el.dataset.questId;
          const subtaskIdx = parseInt(el.dataset.subtaskIdx);
          openQuestDetailModal(questId, subtaskIdx);
        });
      });
    }
  }

  /* ── 渲染右侧角色卡 ── */

  /* 根据已装备物品计算各装备槽位内容 */
  function computeEquippedSlots(char) {
    const catalog = catalogs.equipment || {};
    const slots = { helmet: null, body: null, shield: null, legs: null, boots: null, neck: null, ring1: null, ring2: null, tool: null, melee: [null, null], ranged: [null, null] };
    // 槽位信息对象：名称 + 描述 + 属性行 + 图标名（图标从 JSON 的 icon 字段动态加载）
    const mk = ci => ({
      name: ci.name,
      desc: ci.description || '',
      props: (ci.properties && (ci.properties.damage || ci.properties.ac || ci.properties.effect)) || '',
      icon: ci.icon || 'pouch',
      twoHanded: !!ci.stats?.two_handed,
    });
    let ringCount = 0;
    for (const item of (char.inventory?.items || [])) {
      if (!item.equipped) continue;
      const ci = item.equipment_id ? catalog[item.equipment_id] : null;
      if (!ci) continue;
      if (ci.type === 'weapon') {
        const cat = ci.stats?.category;
        if (cat === 'melee') {
          if (!slots.melee[0]) slots.melee[0] = mk(ci);
          else if (!slots.melee[1] && !slots.melee[0].twoHanded) slots.melee[1] = mk(ci);
          // 双手武器占满两格：第二格置灰不可操作
          if (slots.melee[0] && slots.melee[0].twoHanded) slots.melee[1] = { disabled: true };
        }
        if (cat === 'ranged') {
          if (!slots.ranged[0]) slots.ranged[0] = mk(ci);
          else if (!slots.ranged[1] && !slots.ranged[0].twoHanded) slots.ranged[1] = mk(ci);
          if (slots.ranged[0] && slots.ranged[0].twoHanded) slots.ranged[1] = { disabled: true };
        }
      } else if (ci.type === 'armor') {
        const cat = ci.stats?.category;
        if (cat === 'shield') {
          if (!slots.shield) slots.shield = mk(ci);
        } else if (cat !== 'clothes') {
          if (!slots.body) slots.body = mk(ci);
        }
      } else if (ci.type === 'accessory') {
        if (ci.subtype === 'ring') {
          if (ringCount === 0) slots.ring1 = mk(ci);
          else if (ringCount === 1) slots.ring2 = mk(ci);
          ringCount++;
        } else if (ci.subtype === 'tool') {
          if (!slots.tool) slots.tool = mk(ci);
        }
      }
    }
    return slots;
  }

  function renderSlot(iconSvg, slot) {
    const disabled = !!slot && slot.disabled;
    const filled = !!slot && !disabled;
    const dataAttrs = filled
      ? ` data-name="${escapeHtml(slot.name)}" data-description="${escapeHtml(slot.desc)}" data-props="${escapeHtml(slot.props)}"`
      : '';
    return `<div class="slot${filled ? ' filled' : ''}${disabled ? ' disabled' : ''}"${dataAttrs}>
      <div class="slot-icon">${iconSvg}</div>
      ${filled ? `<div class="slot-name">${escapeHtml(slot.name)}</div>` : ''}
    </div>`;
  }

        fetch('/api/features').then(r => r.json()),

  /* ── 悬浮提示（物品 + 技能法术，0.5s 延迟） ── */
  (function initTooltip() {
    const tooltip = document.createElement('div');
    tooltip.className = 'item-tooltip';
    document.body.appendChild(tooltip);

    let hoverTimer = null;
    let hoverTarget = null;  // 当前悬停目标（物品卡/装备槽/技能块），用于内部移动去重

    function showTooltip(e, card) {
      const name = card.dataset.name || card.querySelector('.item-name')?.textContent || '';
      const description = card.dataset.description || '';
      const props = card.dataset.props || '';
      const equipped = card.querySelector('.item-equipped');
      const eqText = equipped ? '（已装备）' : '';
      tooltip.innerHTML = `
        <div class="item-tooltip-name">${name} ${eqText}</div>
        ${props ? `<div class="item-tooltip-save">${props}</div>` : ''}
        <div class="item-tooltip-desc">${description || '详细属性待补充'}</div>
      `;
      tooltip.classList.add('show');  // 先显示才能测量真实尺寸，避免越界修正失效
      positionTooltip(e, tooltip);
    }

    function positionTooltip(e, el) {
      const rect = el.getBoundingClientRect();
      let x = e.clientX + 14;
      let y = e.clientY - 10;
      if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - 14;
      if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 10;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }

    function hideTooltip() {
      tooltip.classList.remove('show');
    }

    function showSkillTooltip(block) {
      const spellId = block.dataset.spellId;
      const lookup = window.spellLookup || {};
      const spell = spellId ? lookup[spellId] : null;
      const name = block.textContent.trim();
      if (spell) {
        let html = `<div class="item-tooltip-name">${spell.name}</div>`;
        if (spell.school || spell.casting_time)
          html += `<div class="item-tooltip-save">${[spell.school, spell.casting_time].filter(Boolean).join(' · ')}</div>`;
        if (spell.description)
          html += `<div class="item-tooltip-desc">${spell.description}</div>`;
        if (spell.range)
          html += `<div class="item-tooltip-breakdown">射程：${spell.range}</div>`;
        tooltip.innerHTML = html;
      } else {
        tooltip.innerHTML = `<div class="item-tooltip-name">${name}</div><div class="item-tooltip-desc">详细描述待补充</div>`;
      }
      tooltip.classList.add('show');  // 先显示才能测量真实尺寸，避免越界修正失效
      const r = block.getBoundingClientRect();
      tooltip.style.left = Math.max(8, r.left) + 'px';
      tooltip.style.top = (r.bottom + 8) + 'px';
      const tr = tooltip.getBoundingClientRect();
      if (tr.right > window.innerWidth) tooltip.style.left = (window.innerWidth - tr.width - 8) + 'px';
      if (tr.bottom > window.innerHeight) tooltip.style.top = (r.top - tr.height - 8) + 'px';
    }

    /* 物品/装备槽/技能法术统一悬浮提示（mouseover/mouseout 委托，避免 timer 泄漏） */
    document.addEventListener('mouseover', function(e) {
      if (!e.target || typeof e.target.closest !== 'function') return;
      const card = e.target.closest('.item-card, .slot.filled, .inv-box-item, .trade-item');
      const block = e.target.closest('.skill-block');
      const el = card || block;
      if (!el) return;
      if (hoverTarget === el) return;  // 在元素内部移动，不重复计时
      hoverTarget = el;
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(() => {
        if (el.classList.contains('skill-block')) showSkillTooltip(el);
        else showTooltip(e, el);
      }, 500);
    });

    document.addEventListener('mouseout', function(e) {
      if (!e.target || typeof e.target.closest !== 'function') return;
      const card = e.target.closest('.item-card, .slot.filled, .inv-box-item, .trade-item');
      const block = e.target.closest('.skill-block');
      const el = card || block;
      if (!el) return;
      // 仍停留在同一元素内（进入其子元素）则忽略
      const to = e.relatedTarget;
      if (to && typeof to.closest === 'function' && to.closest('.item-card, .slot.filled, .inv-box-item, .trade-item, .skill-block') === el) return;
      clearTimeout(hoverTimer);
      hoverTimer = null;
      hoverTarget = null;
      hideTooltip();
    });

    document.addEventListener('scroll', function() {
      clearTimeout(hoverTimer);
      hoverTimer = null;
      hideTooltip();
    });
  })();

  const FALLBACK_ICON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line></svg>';

  async function loadSvgIcon(iconName) {
    if (svgIconCache[iconName] !== undefined) return svgIconCache[iconName];
    try {
      const res = await fetch(`/assets/icons/equipment/${iconName}.svg?v=${Date.now()}`);
      if (!res.ok) throw new Error(`Failed to load icon ${iconName}: ${res.status}`);
      const svgText = await res.text();
      svgIconCache[iconName] = svgText;
      return svgText;
    } catch (err) {
      console.warn('loadSvgIcon failed:', err);
      svgIconCache[iconName] = FALLBACK_ICON_SVG;
      return svgIconCache[iconName];
    }
  }

  function recalcCharacterStats(char) {
    const catalog = catalogs.equipment || {};
    const items = char.inventory?.items || [];
    const dexMod = Math.floor(((char.abilities?.dex?.value ?? 10) - 10) / 2);
    const strMod = Math.floor(((char.abilities?.str?.value ?? 10) - 10) / 2);
    // 攻击加值 = 熟练加值 + 属性调整值 + 武器加值（D&D 5e 规则）
    const prof = parseInt(String(char.skills?.proficiency_bonus || '+2').replace(/[^0-9-]/g, ''), 10) || 2;

    // AC：无甲基础 + 已装备护甲（取最高）+ 盾牌 + 饰品加值
    let ac = 10 + dexMod;
    let meleeDamage = null;
    let rangedDamage = null;
    let meleeBonus = 0;
    let rangedBonus = 0;
    for (const item of items) {
      if (!item.equipped) continue;
      const ci = catalog[item.equipment_id];
      if (!ci || !ci.stats) continue;
      if (ci.type === 'weapon') {
        if (ci.stats.category === 'melee' && !meleeDamage) {
          meleeDamage = ci.stats.damage_dice;
          meleeBonus = ci.stats.bonus || 0;
        }
        if (ci.stats.category === 'ranged' && !rangedDamage) {
          rangedDamage = ci.stats.damage_dice;
          rangedBonus = ci.stats.bonus || 0;
        }
      } else if (ci.type === 'armor') {
        const s = ci.stats;
        if (s.category === 'shield') {
          ac += (s.bonus_ac || 0);
        } else if (s.category !== 'clothes' && s.ac_base) {
          let a = s.ac_base;
          if (s.ac_ability === 'dex') {
            a += (s.ac_max_dex != null ? Math.min(dexMod, s.ac_max_dex) : dexMod);
          }
          if (a > ac) ac = a;
        }
      } else if (ci.type === 'accessory' && ci.stats && ci.stats.bonus_ac) {
        ac += ci.stats.bonus_ac;
      }
    }
    char.combat = char.combat || { ac: 10, hp: '0 / 0' };
    char.combat.ac = ac;
    char.attack = char.attack || { melee: {}, ranged: {} };
    const fmtBonus = v => (v >= 0 ? '+' : '') + v;
    char.attack.melee.bonus = fmtBonus(strMod + prof + meleeBonus);
    char.attack.melee.damage = meleeDamage ? meleeDamage + (meleeBonus ? `+${meleeBonus}` : '') : '1d4';
    char.attack.ranged.bonus = fmtBonus(dexMod + prof + rangedBonus);
    char.attack.ranged.damage = rangedDamage ? rangedDamage + (rangedBonus ? `+${rangedBonus}` : '') : '1d4';
  }

  /* 物品右键菜单（抄自 lobby.html，equip/discard 落地到角色数据） */
  (function initItemContextMenu() {
    const contextMenu = document.createElement('div');
    contextMenu.className = 'item-context-menu';
    document.body.appendChild(contextMenu);

    function hideContextMenu() { contextMenu.classList.remove('visible'); }

    function showContextMenu(e, card) {
      e.preventDefault();
      const equipped = !!card.querySelector('.item-equipped');
      const equipmentId = card.dataset.equipmentId;
      const catalogItem = catalogs.equipment ? catalogs.equipment[equipmentId] : null;
      const isEquippable = catalogItem && (catalogItem.type === 'weapon' || catalogItem.type === 'armor');
      const name = card.dataset.name || '';
      const isSupplyItem = card.dataset.kind === 'item';
      const itemId = card.dataset.itemId;
      const supplyItem = isSupplyItem && itemId ? state.data.items[itemId] : null;

      let html = '';
      if (isSupplyItem) {
        // 道具：有效果（如治疗药水）提供"使用"；有装备定义（如火把/矿灯）提供"装备"；均提供丢弃/赠送
        const equipDef = supplyItem && supplyItem.equipment_id
          ? (catalogs.equipment ? catalogs.equipment[supplyItem.equipment_id] : null) : null;
        if (supplyItem && supplyItem.effect) {
          html += `<button class="menu-action" data-action="use">使用</button>`;
        }
        if (equipDef) {
          html += `<button class="menu-action" data-action="equip">装备</button>`;
        }
        html += `<button class="menu-action" data-action="sell">出售</button>`;
        html += `<button class="menu-action" data-action="discard">丢弃</button>`;
        html += `<button class="menu-action" data-action="gift">赠送</button>`;
      } else {
        if (isEquippable) {
          html += `<button class="menu-action" data-action="equip">${equipped ? '卸下' : '装备'}</button>`;
        }
        html += `<button class="menu-action" data-action="discard">丢弃</button>`;
        html += `<button class="menu-action" data-action="gift">赠送</button>`;
      }
      contextMenu.innerHTML = html;

      let x = e.clientX;
      let y = e.clientY;
      const rect = contextMenu.getBoundingClientRect();
      if (x + 150 > window.innerWidth) x = window.innerWidth - 150;
      if (y + rect.height > window.innerHeight) y = e.clientY - rect.height;
      contextMenu.style.left = x + 'px';
      contextMenu.style.top = y + 'px';
      contextMenu.classList.add('visible');

      contextMenu.querySelectorAll('.menu-action').forEach(btn => {
        btn.addEventListener('click', async () => {
          const action = btn.dataset.action;
          contextMenu.classList.remove('visible');
          if (isSupplyItem) {
            await handleSupplyItemAction(action, itemId, name);
          } else {
            const src = card.dataset.src || 'char';
            const idx = parseInt(card.dataset.idx ?? '-1', 10);
            await handleItemAction(action, src, idx, name);
          }
        });
      });
    }

    document.addEventListener('contextmenu', function(e) {
      if (!e.target || typeof e.target.closest !== 'function') return;
      const card = e.target.closest('.item-card');
      if (!card) return;
      showContextMenu(e, card);
    });

    document.addEventListener('click', function(e) {
      if (!e.target || typeof e.target.closest !== 'function' || !e.target.closest('.item-context-menu')) {
        hideContextMenu();
      }
    });

    document.addEventListener('scroll', function() {
      hideContextMenu();
    });
  })();

  async function handleItemAction(action, src, idx, itemName) {
    const char = state.character;
    if (!char) return;
    const isTemp = src === 'temp';
    const list = isTemp ? state.tempEquipItems : (char.inventory?.items || []);
    const item = list[idx];
    if (!item) return;
    const equipmentId = item.equipment_id;
    const catalogItem = catalogs.equipment ? catalogs.equipment[equipmentId] : null;

    if (action === 'equip' && catalogItem && (catalogItem.type === 'weapon' || catalogItem.type === 'armor')) {
      if (item.equipped) {
        item.equipped = false;
      } else {
        // 护甲同类互斥：同 category 的护甲互斥，盾牌只与其他盾牌互斥
        // 双手武器占满两格：装备时自动卸下同类型的其他已装备武器
        const cat = catalogItem.stats ? catalogItem.stats.category : null;
        const twoHanded = catalogItem.type === 'weapon' && !!catalogItem.stats?.two_handed;
        const allEquip = [...(char.inventory?.items || []), ...(state.tempEquipItems || [])];
        allEquip.forEach(i => {
          if (i === item || !i.equipped) return;
          const ci = catalogs.equipment ? catalogs.equipment[i.equipment_id] : null;
          if (!ci || !ci.stats) return;
          if (catalogItem.type === 'armor') {
            if (ci.type === 'armor' && ci.stats.category === cat && ci.stats.category !== 'shield') i.equipped = false;
            if (ci.type === 'armor' && ci.stats.category === 'shield' && cat === 'shield') i.equipped = false;
          } else if (ci.type === 'weapon' && ci.stats.category === cat) {
            // 装备双手武器：卸下同类型所有武器（占满两格）；
            // 装备单手武器：卸下同类型中的双手武器（单手之间仍可双持）
            if (twoHanded || ci.stats.two_handed) i.equipped = false;
          }
        });
        item.equipped = true;
      }
    } else if (action === 'discard') {
      const removed = list.splice(idx, 1);
      if (removed.length > 0) await dropItemToLocation(equipmentId, itemName);
    } else if (action === 'gift') {
      appendLog('system', '赠送功能开发中。');
      return;
    }

    recalcCharacterStats(char);
    renderAllTabs();
    await renderRightPanel();
    // 阶段测试：内存装备（temp）不持久化，刷新即消失；角色原有装备正常保存
    if (!isTemp) await saveCharacter();
  }

  /* 物品定义查找：先查冒险物品，再查全局装备目录（丢弃物可能是装备） */
  function findItemDef(id) {
    if (state.data.items && state.data.items[id]) return state.data.items[id];
    return (catalogs.equipment && catalogs.equipment[id]) || null;
  }

  /* 物品效果文案：道具显示 effect（heal → 回复 X 生命值）；装备显示"造成 XdY 伤害"或护甲等级。
     章节物品（如火把/矿灯）仅引用 equipment_id，属性从全局装备库补充。 */
  function itemEffectText(item) {
    if (!item) return '';
    if (item.effect) {
      return item.effect.startsWith('heal') ? `回复 ${item.effect.slice(5)} 生命值` : item.effect;
    }
    const eq = item.equipment_id && catalogs.equipment ? catalogs.equipment[item.equipment_id] : null;
    const src = (eq && (eq.stats || eq.properties)) ? eq : item;
    if (src.stats && src.stats.damage_dice) {
      const type = src.stats.damage_type_cn ? ` ${src.stats.damage_type_cn}` : '';
      return `造成 ${src.stats.damage_dice}${type}伤害`;
    }
    // 护甲/盾牌：补全"护甲等级"描述（如"11 + 敏捷调整值"、"＋2"）
    if (src.properties && src.properties.ac) return `护甲等级 ${src.properties.ac}`;
    if (src.properties) return src.properties.damage || '';
    return '';
  }

  /* 丢弃物品到当前地点：落后端世界状态 + 前端本地记录（左侧物品列表显示） */
  async function dropItemToLocation(itemId, itemName) {
    try {
      const res = await fetch('/api/game/drop_item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: state.sessionId,
          adventure_id: ADVENTURE_ID,
          chapter_id: CHAPTER_ID,
          item_id: itemId,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '丢弃失败');
      if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
    } catch (err) {
      appendLog('system', `丢弃失败: ${err.message}`);
      return false;
    }
    // 本地记录：出现在当前地点左侧物品列表（其他角色/同页面可拾取）
    const loc = getCurrentLocation();
    if (loc) {
      state.droppedItems = state.droppedItems || {};
      const list = state.droppedItems[loc.id] || (state.droppedItems[loc.id] = []);
      if (!list.includes(itemId)) list.push(itemId);
    }
    renderContextPanel();
    appendLog('system', `已丢弃 ${itemName}`);
    return true;
  }

  /* 道具操作（治疗药水等）：使用回血（后端解析效果，播报实际恢复量），丢弃 */
  async function handleSupplyItemAction(action, itemId, itemName) {
    const char = state.character;
    if (!char) return;
    const item = state.data.items[itemId];

    if (action === 'sell') {
      // 出售：需要当前有打开的交易弹窗（确定卖给哪个商人）
      if (!currentTradeNpcId) {
        appendLog('system', '附近没有商人，无法出售。请先打开与商人的交易窗口。');
        return;
      }
      await callSellItem(currentTradeNpcId, itemId);
      if (tradeModalOverlay.classList.contains('active')) await renderTradeModal();
    } else if (action === 'use') {
      if (!item || !item.effect) {
        appendLog('system', '该道具无法使用。');
        return;
      }
      const combat = char.combat || { ac: 10, hp: '0 / 0' };
      const parts = String(combat.hp).split('/');
      const curHp = parseInt(parts[0]) || 0;
      const maxHp = parseInt(parts[1]) || curHp;
      // 通知后端解析效果并消耗道具（heal 由后端掷骰并按 HP 截断，返回实际恢复值与文案）
      try {
        const res = await fetch('/api/game/use_item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: state.sessionId,
            adventure_id: ADVENTURE_ID,
            chapter_id: CHAPTER_ID,
            item_id: itemId,
            character: state.character,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '使用失败');
        if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
        // HP 后端权威结算，从 updates 同步到角色卡
        applyGameUpdates(data.updates);
        // 播报后端生成的效果文案
        const actorName = (state.character && state.character.name) || '你';
        appendLog('gm', `${actorName} 使用了 ${item.name}${data.message ? `，${data.message}` : ''}。`);
        await renderAllTabs();
        await renderRightPanel();
        await saveCharacter();
      } catch (err) {
        appendLog('system', `使用失败: ${err.message}`);
        return;
      }
    } else if (action === 'equip') {
      if (!item || !item.equipment_id) return;
      // 通知后端同步移除背包道具（防止被 SSE 覆盖回去）
      try {
        const res = await fetch('/api/game/equip_item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: state.sessionId,
            adventure_id: ADVENTURE_ID,
            chapter_id: CHAPTER_ID,
            item_id: itemId,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '装备失败');
        if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
      } catch (err) {
        appendLog('system', `装备失败: ${err.message}`);
        return;
      }
      // 转移进角色装备栏（占近战槽，由 computeEquippedSlots 自动分配）
      char.inventory = char.inventory || { gold: 0, items: [] };
      char.inventory.items.push({ equipment_id: item.equipment_id, quantity: 1, equipped: true });
      const actorName = (state.character && state.character.name) || '你';
      appendLog('gm', `${actorName} 装备了 ${item.name}。`);
      recalcCharacterStats(char);
      await renderAllTabs();
      await renderRightPanel();
      await saveCharacter();
    } else if (action === 'discard') {
      const idx = state.playerInventory.indexOf(itemId);
      if (idx < 0) return;
      state.playerInventory.splice(idx, 1);
      await dropItemToLocation(itemId, itemName);
      await renderAllTabs();
    } else if (action === 'gift') {
      appendLog('system', '赠送功能开发中。');
    }
  }

  async function renderInventoryTab(char) {

    // 装备栏 = 角色已保存装备 + 阶段测试拿取的内存装备（刷新即消失）
    const tempItems = state.tempEquipItems || [];

      ...items.map((it, i) => ({ ...it, src: 'char', idx: i })),
      ...tempItems.map((it, i) => ({ ...it, src: 'temp', idx: i })),

      itemsHtml = '';

    } else {
      const itemsWithSvg = await Promise.all(equipItems.map(async item => {
        const catalogItem = item.equipment_id ? catalog[item.equipment_id] : null;
        const displayName = catalogItem ? catalogItem.name : (item.name || '未知物品');
        const iconName = catalogItem ? catalogItem.icon : 'pouch';

        const description = catalogItem ? catalogItem.description : '';

      supplyHtml = `
        <div class="inv-supplies-title">道具</div>
        <div class="items-grid">${supplyRows.join('')}</div>`;
    }
    // 装备区：装备类物品单独成栏
    const equipHtml = items.length > 0 ? `
        <div class="inv-supplies-title">装备</div>
        <div class="items-grid">${itemsHtml}</div>` : '';
    return `
      <div class="inventory-panel">

              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            背包物资
          </div>
          <div class="inventory-gold">${gold} G</div>
        </div>
        ${emptyDiv}
        ${equipHtml}
        ${supplyHtml}
      </div>
    `;
  }

  /* ═══ 职业特性（抄自 lobby renderClassAttr） ═══ */
  function renderClassAttrTab(char) {
    const features = catalogs.features || {};
    const classes = catalogs.classes || {};
    const classData = char.class_id ? classes[char.class_id] : null;
    const subclassData = classData && char.subclass_id ? (classData.subclasses || {})[char.subclass_id] : null;

    const statusItems = (char.features?.status_ids || []).map(id => features.status ? features.status[id] : null).filter(Boolean);
    const resistanceItems = (char.features?.resistance_ids || []).map(id => features.resistances ? features.resistances[id] : null).filter(Boolean);
    const classFeatureItems = (char.features?.class_feature_ids || []).map(id => features.class_features ? features.class_features[id] : null).filter(Boolean);
    const traitItems = (char.features?.trait_ids || []).map(id =>
      (features.traits && features.traits[id]) || (features.racial && features.racial[id]) || null
    ).filter(Boolean);

    const abilityOrder = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
    const abilityHtml = abilityOrder.map(key => {
      const a = char.abilities[key];
      return `<div class="ability">
        <div class="ability-star">${a.highlighted ? '&#9733;' : ''}</div>
        <div class="ability-label">${escapeHtml(a.label)}</div>
        <div class="ability-value ${a.highlighted ? 'highlighted' : ''}">${a.value}</div>
      </div>`;
    }).join('');

    const featSection = (title, items) => items.length
      ? `<div class="divider"><span>${title}</span></div><ul class="feature-list">${items.map(f => `<li>${escapeHtml(f.name)} <span class="feature-arrow"><svg viewBox="0 0 12 8"><polyline points="2,2 6,6 10,2"></polyline></svg></span></li><div class="feature-detail">${escapeHtml(f.description || '')}</div>`).join('')}</ul>`
      : '';

    const raceName = char.background?.race || '';
    const className = classData ? classData.name : (char.class || '');
    return `
      <div class="class-panel">
        <div class="class-race">${escapeHtml(raceName)}</div>
        <div class="class-icon">${escapeHtml(classData ? (classData.icon || '') : '')}</div>
        <div class="class-subclass">${escapeHtml(subclassData ? subclassData.name : '')}</div>
        <div class="class-level">等级${char.level || 1} ${escapeHtml(className)}</div>

        <div class="ability-scores">${abilityHtml}</div>
        ${featSection('状态', statusItems)}
        ${featSection('抗性', resistanceItems)}
        ${featSection('职业特性', classFeatureItems)}
        ${featSection('重要特性', traitItems)}
      </div>
    `;
  }

  /* ═══ 熟练加值（抄自 lobby renderSkills） ═══ */
  function renderSkillsTab(char) {

  /* ═══ 技能&法术（抄自 lobby renderSpells） ═══ */
  function renderSpellsTab(char) {
    const spells = catalogs.spells || {};

    // 构建快速查找表
    window.spellLookup = {};
    const addLookup = (catalog) => { if (catalog) Object.entries(catalog).forEach(([id, s]) => { window.spellLookup[id] = s; }); };
    addLookup(spells.actions?.normal);
    addLookup(spells.actions?.class);
    addLookup(spells.passive);
    addLookup(spells.spells?.level_1);
    addLookup(spells.cantrips);

    const lookupNames = (ids, catalog) =>
      (ids || []).map(id => (catalog && catalog[id]) ? catalog[id].name : id);

    const normalItems = lookupNames((char.spells?.action_ids || {}).normal || [], spells.actions?.normal);
    const classItems  = lookupNames((char.spells?.action_ids || {}).class || [], spells.actions?.class);
    const passiveItems = lookupNames(char.spells?.passive_ids || [], spells.passive);

    const renderBlock = (name, spellId) =>
      `<div class="skill-block" data-spell-id="${escapeHtml(spellId || '')}">${escapeHtml(name)}</div>`;

    const renderGroup = (list, catalog) => {
      return list.map(item => {
        const entries = catalog ? Object.entries(catalog) : [];
        const found = entries.find(([, v]) => v.name === item);
        return renderBlock(item, found ? found[0] : '');
      }).join('');
    };

    const section = (title, items, catalog) => items.length
      ? `<div class="divider"><span>${title}</span></div><div class="skill-grid">${renderGroup(items, catalog)}</div>`
      : '';

    // ── 法术环：戏法（0 环，无限施放，不消耗法术位）+ 1 环（消耗法术位，长休恢复）──
    const casterLevel = (char.spells?.caster_level) || 1;
    const slotMax1 = casterLevel >= 2 ? 3 : 2;  // 与后端 spell_slot_max 一致（简化：1 级 2 个、2 级 3 个）
    const slotUsed1 = (state.spellSlotsUsed || {})[1] || 0;

    const renderSpellBlock = (spellId) => {
      const s = window.spellLookup[spellId];
      const name = s ? s.name : spellId;
      return `<div class="skill-block spell-block" data-spell-id="${escapeHtml(spellId)}">${escapeHtml(name)}</div>`;
    };
    const renderSpellGroup = (ids) => (ids || []).map(renderSpellBlock).join('');

    const spellL1 = (char.spells?.spell_ids || {}).level_1 || [];
    const cantrips = char.cantrip_ids || [];
    const slotText1 = `${Math.max(0, slotMax1 - slotUsed1)} / ${slotMax1}`;

    return `
      ${section('常规动作', normalItems, spells.actions?.normal)}
      ${section('职业动作', classItems, spells.actions?.class)}
      ${section('被动技能', passiveItems, spells.passive)}
      ${cantrips.length ? `<div class="divider"><span>戏法 · 无限施放</span></div><div class="skill-grid">${renderSpellGroup(cantrips)}</div>` : ''}
      ${spellL1.length ? `<div class="divider"><span>1 环法术 · 法术位 ${slotText1}</span></div><div class="skill-grid">${renderSpellGroup(spellL1)}</div>` : ''}
    `;
  }

  /* ═══ 人物背景（抄自 lobby renderBackground） ═══ */
  function renderBackgroundTab(char) {
    const bg = char.background;
    const labelMap = { move_speed:'移动速度', darkvision:'黑暗视觉范围', ranged_range:'远程攻击范围', melee_range:'近战攻击范围', throw_range:'投掷范围', size:'体型', weight:'重量', carry_weight:'负重' };
    const attrsHtml = Object.entries(bg.attributes || {}).map(([k, v]) =>
      `<div class="bg-info-row"><span class="bg-info-label">${labelMap[k] || k}</span><span class="bg-info-value">${escapeHtml(String(v))}</span></div>`
    ).join('');

    const saveAbilities = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
    const saveHtml = saveAbilities.map(key => {
      const a = char.abilities[key];
      return `<div class="ability"><div class="ability-label">${escapeHtml(a.label)}</div><div class="ability-value highlighted">${escapeHtml(a.save_bonus)}</div></div>`;
    }).join('');

    const traitMap = { personality:'个人特点', ideal:'理想', bond:'牵绊', flaw:'缺点' };
    const traitsHtml = Object.entries(bg.traits || {}).map(([k, text]) =>
      `<div class="bg-trait"><div class="bg-trait-title">${traitMap[k] || k}</div><div class="bg-trait-text">${escapeHtml(text || '—')}</div></div>`

    return `
