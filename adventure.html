  /* ── 详情弹窗 ── */
  let currentModalType = null;
  let currentModalId = null;

  async function openDetailModal(type, id, extra) {
    currentModalType = type;
    currentModalId = id;
    let title = '';
    let meta = '';
    let desc = '';
    let avatar = '?';
    let extraContent = '';

    switch (type) {
      case 'npc': {
        const npc = state.data.npcs[id];
        if (!npc) return;
        title = npc.name;
        meta = `${npc.race || ''} · ${npc.role || ''}`;
        desc = npc.description || '';
        avatar = npc.name[0];
        // 带 merchant 字段的 NPC 可交易
        if (npc.merchant) {
          extraContent = `
            <button type="button" class="trade-btn trade-open" data-npc="${id}" style="width:100%; padding:9px 0; font-size:14px;">交易</button>`;
        }
        break;
      }
      case 'item': {
        const item = findItemDef(id);
        if (!item) return;
        title = item.name;
        meta = item.type || '';
        desc = item.description || '';
        avatar = 'I';
        extraContent = await buildItemModalExtra(id, item);
        break;
      }
      case 'exit': {
        const targetLoc = state.data.locations[id];
        title = extra.name || '出口';
        meta = extra.description || '';
        desc = targetLoc ? `通往: ${targetLoc.name}` : '';
        avatar = '→';
        break;
      }
      case 'location': {
        const loc = state.data.locations[id];
        if (!loc) return;
        title = loc.name;
        meta = loc.type || '';
        desc = loc.description || '';
        avatar = loc.name[0];
        break;
      }
    }

    modalContent.innerHTML = `
      <div class="modal-header">
        <div class="modal-avatar">${avatar}</div>
        <div>
          <div class="modal-name">${title}</div>
          <div class="modal-meta">${meta}</div>
        </div>
      </div>
      <div class="modal-desc">${desc.replace(/\n/g, '<br>')}</div>
      ${extraContent}
    `;

    modalContent.querySelectorAll('.take-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const containerId = btn.dataset.container || null;
        const itemId = btn.dataset.item;
        await callTakeItem(containerId, itemId);
      });
    });

    // 交易按钮：关闭详情弹窗后打开交易弹窗
    modalContent.querySelectorAll('.trade-open').forEach(btn => {
      btn.addEventListener('click', () => {
        closeDetailModal();
        openTradeModal(btn.dataset.npc);
      });
    });

    modalOverlay.classList.add('active');
  }

  /* 物品详情附加内容：容器显示内含物品，普通无主物品显示拿取按钮 */
  async function buildItemModalExtra(itemId, item) {
    const contains = item.contains || [];
    const parts = [];
    const loc = getCurrentLocation();

    if (contains.length > 0) {
      // 容器：按 contains 聚合剩余数量（减去已取走的）
      const taken = (loc && state.containerTaken[loc.id]?.[itemId]) || [];
      const counts = {};
      for (const cid of contains) {
        const remaining = contains.filter(x => x === cid).length - taken.filter(x => x === cid).length;
        if (remaining > 0) counts[cid] = remaining;
      }
      let rows = '';
      if (Object.keys(counts).length > 0) {
        const items = await Promise.all(Object.entries(counts).map(async ([cid, n]) => {
          const sub = state.data.items[cid];
          if (!sub) return '';
          const iconSvg = await loadSvgIcon(sub.icon || 'pouch');
          const props = itemEffectText(sub);
          return `
            <div class="inv-box-item" data-name="${escapeHtml(sub.name)}" data-description="${escapeHtml(sub.description || '')}" data-props="${escapeHtml(props)}">
              <div class="item-icon">${iconSvg}</div>
              <div class="inv-box-name">${escapeHtml(sub.name)} <span class="inv-box-qty">×${n}</span></div>
              <button type="button" class="take-btn" data-container="${itemId}" data-item="${cid}">拿取</button>
            </div>`;
        }));
        rows = items.join('');
      }
      parts.push(`<div class="modal-section-title">内含物品</div><div class="inv-box-list">${rows || '<div class="context-empty">箱子已空</div>'}</div>`);
    } else {
      // 普通物品：当前地点可见（含本会话丢弃物）且无主 → 可拿取
      const locItemIds = (loc ? (loc.items || []) : []).map(e => (typeof e === 'object' ? e.id : e));
      const isDroppedHere = !!(loc && (state.droppedItems || {})[loc.id] && (state.droppedItems)[loc.id].includes(itemId));
      if ((locItemIds.includes(itemId) || isDroppedHere) && !item.owner) {
        parts.push(`<div class="inv-box-list"><div class="inv-box-item"><button type="button" class="take-btn" data-item="${itemId}">拿取</button></div></div>`);
      }
    }

    return parts.join('');
  }

  /* 拿取物品（专用端点，不经 AI 解析） */
  async function callTakeItem(containerId, itemId) {
    try {
      const res = await fetch('/api/game/take_item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: state.sessionId,
          adventure_id: ADVENTURE_ID,
          chapter_id: CHAPTER_ID,
          container_id: containerId || undefined,
          item_id: itemId,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '拿取失败');
      if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
      if (data.updates.container_taken) state.containerTaken = data.updates.container_taken;
      const item = state.data.items[itemId];
      const actorName = (state.character && state.character.name) || '你';
      appendLog('gm', `${actorName} 拿取了 ${item ? item.name : itemId}${containerId ? '。' : '，收进背包。'}`);
      if (data.is_equipment && item && item.equipment_id) {
        // 阶段测试：拿取的装备进前端内存（刷新页面即消失，不持久化到角色卡）
        state.tempEquipItems.push({ equipment_id: item.equipment_id, quantity: 1, equipped: false });
      }
      if (!containerId) {
        // 普通物品：从当前地点本地移除并记录（切场景回来不重复显示）
        state.takenLocationItems.push(itemId);
        const loc = getCurrentLocation();
        if (loc) {
          if (Array.isArray(loc.items)) {
            loc.items = loc.items.filter(e => (typeof e === 'object' ? e.id : e) !== itemId);
          }
          // 若是本会话丢弃的物品，拾取后从左侧丢弃列表移除
          const dropped = (state.droppedItems || {})[loc.id];
          if (dropped) {
            const di = dropped.indexOf(itemId);
            if (di >= 0) dropped.splice(di, 1);
          }
        }
      }
      // 拿取成功：关闭详情弹窗并刷新左侧与背包（不再重开弹窗，避免再次弹出）
      closeDetailModal();
      renderContextPanel();
      await renderAllTabs();
    } catch (err) {
      appendLog('system', `拿取失败: ${err.message}`);
    }
  }

  let expandedQuestIds = new Set();
  let selectedSubtask = null;

  function openQuestDetailModal(questId, subtaskIdx) {
    const questsRaw = state.quests || state.data.quests;

    // 构建任务列表（排除 hidden）
    const allQuests = Object.values(questsRaw)
      .filter(q => q.status !== 'hidden')
      .map(q => ({
        id: q.id,
        title: q.name,
        description: q.description,
        completed: q.status === 'completed' || (q.objectives && q.objectives.length > 0 && q.objectives.every(o => o.completed)),
        objectives: (q.objectives || []).map(o => ({ text: o.description, description: o.description, completed: o.completed })),
        reward: q.reward,
      }));

    const activeQuests = allQuests.filter(q => !q.completed);
    const completedQuests = allQuests.filter(q => q.completed);

    let selectedQuestId = questId;
    expandedQuestIds = new Set([questId]);
    selectedSubtask = subtaskIdx != null ? { questId: questId, subtaskIdx } : null;

    function renderSidebar() {
      let html = '';

      if (activeQuests.length > 0) {
        html += `
          <div class="task-category" data-category="active">
            <div class="task-category-title" data-category-toggle="active">
              <span>进行中</span>
              <span class="task-category-arrow">
                <svg viewBox="0 0 12 8"><polyline points="2,2 6,6 10,2"></polyline></svg>
              </span>
            </div>
            <div class="task-category-list">
              ${activeQuests.map(q => renderNavItem(q)).join('')}
            </div>
          </div>
        `;
      }

      if (completedQuests.length > 0) {
        html += `
          <div class="task-category" data-category="completed">
            <div class="task-category-title" data-category-toggle="completed">
              <span>已完成任务</span>
              <span class="task-category-arrow">
                <svg viewBox="0 0 12 8"><polyline points="2,2 6,6 10,2"></polyline></svg>
              </span>
            </div>
            <div class="task-category-list">
              ${completedQuests.map(q => renderNavItem(q)).join('')}
            </div>
          </div>
        `;
      }

      return html;
    }

    function buildSubtaskRows(quest) {
      if (!quest.objectives || quest.objectives.length === 0) return '';
      // 防剧透：只显示已完成子任务 + 第一个未完成子任务
      let fiIdx = quest.objectives.findIndex(o => !o.completed);
      if (fiIdx === -1) fiIdx = quest.objectives.length;
      const visibleObjs = quest.objectives.slice(0, fiIdx + 1);
      return visibleObjs.map((st, idx) => {
        const subCompleted = st.completed ? ' completed' : '';
        const subActive = selectedSubtask && selectedSubtask.questId === quest.id && selectedSubtask.subtaskIdx === idx ? ' active' : '';
        const subName = st.text + (st.completed ? '（已完成）' : '');
        return `
          <div class="task-sub-nav-item${subCompleted}${subActive}" data-quest-id="${quest.id}" data-subtask-idx="${idx}">
            <span class="sub-nav-dot"></span>
            <span class="task-sub-nav-name">${escapeHtml(subName)}</span>
          </div>
        `;
      }).join('');
    }

    function renderNavItem(quest) {
      const isActive = quest.id === selectedQuestId;
      const completedClass = quest.completed ? ' task-completed' : '';
      const statusText = quest.completed ? '已完成' : '进行中';
      const statusClass = quest.completed ? 'completed' : 'ongoing';
      const hasSubtasks = quest.objectives && quest.objectives.length > 0;
      const isExpanded = expandedQuestIds.has(quest.id);
      const expandClass = isExpanded ? ' expanded' : '';
      const noExpandClass = !hasSubtasks ? ' no-expand' : '';

      const subtaskRows = hasSubtasks && isExpanded ? buildSubtaskRows(quest) : '';

      return `
        <div class="task-nav-item${isActive ? ' active' : ''}${completedClass}${expandClass}${noExpandClass}" data-quest-id="${quest.id}">
          <span class="task-nav-name">${escapeHtml(quest.title)}</span>
          <span class="task-nav-status ${statusClass}">${statusText}</span>
          ${hasSubtasks ? `
            <span class="task-nav-arrow">
              <svg viewBox="0 0 12 8"><polyline points="2,2 6,6 10,2"></polyline></svg>
            </span>
          ` : ''}
        </div>
        ${subtaskRows}
      `;
    }

    function renderQuestDetail(quest) {
      const tagClass = quest.completed ? 'completed' : 'ongoing';
      const tagText = quest.completed ? '已完成' : '进行中';
      const objectives = quest.objectives || [];

      // 防剧透：只显示已完成子任务 + 第一个未完成子任务
      let firstIncompleteIdx = objectives.findIndex(o => !o.completed);
      if (firstIncompleteIdx === -1) firstIncompleteIdx = objectives.length;
      const visibleObjectives = objectives.slice(0, firstIncompleteIdx + 1);

      let subtasksHtml = '';
      if (visibleObjectives.length > 0) {
        subtasksHtml = `
          <div class="task-section-title">阶段目标</div>
          <div class="task-subtasks">
            ${visibleObjectives.map(st => `
              <div class="subtask${st.completed ? ' completed' : ''}">
                <div class="subtask-check">
                  ${st.completed
                    ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>'
                    : '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>'}
                </div>
                <div class="subtask-text">${escapeHtml(st.text)}${st.completed ? '（已完成）' : ''}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      return `
        <div class="task-detail-header">
          <div class="task-detail-tag ${tagClass}">${tagText}</div>
          <h2>${escapeHtml(quest.title)}</h2>
        </div>
        <div class="task-detail-body">
          ${subtasksHtml}
          <div class="task-description">${escapeHtml(quest.description || '')}</div>
        </div>
      `;
    }

    function renderSubtaskDetail(qid, idx) {
      const quest = allQuests.find(q => q.id === qid);
      if (!quest) return '';
      const st = quest.objectives && quest.objectives[idx];
      if (!st) return '';

      const tagClass = st.completed ? 'completed' : 'ongoing';
      const tagText = st.completed ? '已完成' : '进行中';

      return `
        <div class="task-detail-header">
          <div class="task-detail-tag ${tagClass}">${tagText}</div>
          <h2>${escapeHtml(st.text)}</h2>
        </div>
        <div class="task-detail-body">
          <div class="task-description">${escapeHtml(st.description || '详细描述待补充。')}</div>
        </div>
      `;
    }

    function renderDetail() {
      if (selectedSubtask) {
        return renderSubtaskDetail(selectedSubtask.questId, selectedSubtask.subtaskIdx);
      }
      const curQ = allQuests.find(q => q.id === selectedQuestId);
      return curQ ? renderQuestDetail(curQ) : '';
    }

    function bindSubtaskEl(sub) {
      sub.addEventListener('click', (e) => {
        e.stopPropagation();
        const qid = sub.dataset.questId;
        const idx = parseInt(sub.dataset.subtaskIdx);
        selectedQuestId = qid;
        selectedSubtask = { questId: qid, subtaskIdx: idx };
        refreshModal();
      });
    }

    function refreshModal() {
      modalContent.innerHTML = `
        <div class="task-columns">
          <div class="task-sidebar">${renderSidebar()}</div>
          <div class="task-detail" id="task-modal-detail">${renderDetail()}</div>
        </div>
      `;

      // 分类折叠/展开
      modalContent.querySelectorAll('.task-category-title').forEach(title => {
        title.addEventListener('click', () => {
          const category = title.closest('.task-category');
          if (category) category.classList.toggle('collapsed');
        });
      });

      // 任务项点击
      modalContent.querySelectorAll('.task-nav-item').forEach(item => {
        item.addEventListener('click', (e) => {
          const qid = item.dataset.questId;
          const arrowEl = item.querySelector('.task-nav-arrow');

          if (arrowEl && arrowEl.contains(e.target)) {
            // 切换展开/折叠（局部操作，保证箭头旋转动画生效）
            const willExpand = !expandedQuestIds.has(qid);
            if (willExpand) expandedQuestIds.add(qid);
            else expandedQuestIds.delete(qid);
            item.classList.toggle('expanded', willExpand);

            // 局部插入/移除子任务行，避免整块重渲染导致动画失效
            if (willExpand) {
              const quest = allQuests.find(q => q.id === qid);
              item.insertAdjacentHTML('afterend', buildSubtaskRows(quest));
              let nxt = item.nextElementSibling;
              while (nxt && nxt.classList.contains('task-sub-nav-item')) {
                bindSubtaskEl(nxt);
                nxt = nxt.nextElementSibling;
              }
            } else {
              let nxt = item.nextElementSibling;
              while (nxt && nxt.classList.contains('task-sub-nav-item')) {
                const cur = nxt;
                nxt = nxt.nextElementSibling;
                cur.remove();
              }
            }

            if (selectedSubtask && selectedSubtask.questId === qid) {
              selectedSubtask = null;
            }
            selectedQuestId = qid;
            const detailEl = modalContent.querySelector('#task-modal-detail');
            if (detailEl) detailEl.innerHTML = renderDetail();
            return;
          }

          // 普通点击——选中任务
          selectedQuestId = qid;
          selectedSubtask = null;
          expandedQuestIds.add(qid);
          refreshModal();
        });
      });

      // 子任务项点击
      modalContent.querySelectorAll('.task-sub-nav-item').forEach(bindSubtaskEl);
    }

    refreshModal();
    $('#detail-modal').classList.add('task-panel');
    modalOverlay.classList.add('active');
  }

  function closeDetailModal() {

    currentModalId = null;

    // 延迟移除 task-panel，等 overlay 淡出动画 (0.25s) 完成再恢复尺寸
    setTimeout(() => {

  /* ── 交易系统 ── */
  let currentTradeNpcId = null;

  /* 商人是否已敌对（偷窃败露/失败后涨价） */
  function isHostileTo(npcId) {
    return (state.hostileNpcs || []).includes(npcId);
  }

  /* 商人收购价：库存内物品按售价半价，否则按物品自身 price 半价（与后端一致）；敌对后买价 ×1.5、卖价更低 */
  function merchantOffer(npc, itemId) {
    const entry = (npc.merchant.inventory || []).find(e => e.item_id === itemId);
    const item = findItemDef(itemId);
    let price = entry ? entry.price : (item && item.price);
    if (price == null) return null;
    if (isHostileTo(currentTradeNpcId)) price = Math.ceil(price * 1.5);
    return Math.max(1, Math.round(price / 2));
  }

  async function renderTradeModal() {
    const npc = state.data.npcs[currentTradeNpcId];
    if (!npc || !npc.merchant) return;
    const tradeContent = $('#trade-modal-content');
    const merchantGold = (state.merchantStates[currentTradeNpcId] && state.merchantStates[currentTradeNpcId].gold != null)
      ? state.merchantStates[currentTradeNpcId].gold : (npc.merchant.gold || 0);
    const char = state.character || {};
    const playerGold = (char.inventory && char.inventory.gold) || 0;

    // 商人货架
    const soldMap = (state.merchantStates[currentTradeNpcId] && state.merchantStates[currentTradeNpcId].sold) || {};
    const stolenMap = (state.merchantTheft[currentTradeNpcId]) || {};
    const hostile = isHostileTo(currentTradeNpcId);
    const shopRows = await Promise.all((npc.merchant.inventory || []).map(async entry => {
      const sub = findItemDef(entry.item_id);
      if (!sub) return '';
      const iconSvg = await loadSvgIcon(sub.icon || 'pouch');
      const props = itemEffectText(sub);
      const stockLeft = entry.stock == null ? null : Math.max(0, entry.stock - (soldMap[entry.item_id] || 0) - (stolenMap[entry.item_id] || 0));
      if (stockLeft === 0) return ''; // 售罄的商品直接从货架移除
      const stockText = stockLeft != null ? `<span class="trade-item-qty">剩余${stockLeft}</span>` : '';
      const displayPrice = hostile ? Math.ceil(entry.price * 1.5) : entry.price;
      return `
        <div class="trade-item" data-name="${escapeHtml(sub.name)}" data-description="${escapeHtml(sub.description || '')}" data-props="${escapeHtml(props)}">
          <div class="item-icon">${iconSvg}</div>
          <div class="trade-item-name">${escapeHtml(sub.name)} ${stockText}</div>
          <div class="trade-item-price">${displayPrice} G${hostile ? '<span class="trade-item-qty" title="敌对商人涨价">▲</span>' : ''}</div>
          <button type="button" class="trade-btn" data-buy="${escapeHtml(entry.item_id)}">购买</button>
        </div>`;
    }));
    const shopHtml = shopRows.join('') || '<div class="trade-empty">货架空空如也</div>';

    // 你的背包：可出售道具（按 id 聚合数量），装备类物品暂不可出售
    const invItems = state.playerInventory || [];
    const counts = {};
    invItems.forEach(iid => counts[iid] = (counts[iid] || 0) + 1);
    const bagRows = await Promise.all(Object.entries(counts).map(async ([iid, n]) => {
      const sub = findItemDef(iid);
      if (!sub) return '';
      const offer = merchantOffer(npc, iid);
      if (offer == null) return '';
      const iconSvg = await loadSvgIcon(sub.icon || 'pouch');
      const props = itemEffectText(sub);
      return `
        <div class="trade-item" data-sell="${escapeHtml(iid)}" data-name="${escapeHtml(sub.name)}" data-description="${escapeHtml(sub.description || '')}" data-props="${escapeHtml(props)}">
          <div class="item-icon">${iconSvg}</div>
          <div class="trade-item-name">${escapeHtml(sub.name)} <span class="trade-item-qty">×${n}</span></div>
          <div class="trade-item-price">${offer} G</div>
          <button type="button" class="trade-btn sell" data-sell="${escapeHtml(iid)}">出售</button>
        </div>`;
    }));
    const bagHtml = bagRows.join('') || '<div class="trade-empty">背包里没有可出售的道具</div>';

    tradeContent.innerHTML = `
      <div class="trade-header">
        <div class="trade-title"><span class="modal-avatar">${escapeHtml(npc.name[0] || '?')}</span>
          交易 · ${escapeHtml(npc.name)}<span class="trade-role">（${escapeHtml(npc.role || '')}）</span>
        </div>
        <div class="trade-gold">商人金币 ${merchantGold} G</div>
      </div>
      <div class="trade-cols">
        <div class="trade-col">
          <div class="trade-col-title">商人货架</div>
          ${shopHtml}
        </div>
        <div class="trade-col">
          <div class="trade-col-title">你的背包 <span class="trade-item-qty">${playerGold} G</span></div>
          ${bagHtml}
        </div>
      </div>`;

    tradeContent.querySelectorAll('[data-buy]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        await callBuyItem(currentTradeNpcId, btn.dataset.buy);
        await renderTradeModal();
      });
    });
    tradeContent.querySelectorAll('[data-sell]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        await callSellItem(currentTradeNpcId, btn.dataset.sell);
        await renderTradeModal();
      });
    });
    // 背包行右键：弹出出售菜单（复用 item-context-menu 样式）
    tradeContent.querySelectorAll('.trade-item[data-sell]').forEach(row => {
      row.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const itemId = row.dataset.sell;
        document.querySelectorAll('.trade-context-menu').forEach(m => m.remove());
        const menu = document.createElement('div');
        menu.className = 'item-context-menu trade-context-menu visible';
        menu.innerHTML = `<button class="menu-action" data-action="sell">出售</button>`;
        document.body.appendChild(menu);
        let x = e.clientX, y = e.clientY;
        const rect = menu.getBoundingClientRect();
        if (x + 150 > window.innerWidth) x = window.innerWidth - 150;
        if (y + rect.height > window.innerHeight) y = e.clientY - rect.height;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        menu.querySelector('button').addEventListener('click', async () => {
          menu.remove();
          await callSellItem(currentTradeNpcId, itemId);
          await renderTradeModal();
        });
        const hide = (ev) => {
          if (!menu.contains(ev.target)) {
            menu.remove();
            document.removeEventListener('click', hide);
            document.removeEventListener('scroll', hide);
          }
        };
        setTimeout(() => {
          document.addEventListener('click', hide);
          document.addEventListener('scroll', hide);
        }, 0);
      });
    });
  }

  function openTradeModal(npcId) {
    currentTradeNpcId = npcId;
    renderTradeModal();
    tradeModalOverlay.classList.add('active');
  }

  /* 汇总本次交易（购买/出售的物品与金额），关闭交易弹窗时一次性播报 */
  function summarizeTradeLog() {
    const log = state.tradeLog || [];
    if (log.length === 0) return null;
    const buys = {}, sells = {};
    let buyGold = 0, sellGold = 0;
    log.forEach(t => {
      if (t.type === 'buy') { buys[t.name] = (buys[t.name] || 0) + t.qty; buyGold += t.gold; }
      else { sells[t.name] = (sells[t.name] || 0) + t.qty; sellGold += t.gold; }
    });
    const fmt = o => Object.entries(o).map(([n, q]) => q > 1 ? `${n}×${q}` : n).join('、');
    const parts = [];
    if (Object.keys(buys).length) parts.push(`购买了 ${fmt(buys)}，花费 ${buyGold} 金币`);
    if (Object.keys(sells).length) parts.push(`出售了 ${fmt(sells)}，获得 ${sellGold} 金币`);
    const npc = state.data.npcs[currentTradeNpcId];
    const npcName = npc ? npc.name : '商人';
    const actor = (state.character && state.character.name) || '你';
    return `${actor}与${npcName}完成交易：${parts.join('；')}。`;
  }

  function closeTradeModal() {
    const msg = summarizeTradeLog();
    if (msg) appendLog('gm', msg);
    state.tradeLog = [];
    currentTradeNpcId = null;
    tradeModalOverlay.classList.remove('active');
  }

  async function callBuyItem(npcId, itemId) {
    try {
      const res = await fetch('/api/game/buy_item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: state.sessionId,
          adventure_id: ADVENTURE_ID,
          chapter_id: CHAPTER_ID,
          npc_id: npcId,
          item_id: itemId,
          quantity: 1,
          location_id: currentLocationId(),
          character: state.character,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '购买失败');
      if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
      if (data.updates.merchant_states) state.merchantStates = data.updates.merchant_states;
      if (state.character && data.gold != null) {
        state.character.inventory = state.character.inventory || { gold: 0, items: [] };
        state.character.inventory.gold = data.gold;
      }
      if (data.is_equipment) {
        const item = findItemDef(itemId);
        if (item) {
          // 全局装备库物品没有 equipment_id 字段，直接用 item_id 作为装备索引
          const eqId = item.equipment_id || itemId;
          state.tempEquipItems.push({ equipment_id: eqId, quantity: 1, equipped: false });
        }
      }
      // 静默记录交易，关闭交易弹窗时统一播报
      const bought = findItemDef(itemId);
      state.tradeLog.push({ type: 'buy', name: bought ? bought.name : itemId, qty: data.quantity || 1, gold: data.cost || 0 });
      await renderAllTabs();
      await renderRightPanel();
      // 金币由后端写回角色 JSON，前端只读展示
    } catch (err) {
      appendLog('system', `购买失败: ${err.message}`);
    }
  }

  const tradeModalOverlay = $('#trade-modal-overlay');

  /* ── 偷窃系统 ── */
  function applyGameUpdates(updates) {
    if (!updates) return;
    if (updates.player_inventory) state.playerInventory = updates.player_inventory;
    if (updates.merchant_states) state.merchantStates = updates.merchant_states;
    if (updates.hostile_npcs) state.hostileNpcs = updates.hostile_npcs;
    if (updates.suspicion) state.suspicion = updates.suspicion;
    if (updates.npc_alerts) state.npcAlerts = updates.npc_alerts;
    if (updates.merchant_theft) state.merchantTheft = updates.merchant_theft;
    if (updates.player_stealth) state.playerStealth = updates.player_stealth;
    // 被抓住状态 / 通缉 / 逮捕（卫兵流程、监狱）
    if (updates.caught) state.caught = updates.caught;
    if (updates.wanted_location !== undefined) state.wantedLocation = updates.wanted_location;
    if (updates.arrest !== undefined) state.arrest = updates.arrest;
    // 逃脱传送：后端已切换地点，同步前端场景 location 并刷新
    if (updates.location_id !== undefined && updates.location_id !== currentLocationId()) {
      const scene = getCurrentScene();
      if (scene) {
        scene.location = updates.location_id;
        const loc = state.data.locations[updates.location_id];
        if (loc) {
          appendLog('system', `你来到了: ${loc.name}`);
          renderLocationHeader();
          renderContextPanel();
        }
      }
    }
    // HP / 法术位 / 短休（后端权威，同步到角色卡显示）
    if (updates.player_hp) {
      state.playerHp = updates.player_hp;
      if (state.character) {
        state.character.combat = state.character.combat || {};
        state.character.combat.hp = `${updates.player_hp.cur} / ${updates.player_hp.max}`;
      }
    }
    if (updates.spell_slots_used !== undefined) state.spellSlotsUsed = updates.spell_slots_used;
    if (updates.short_rests_left !== undefined) state.shortRestsLeft = updates.short_rests_left;
    watchSuspicion(updates);
    watchArrest(updates.arrest);
  }

  /* 监狱狱卒巡逻：在场时真实时间倒计时（guard_until 为秒级时间戳），到点播报"去巡逻"并本地置 away，
     玩家此时可以撬锁（后端在下一次动作时懒计算确认，权威状态以后端为准） */
  let jailGuardTimer = null;
  function watchArrest(arrest) {
    if (jailGuardTimer) { clearTimeout(jailGuardTimer); jailGuardTimer = null; }
    if (!arrest || !arrest.active || arrest.phase !== 'jailed') return;
    if (arrest.jail_guard !== 'present') return;
    const msLeft = (arrest.guard_until || 0) * 1000 - Date.now();
    if (msLeft <= 0) return;
    jailGuardTimer = setTimeout(() => {
      jailGuardTimer = null;
      if (state.arrest && state.arrest.active && state.arrest.phase === 'jailed' &&
          state.arrest.jail_guard === 'present') {
        state.arrest.jail_guard = 'away';
        appendLog('system', '狱卒起身去巡逻了，走廊里暂时没人——现在可以试着撬锁！');
      }
    }, msLeft);
  }

  /* 当前是否正被怀疑（强制对话中）：flagrante（情况二，人赃并获）立即锁定；discovered（情况四，延迟败露）超过 5 秒反应期才锁定 */
  function activeSuspicion() {
    const s = state.suspicion || {};
    const now = Date.now();
    for (const [nid, v] of Object.entries(s)) {
      if (!(v && v.active)) continue;
      if (v.mode === 'flagrante') return [nid, v]; // 人赃并获：无反应期，立即锁定质问
      // detected_at 为后端秒级时间戳，换算为毫秒再比较
      if (now - (v.detected_at || 0) * 1000 >= 5000) return [nid, v];
    }
    return null;
  }

  /* 被怀疑：锁定移动 + NPC 质问（玩家在聊天框回应，AI 扮演 NPC 推进）。mode=flagrante 为人赃并获，discovered 为延迟败露 */
  function triggerSuspicion(npcId, mode) {
    const npc = state.data.npcs[npcId];
    const npcName = npc ? npc.name : '对方';
    if (mode === 'flagrante') {
      appendLog('npc', `${npcName}一把抓住你的手腕，怒目而视："人赃并获！你还有什么话说？！"`);
      appendLog('system', '你被当场抓住。请在聊天框回应：给钱了事 / 欺骗 / 威吓 / 逃跑（挣脱）等');
    } else {
      appendLog('npc', `${npcName}一把拦住你："站住！我刚清点过货，怎么转眼就少了东西……是不是你偷的？让我搜一搜！"`);
      appendLog('system', '你被怀疑偷窃，暂时无法离开此地。请在聊天框回应：同意搜身 / 给钱承认 / 拒绝 / 欺骗 / 威吓 / 游说 / 逃跑等');
    }
  }

  /* 偷窃败露处理：flagrante 立即质问；discovered 走 5 秒反应期（期间不锁定，玩家可离开逃脱；超时仍在原地则触发质问） */
  const suspicionTimers = {};
  function watchSuspicion(updates) {
    if (!updates || !updates.suspicion) return;
    const now = Date.now();
    for (const [nid, v] of Object.entries(updates.suspicion)) {
      if (!(v && v.active)) { if (suspicionTimers[nid]) { clearTimeout(suspicionTimers[nid]); delete suspicionTimers[nid]; } continue; }
      if (v.mode === 'flagrante') {
        // 人赃并获：立即质问，不进 5 秒反应期
        if (!suspicionTimers[nid]) {
          suspicionTimers[nid] = setTimeout(() => {}, 0); // 占位标记，避免重复触发
          triggerSuspicion(nid, 'flagrante');
        }
        continue;
      }
      if (suspicionTimers[nid]) continue; // 已有计时器
      const elapsed = now - (v.detected_at || 0) * 1000; // detected_at 为秒级，换算毫秒
      if (elapsed < 5000) {
        suspicionTimers[nid] = setTimeout(() => {
          delete suspicionTimers[nid];
          if (activeSuspicion()) triggerSuspicion(nid, 'discovered');
        }, 5000 - elapsed);
      }
    }
  }

  /* 当前地点 id（前端自由切换后同步给后端接口） */
  function currentLocationId() {
    const loc = getCurrentLocation();
    return loc ? loc.id : null;
  }

  /* 确定性端点流式调用（SSE：meta → narrative_chunk → done）。
     meta 到达即应用状态/骰子；narrative_chunk 流式渲染 GM 润色播报；AI 失败后端已回退固定播报。 */
  async function callDeterministicStream(url, payload, thinkingText) {
    const thinkingId = 'thinking-' + Date.now();
    let gmEntryId = null, gmEntryCreated = false, gmFullText = '';
    if (thinkingText) appendLog('system', thinkingText, { id: thinkingId });
    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        if (thinkingId) removeLogEntry(thinkingId);
        throw new Error(err.detail || '操作失败');
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            if (data.type === 'meta') {
              if (data.session_id) state.sessionId = data.session_id;
              if (data.updates) applyGameUpdates(data.updates);
              if (data.checks && data.checks.length > 0) data.checks.forEach(c => showCheckLog(c));
              if (data.gold != null && state.character) {
                state.character.inventory = state.character.inventory || { gold: 0, items: [] };
                state.character.inventory.gold = data.gold;
              }
            } else if (data.type === 'narrative_chunk') {
              if (!gmEntryCreated) {
                if (thinkingId) removeLogEntry(thinkingId);
                gmEntryId = 'gm-' + Date.now();
                appendLogEntry({ type: 'gm', text: '', id: gmEntryId });
                gmEntryCreated = true;
              }
              gmFullText += data.text;
              updateLogEntryText(gmEntryId, gmFullText);
            } else if (data.type === 'done') {
              if (data.full_text && data.full_text !== gmFullText) {
                gmFullText = data.full_text;
                if (gmEntryId) updateLogEntryText(gmEntryId, gmFullText);
              }
            }
          } catch (e) { /* 跳过解析失败的行 */ }
        }
      }
    } catch (err) {
      if (thinkingId) removeLogEntry(thinkingId);
      appendLog('system', `操作失败: ${err.message}`);
      throw err;
    }
  }

  /* ── 地点跳转（同场景内自由探索） ── */
  function navigateToLocation(locationId) {
    const targetLoc = state.data.locations[locationId];
    if (!targetLoc) return;

    // 监狱：牢门未开 → 锁定；牢门已开 → 只允许点"监狱大门"越狱（走后端）
    if (state.arrest && state.arrest.active && state.arrest.phase === 'jailed') {
      if (!state.arrest.cell_open) {
        appendLog('system', '你被关在牢里，铁栏杆挡着出不去。等狱卒巡逻时撬锁，或交保释金、蹲夜服刑。');
        return;
      }
      const isJailExit = (state.data.locations['neverwinter-jail']?.exits || []).some(e => e.target === locationId);
      if (!isJailExit) {
        appendLog('system', '牢门开着，但你现在只能从“监狱大门”逃出去。');
        return;
      }
      callJailEscape();
      return;
    }

    // 卫兵流程中锁定移动（逃跑须明说"逃跑"/"挣脱"）
    if (state.arrest && state.arrest.active) {
      appendLog('system', state.arrest.phase === 'summoned' ? '卫兵正在赶来，你没法现在离开。想脱身就说“逃跑”或“挣脱”。' : '卫兵拦住了你的去路，你现在没法离开。');
      return;
    }

    // 被怀疑偷窃（强制对话）时锁定移动
    const sus = activeSuspicion();
    if (sus) {
      const npc = state.data.npcs[sus[0]];
      appendLog('system', `${npc ? npc.name : '对方'}正盯着你，你现在没法离开这里。`);
      return;
    }

    // 检查目标地点是否在当前场景的 free_locations 内（如果定义了的话）
    const scene = getCurrentScene();
    if (scene && scene.free_locations && scene.free_locations.length > 0 && !scene.free_locations.includes(locationId)) {
      appendLog('system', '无法到达那个地方。');
      return;
    }

    // 更新场景的 location 引用（不切换场景）；离开时解除潜行与被怀疑（5 秒反应期内逃脱）
    scene.location = locationId;
    state.playerStealth = {};
    if (Object.keys(state.suspicion || {}).length) {
      state.suspicion = {};
      Object.keys(suspicionTimers).forEach(k => { clearTimeout(suspicionTimers[k]); delete suspicionTimers[k]; });
    }
    appendLog('system', `你来到了: ${targetLoc.name}`);
    appendLog('gm', targetLoc.scene_text || targetLoc.description || '');

    renderLocationHeader();
    renderContextPanel();
  }

  /* ── M6：战斗遭遇嵌入冒险流程 ──
   *  进入含 type:'combat' 的 scene 时自动跳转到 combat-map.html
   *  通过 sessionStorage 传递 encounterContext（mapId/enemies/playerSnapshot/loot/clues/nextScene）
   *  战斗结束后 combat-map.html 回写 sessionStorage.combatResult 并跳回 adventure.html?combat_result=xxx
   */
  function triggerCombatEncounter(encounterId, returnSceneId) {
    const enc = state.data.encounters[encounterId];
    if (!enc || enc.type !== 'combat') return false;

    // 推导 mapId：优先 encounter.map_id，否则按 location 推断（cragmaw-hideout-* 等暂不支持，仅 ch1-scene2 伏击战）
    const mapId = enc.map_id || (enc.location === 'triboar-trail-ambush' ? 'triboar-trail-ambush' : null);
    if (!mapId) {
      console.warn('未配置地图的遭遇:', encounterId);
      return false;
    }

    // 玩家快照：HP / AC / 角色基础信息（combat-map.html 据此初始化 token）
    const char = state.character || {};
    const hpParts = String(char.combat?.hp || '0 / 0').split('/').map(s => parseInt(s.trim(), 10));
    const playerSnapshot = {
      charId: char.id || 'elias',
      hpCur: isNaN(hpParts[0]) ? 10 : hpParts[0],
      hpMax: isNaN(hpParts[1]) ? 10 : hpParts[1],
      ac: char.combat?.ac || 10,
    };

    // 战斗结束后的回写内容：战利品 + 线索 + 下一场景
    const targetScene = state.data.scenes[returnSceneId];
    const context = {
      encounterId,
      encounterName: enc.name,
      mapId,
      enemies: enc.enemies || [],
      allies: enc.allies || [],
      playerSnapshot,
      returnSceneId,
      nextSceneId: targetScene?.next_scene || null,
      loot: enc.loot || [],
      clues: enc.clues || [],
      description: enc.description || '',
    };

    try {
      sessionStorage.setItem('encounterContext', JSON.stringify(context));
    } catch (e) {
      console.error('写入 sessionStorage 失败:', e);
      return false;
    }

    appendLog('system', `⚠ 遭遇战斗：${enc.name}，进入战斗地图...`);
    // 延迟一帧让日志渲染
    setTimeout(() => {
      window.location.href = `combat-map.html?encounter=${encodeURIComponent(encounterId)}`;
    }, 300);
    return true;
  }

  /* ── 接收战斗结果（页面初始化时调用） ──
   *  读 ?combat_result=xxx 参数，从 sessionStorage 取 combatResult，
   *  回写 HP / 战利品 / 线索到 state，并追加叙事日志
   *  返回 true 表示已处理战斗结果（应跳过常规开场白）
   */
  function consumeCombatResult() {
    const params = new URLSearchParams(window.location.search);
    const encId = params.get('combat_result');
    if (!encId) return false;

    let result = null;
    try {
      const raw = sessionStorage.getItem('combatResult');
      if (raw) result = JSON.parse(raw);
      sessionStorage.removeItem('combatResult');
    } catch (e) { console.warn('读取战斗结果失败:', e); }

    if (!result || result.encounterId !== encId) {
      console.warn('战斗结果与 URL 参数不匹配:', result, encId);
      return false;
    }

    if (result.outcome === 'victory') {
      // 1. 回写玩家 HP（战斗结束时的剩余 HP）
      if (state.character && typeof result.playerEndHp === 'number') {
        const max = hpMaxFromState();
        state.character.combat = state.character.combat || { ac: 10, hp: '0 / 0' };
        state.character.combat.hp = `${Math.max(0, result.playerEndHp)} / ${max}`;
      }
      // 2. 战利品进入玩家背包
      const loot = result.loot || [];
      if (loot.length && state.character) {
        state.character.inventory = state.character.inventory || { items: [] };
        loot.forEach(itemId => {
          state.character.inventory.items.push({
            equipment_id: itemId,
            equipped: false,
            quantity: 1,
          });
        });
      }
      // 3. 追加胜利叙事日志
      const lootNames = loot.map(id => state.data.items?.[id]?.name || id).join('、');
      const clueText = (result.clues || []).join('；');
      let msg = `⚔ 你击败了 ${result.encounterName || '敌人'}。`;
      if (loot.length) msg += ` 获得战利品：${lootNames}。`;
      if (clueText) msg += ` 线索：${clueText}。`;
      appendLog('gm', msg);

      // 4. 自动跳转到 nextScene
      if (result.nextSceneId && state.data.scenes[result.nextSceneId]) {
        state.currentSceneId = result.nextSceneId;
        const nextScene = state.data.scenes[result.nextSceneId];
        const nextLoc = state.data.locations[nextScene.location];
        appendLog('gm', nextLoc?.scene_text || nextLoc?.description || nextScene.description || '');
      }
    } else {
      // 失败：Game Over
      appendLog('system', '☠ 你在战斗中倒下了，冒险就此结束。');
      state.gameOver = true;
    }

    // 清理 URL 参数，避免刷新时重复消费
    try {
      const url = new URL(window.location.href);
      url.searchParams.delete('combat_result');
      window.history.replaceState({}, '', url.toString());
    } catch (e) {}

    return true;
  }

  /** 辅助：从 state.character 解析最大 HP */
  function hpMaxFromState() {
    const hp = state.character?.combat?.hp || '0 / 0';
    const parts = String(hp).split('/').map(s => parseInt(s.trim(), 10));
    return isNaN(parts[1]) ? 10 : parts[1];
  }

  /* ── 场景跳转 ── */
  function navigateToScene(sceneId) {
    const targetScene = state.data.scenes[sceneId];
    if (!targetScene) return;

    // 卫兵流程中锁定移动
    if (state.arrest && state.arrest.active) {
      appendLog('system', '卫兵拦住了你的去路，你现在没法离开。');
      return;
    }

    // 被怀疑偷窃（强制对话）时锁定移动
    const sus = activeSuspicion();
    if (sus) {
      const npc = state.data.npcs[sus[0]];
      appendLog('system', `${npc ? npc.name : '对方'}正盯着你，你现在没法离开这里。`);
      return;
    }

    const targetLoc = state.data.locations[targetScene.location];
    if (!targetLoc) {
      appendLog('system', `无法到达: ${targetScene.name}`);
      return;
    }

    // M6：检查场景事件是否含战斗遭遇，若是则跳转到战斗地图
    const combatEncounter = (targetScene.events || [])
      .map(eid => state.data.encounters[eid])
      .find(e => e && e.type === 'combat' && (e.map_id || e.location === 'triboar-trail-ambush'));
    if (combatEncounter) {
      // 战斗触发后页面会跳转，不必更新 state.currentSceneId（由战斗结束回写时设置）
      triggerCombatEncounter(combatEncounter.id, sceneId);
      return;
    }

    state.currentSceneId = sceneId;
    state.playerStealth = {};
    if (Object.keys(state.suspicion || {}).length) {
      state.suspicion = {};
      Object.keys(suspicionTimers).forEach(k => { clearTimeout(suspicionTimers[k]); delete suspicionTimers[k]; });
    }
    appendLog('gm', targetLoc.scene_text || targetLoc.description || targetScene.description || '');

    renderLocationHeader();
    renderContextPanel();
  }

  /* ── 处理玩家输入（接入后端 API + AI GM） ── */
  async function handlePlayerInput(text) {
    if (!text || !text.trim()) return;
    const inputText = text.trim();
    appendLog('player', inputText);
    playerInput.value = '';
    sendBtn.disabled = true;

    // 被怀疑（强制对话）：玩家在聊天框的回应直接触发确定性处理，不依赖 AI 意图识别
    const sus = activeSuspicion();
    if (sus) {
      let action = null;
      if (/(逃跑|跑路|溜走|挣脱|挣扎|开溜|溜之大吉)/.test(inputText)) action = 'flee';
      else if (/(拒绝|休想|凭什么|不给|不赔|要钱没有)/.test(inputText)) action = 'refuse';
      else if (/(威胁|你敢|不然|否则|别逼我|小心点)/.test(inputText)) action = 'intimidation';
      else if (/(让.{0,4}搜|同意.{0,4}搜|随便.{0,4}搜|搜吧|搜身|检查|翻吧|你来搜)/.test(inputText)) action = 'search';
      else if (/(给钱|赔钱|赔偿|承认|认了|愿意赔)/.test(inputText)) action = 'pay';
      else if (/(说服|讲道理|解释|误会|求情|好好说)/.test(inputText)) action = 'persuasion';
      else if (/(骗|撒谎|不是我|没偷|冤枉|瞒|诬陷)/.test(inputText)) action = 'deception';
      if (action) {
        await callResolveSuspicion(sus[0], action);
        sendBtn.disabled = false;
        return;
      }
    }

    // 潜行（确定性触发，绕过 AI 意图识别——AI 因工具签名必填 target_id 常卡住不调工具）。
    // 潜行无需目标；含"偷/窃"时交给偷窃流程（偷窃自带潜行判定）。
    if (/(潜行|隐匿|躲起来|藏起来|偷偷摸摸|蹑手蹑脚|躲到|躲进|藏进)/.test(inputText) && !/(偷|窃)/.test(inputText)) {
      await callStealth();
      sendBtn.disabled = false;
      return;
    }

    // 推测是否需要检定（含检定关键词时显示更强提示）
    const checkKeywords = ['侦察', '调查', '洞悉', '察觉', '察言观色', '偷', '窃', '拿取',
      '潜行', '隐匿', '威吓', '说服', '欺瞒', '巧手'];
    const maybeCheck = checkKeywords.some(kw => inputText.includes(kw));
    const thinkingId = 'thinking-' + Date.now();
    const thinkingText = maybeCheck ? '正在进行检定，GM 思考中...' : 'GM 正在思考...';
    appendLog('system', thinkingText, { id: thinkingId });
    const gmEntryId = 'gm-' + Date.now();
    let gmEntryCreated = false;

    try {
      const resp = await fetch('/api/game/action/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          adventure_id: ADVENTURE_ID,
          chapter_id: CHAPTER_ID,
          session_id: state.sessionId,
          scene_id: state.currentSceneId,
          location_id: getCurrentLocation()?.id || null,
          player_input: inputText,
          character: state.character,
        }),
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        removeLogEntry(thinkingId);
        appendLog('system', `通讯失败：${err.detail || '请稍后重试'}`);
        sendBtn.disabled = false;
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let gmFullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));

            if (data.type === 'meta') {
              // 处理元数据
              if (data.session_id) state.sessionId = data.session_id;
              if (data.updates) {
                if (data.updates.scene_id) state.currentSceneId = data.updates.scene_id;
                if (data.updates.location_id !== undefined) {
                  const scene = getCurrentScene();
                  if (scene) scene.location = data.updates.location_id;
                }
                if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
                if (data.updates.container_taken) state.containerTaken = data.updates.container_taken;
                if (data.updates.npc_states) state.npcStates = data.updates.npc_states;
                if (data.updates.merchant_states) state.merchantStates = data.updates.merchant_states;
                if (data.updates.hostile_npcs) state.hostileNpcs = data.updates.hostile_npcs;
                if (data.updates.suspicion) state.suspicion = data.updates.suspicion;
                if (data.updates.arrest !== undefined) { state.arrest = data.updates.arrest; watchArrest(state.arrest); }
                if (data.updates.caught !== undefined) state.caught = data.updates.caught;
                if (data.updates.wanted_location !== undefined) state.wantedLocation = data.updates.wanted_location;
                if (data.updates.npc_alerts) state.npcAlerts = data.updates.npc_alerts;
                if (data.updates.merchant_theft) state.merchantTheft = data.updates.merchant_theft;
                if (data.updates.player_stealth) state.playerStealth = data.updates.player_stealth;
                if (data.updates.quest_states) {
                  Object.entries(data.updates.quest_states).forEach(([qid, update]) => {
                    if (state.quests[qid]) Object.assign(state.quests[qid], update);
                    if (state.data && state.data.quests[qid]) Object.assign(state.data.quests[qid], update);
                  });
                }
                watchSuspicion(data.updates);
              }

              // 检定提示（在 GM 回复前显示）
              if (data.checks && data.checks.length > 0) {
                const cnSkills = { perception: '侦察（感知）', investigation: '调查（智力）',
                  sleight_of_hand: '巧手（敏捷）', stealth: '隐匿（敏捷）',
                  insight: '洞悉（感知）', persuasion: '游说（魅力）',
                  deception: '欺瞒（魅力）', intimidation: '威吓（魅力）',
                  athletics: '运动（力量）', acrobatics: '体操（敏捷）' };
                data.checks.forEach(c => {
                  const cnName = cnSkills[c.skill] || c.skill;
                  const dcText = c.dc ? `DC ${c.dc}` : '';
                  const rollText = `d20(${c.roll}) + ${c.modifier} = ${c.total}`;
                  const resultText = c.success ? '  ✓ 成功' : '  ✗ 失败';
                  appendLog('check', `${cnName} ${dcText}: ${rollText}${resultText}`, {
                    success: c.success, roll: c.roll, mod: c.modifier, dc: c.dc
                  });
                });
              }

              // 状态变更处理
              if (data.state_changes && data.state_changes.length > 0) {
                for (const ch of data.state_changes) {
                  if (ch.type === 'advance_scene') {
                    navigateToScene(ch.scene_id);
                  } else if (ch.type === 'move_player') {
                    navigateToLocation(ch.location_id);
                  } else if (ch.type === 'move_item' && ch.to?.type === 'player') {
                    appendLog('system', '你获得了：' + getItemName(ch.item_id));
                  }
                }
              }
            } else if (data.type === 'narrative_chunk') {
              // 第一个 chunk 到达时，移除思考提示，创建 GM 条目
              if (!gmEntryCreated) {
                removeLogEntry(thinkingId);
                appendLogEntry({ type: 'gm', text: '', id: gmEntryId });
                gmEntryCreated = true;
              }
              gmFullText += cleanGmText(data.text);
              updateLogEntryText(gmEntryId, gmFullText);
            } else if (data.type === 'done') {
              // 流结束，用最终完整文本替换
              if (data.full_text && data.full_text !== gmFullText) {
                gmFullText = cleanGmText(data.full_text);
                updateLogEntryText(gmEntryId, gmFullText);
              }
            }
          } catch (e) {
            // 跳过解析失败的行
          }
        }
      }

      // 刷新 UI
      renderLocationHeader();
      renderContextPanel();
      await renderRightPanel();
    } catch (e) {
      console.error('GM stream error:', e);
      removeLogEntry(thinkingId);
      appendLog('system', '与 GM 的连接中断，请稍后重试。');
    } finally {
      sendBtn.disabled = false;
    }
  }

  function getItemName(itemId) {
    if (!state.data || !state.data.items) return itemId;
    return state.data.items[itemId]?.name || itemId;
  }

  function removeLogEntry(id) {
    // 从 state.log 中移除
    state.log = state.log.filter(e => !(e.meta && e.meta.id === id));
    // 从 DOM 中移除
    const entry = document.querySelector(`[data-log-id="${id}"]`);
    if (entry) entry.remove();
  }

  sendBtn.addEventListener('click', () => {
    const text = playerInput.value;
    if (text.trim()) {
      handlePlayerInput(text);
      playerInput.value = '';
    }
  });

  playerInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const text = playerInput.value;
      if (text.trim()) {
        handlePlayerInput(text);
        playerInput.value = '';
      }
    }
  });

  /* ── 键盘快捷操作 ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (modalOverlay.classList.contains('active')) {
        closeDetailModal();
      }
    }
  });

  /* ── 面板拖拽调整宽度 ── */
  (function initResize() {
    try {
      const leftPanel = $('#left-panel');
      const rightPanel = $('#right-panel');
      const handleLeft = $('#resize-handle-left');
      const handleRight = $('#resize-handle-right');
      const root = document.documentElement;
      const MIN_W = 120;

      const savedLW = parseInt(localStorage.getItem('adventure-left-panel-w'));
      const savedRW = parseInt(localStorage.getItem('adventure-right-panel-w'));
      if (savedLW && savedLW >= MIN_W) {
        root.style.setProperty('--left-panel-w', savedLW + 'px');
      }
      if (savedRW && savedRW >= MIN_W) {
        root.style.setProperty('--right-panel-w', savedRW + 'px');
      }

      function makeResizable(handle, panel, cssVar, isRight) {
        if (!handle || !panel) return;
        let dragging = false;
        let startX, startW;

        handle.addEventListener('mousedown', e => {
          dragging = true;
          startX = e.clientX;
          startW = panel.getBoundingClientRect().width;
          handle.classList.add('active');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
          e.preventDefault();
        });
        document.addEventListener('mousemove', e => {
          if (!dragging) return;
          const delta = isRight ? (startX - e.clientX) : (e.clientX - startX);
          const newW = Math.max(MIN_W, startW + delta);
          root.style.setProperty(cssVar, newW + 'px');
        });
        document.addEventListener('mouseup', () => {
          if (!dragging) return;
          dragging = false;
          handle.classList.remove('active');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          const w = panel.getBoundingClientRect().width;
          localStorage.setItem(isRight ? 'adventure-right-panel-w' : 'adventure-left-panel-w', Math.round(w));
        });
      }

      makeResizable(handleLeft, leftPanel, '--left-panel-w', false);
      makeResizable(handleRight, rightPanel, '--right-panel-w', true);
    } catch (e) {}
  })();

  /* ── 初始化游戏 ── */
  async function initGame() {
    try {
      await loadCharacter();
      await loadAllData();
      await loadCatalogs();
      initTabs();

      // 属性跟随已装备物品（护甲 AC / 武器伤害与攻击加值）
      if (state.character) recalcCharacterStats(state.character);

      // M6：检查是否从战斗地图返回（URL ?combat_result=xxx）
      const fromCombat = consumeCombatResult();

      const scene = getCurrentScene();
      const loc = getCurrentLocation();
      if (!scene || !loc) {
        narrativeLog.innerHTML = '<div class="log-entry system" style="text-align:center;"><div class="log-label">错误</div><div>未找到初始场景</div></div>';
        return;
      }

      // 清空日志 + 显示加载中
      state.log = [];
      narrativeLog.innerHTML = '<div class="log-entry system" style="text-align:center;"><div class="log-label">系统</div><div>游戏加载中，GM 正在准备开场...</div></div>';

      if (fromCombat) {
        // 战斗结果回写后：跳过开场白请求，直接用回写后的场景渲染
        // consumeCombatResult 已追加胜利/失败日志和场景切换
        if (state.gameOver) {
          narrativeLog.innerHTML = '';
          appendLog('system', '☠ 冒险结束。请刷新页面重新开始。');
          renderLocationHeader();
          renderContextPanel();
          return;
        }
        renderLocationHeader();
        renderContextPanel();
        await renderRightPanel();
        await renderAllTabs();
        return;
      }

      // 请求开场白（后端启动时已预生成，毫秒级响应）
      const resp = await fetch(`/api/game/opening?adventure_id=${encodeURIComponent(ADVENTURE_ID)}&chapter_id=${encodeURIComponent(CHAPTER_ID)}&scene_id=${encodeURIComponent(scene.id)}`);
      const data = await resp.json();

      // 存储 session_id 供后续对话使用
      state.sessionId = data.session_id;

      // 清空加载提示，显示开场白
      state.log = [];
      appendLog('gm', data.opening || loc.scene_text || loc.description || scene.description || '');

      // 渲染 UI
      renderLocationHeader();
      renderContextPanel();
      await renderRightPanel();
      await renderAllTabs();
    } catch (err) {
      console.error('初始化失败:', err);
      narrativeLog.innerHTML = `<div class="log-entry system" style="text-align:center;"><div class="log-label">错误</div><div>数据加载失败: ${err.message}</div></div>`;
    }
  }

  /* ── 启动 ── */
  document.body.classList.add('page-in');
  initGame();
})();
</script>
