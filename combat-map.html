  // 动作经济：按剩余预算刷新动作按钮置灰（动作/附赠耗尽、回气/动作如潮已用、敌人回合锁定）
  function refreshCombatButtons() {
    const api = window.__combatApi;
    if (!api || !api.getTurnResources) return;
    const r = api.getTurnResources();
    const phase = api.getCombatPhase ? api.getCombatPhase() : 'idle';
    const locked = phase !== 'idle' && phase !== 'player';
    document.querySelectorAll('.combat-action[data-cost]').forEach(el => {
      const cost = el.dataset.cost;
      let dis = locked;
      if (!dis) {
        if (cost === 'action') dis = r.action <= 0;
        else if (cost === 'bonus') dis = r.bonus <= 0;
        if (el.dataset.spellId === 'second_wind' && r.secondWindUsed) dis = true;
        if (el.dataset.spellId === 'fighting_spirit' && r.actionSurgeUsed) dis = true;
      }
      el.classList.toggle('disabled', dis);
    });
    // 同步非致命开关视觉（按钮 active 类 + tooltip 内容由 showSkillTooltip 实时读取）
    const nlBtn = document.getElementById('nonlethal-toggle');
    if (nlBtn && typeof api.getNonlethal === 'function') {
      nlBtn.classList.toggle('active', api.getNonlethal());
    }
  }

  // 非致命打击开关切换：ON=近战留 1 滴血昏迷，OFF=致命
  // 不消耗动作预算（D&D 5e RAW：非致命是攻击的一部分，非独立动作）
  window.toggleNonlethal = function() {
    const api = window.__combatApi;
    if (!api || typeof api.getNonlethal !== 'function' || typeof api.setNonlethal !== 'function') return;
    const next = !api.getNonlethal();
    api.setNonlethal(next);
    const btn = document.getElementById('nonlethal-toggle');
    if (btn) btn.classList.toggle('active', next);
    // 若 tooltip 正显示在非致命按钮上，直接刷新 tooltip 内容
    const tip = document.querySelector('.item-tooltip.show');
    if (tip && tip._nlBound === btn) {
      tip.querySelector('.item-tooltip-breakdown').textContent = `当前状态：${next ? '已开启（近战留活口）' : '已关闭（近战致命）'}`;
    }
  };

  // 战斗动作事件委托：点击动作块 → 分发给战斗地图（target → 选目标，self → 直接使用）
  document.addEventListener('click', (e) => {
    const el = e.target.closest('.combat-action');
    if (!el) return;
    const api = window.__combatApi;
    if (!api) return;

    const kind = el.dataset.actionKind;
    const actionType = el.dataset.actionType;

    if (actionType === 'attack') {
      api.selectAction({ type: 'attack', kind: el.dataset.attackKind });
      return;
    }
    if (actionType === 'spell') {
      if (kind === 'self') {
        api.useSelfAction({ id: el.dataset.spellId });
      } else {
        api.selectAction({ type: 'spell', spellId: el.dataset.spellId });
      }
      return;
    }
    // 普通动作块（常规动作/职业动作）：根据 range 判断自身或需目标
    if (kind === 'self') {
      api.useSelfAction({ id: el.dataset.spellId });
    } else {
      api.selectAction({ type: 'spell', spellId: el.dataset.spellId });
    }
  });

  /* ── 构建场景出口列表 ── */
  function buildSceneExits(scene) {
    if (!scene) return [];
    const exits = [];
    const loc = getCurrentLocation();

    // 只展示物理地点出口（不展示场景跳转）
    if (loc && loc.exits) {

  /* ── 地点跳转（同场景内自由探索） ── */
  function navigateToLocation(locationId) {
    const targetLoc = state.data.locations[locationId];
    if (!targetLoc) return;

    // 监狱：牢门未开 → 锁定；牢门已开 → 只允许点"监狱大门"越狱（走后端）
    if (state.arrest && state.arrest.active && state.arrest.phase === 'jailed') {
      if (!state.arrest.cell_open) {
        appendLog('system', '你被关在牢里，铁栏杆挡着出不去。等狱卒巡逻时撬锁，或交保释金、蹲夜服刑。');
        return;
      }
      const isJailExit = (state.data.locations['neverwinter-jail']?.exits || []).some(e => e.target === locationId);
      if (!isJailExit) {
        appendLog('system', '牢门开着，但你现在只能从“监狱大门”逃出去。');
        return;
      }
      callJailEscape();
      return;
    }

    // 卫兵流程中锁定移动（逃跑须明说"逃跑"/"挣脱"）
    if (state.arrest && state.arrest.active) {
      appendLog('system', state.arrest.phase === 'summoned' ? '卫兵正在赶来，你没法现在离开。想脱身就说“逃跑”或“挣脱”。' : '卫兵拦住了你的去路，你现在没法离开。');
      return;
    }

    // 被怀疑偷窃（强制对话）时锁定移动
    const sus = activeSuspicion();
    if (sus) {
      const npc = state.data.npcs[sus[0]];
      appendLog('system', `${npc ? npc.name : '对方'}正盯着你，你现在没法离开这里。`);
      return;
    }

    // 检查目标地点是否在当前场景的 free_locations 内（如果定义了的话）
    const scene = getCurrentScene();
    if (scene && scene.free_locations && scene.free_locations.length > 0 && !scene.free_locations.includes(locationId)) {
      appendLog('system', '无法到达那个地方。');
      return;
    }

    // 更新场景的 location 引用（不切换场景）；离开时解除潜行与被怀疑（5 秒反应期内逃脱）
    scene.location = locationId;
    state.playerStealth = {};
    if (Object.keys(state.suspicion || {}).length) {
      state.suspicion = {};
      Object.keys(suspicionTimers).forEach(k => { clearTimeout(suspicionTimers[k]); delete suspicionTimers[k]; });
    }
    appendLog('system', `你来到了: ${targetLoc.name}`);
    appendLog('gm', targetLoc.scene_text || targetLoc.description || '');

    renderLocationHeader();
    renderContextPanel();
  }

  /* ── 场景跳转 ── */
  function navigateToScene(sceneId) {
    const targetScene = state.data.scenes[sceneId];
    if (!targetScene) return;

    // 卫兵流程中锁定移动
    if (state.arrest && state.arrest.active) {
      appendLog('system', '卫兵拦住了你的去路，你现在没法离开。');
      return;
    }

    // 被怀疑偷窃（强制对话）时锁定移动
    const sus = activeSuspicion();
    if (sus) {
      const npc = state.data.npcs[sus[0]];
      appendLog('system', `${npc ? npc.name : '对方'}正盯着你，你现在没法离开这里。`);
      return;
    }

    const targetLoc = state.data.locations[targetScene.location];
    if (!targetLoc) {
      appendLog('system', `无法到达: ${targetScene.name}`);
      return;
    }

    state.currentSceneId = sceneId;
    state.playerStealth = {};
    if (Object.keys(state.suspicion || {}).length) {
      state.suspicion = {};
      Object.keys(suspicionTimers).forEach(k => { clearTimeout(suspicionTimers[k]); delete suspicionTimers[k]; });
    }
    appendLog('gm', targetLoc.scene_text || targetLoc.description || targetScene.description || '');

    renderLocationHeader();
    renderContextPanel();
  }

  /* ── 处理玩家输入（接入后端 API + AI GM） ── */
  async function handlePlayerInput(text) {
    if (!text || !text.trim()) return;
    const inputText = text.trim();
    appendLog('player', inputText);
    playerInput.value = '';
    sendBtn.disabled = true;

    // 被怀疑（强制对话）：玩家在聊天框的回应直接触发确定性处理，不依赖 AI 意图识别
    const sus = activeSuspicion();
    if (sus) {
      let action = null;
      if (/(逃跑|跑路|溜走|挣脱|挣扎|开溜|溜之大吉)/.test(inputText)) action = 'flee';
      else if (/(拒绝|休想|凭什么|不给|不赔|要钱没有)/.test(inputText)) action = 'refuse';
      else if (/(威胁|你敢|不然|否则|别逼我|小心点)/.test(inputText)) action = 'intimidation';
      else if (/(让.{0,4}搜|同意.{0,4}搜|随便.{0,4}搜|搜吧|搜身|检查|翻吧|你来搜)/.test(inputText)) action = 'search';
      else if (/(给钱|赔钱|赔偿|承认|认了|愿意赔)/.test(inputText)) action = 'pay';
      else if (/(说服|讲道理|解释|误会|求情|好好说)/.test(inputText)) action = 'persuasion';
      else if (/(骗|撒谎|不是我|没偷|冤枉|瞒|诬陷)/.test(inputText)) action = 'deception';
      if (action) {
        await callResolveSuspicion(sus[0], action);
        sendBtn.disabled = false;
        return;
      }
    }

    // 潜行（确定性触发，绕过 AI 意图识别——AI 因工具签名必填 target_id 常卡住不调工具）。
    // 潜行无需目标；含"偷/窃"时交给偷窃流程（偷窃自带潜行判定）。
    if (/(潜行|隐匿|躲起来|藏起来|偷偷摸摸|蹑手蹑脚|躲到|躲进|藏进)/.test(inputText) && !/(偷|窃)/.test(inputText)) {
      await callStealth();
      sendBtn.disabled = false;
      return;
    }

    // 推测是否需要检定（含检定关键词时显示更强提示）
    const checkKeywords = ['侦察', '调查', '洞悉', '察觉', '察言观色', '偷', '窃', '拿取',
      '潜行', '隐匿', '威吓', '说服', '欺瞒', '巧手'];
    const maybeCheck = checkKeywords.some(kw => inputText.includes(kw));
    const thinkingId = 'thinking-' + Date.now();
    const thinkingText = maybeCheck ? '正在进行检定，GM 思考中...' : 'GM 正在思考...';
    appendLog('system', thinkingText, { id: thinkingId });
    const gmEntryId = 'gm-' + Date.now();
    let gmEntryCreated = false;

    try {
      const resp = await fetch('/api/game/action/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          adventure_id: ADVENTURE_ID,
          chapter_id: CHAPTER_ID,
          session_id: state.sessionId,
          scene_id: state.currentSceneId,
          location_id: getCurrentLocation()?.id || null,
          player_input: inputText,
          character: state.character,
        }),
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        removeLogEntry(thinkingId);
        appendLog('system', `通讯失败：${err.detail || '请稍后重试'}`);
        sendBtn.disabled = false;
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let gmFullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));

            if (data.type === 'meta') {
              // 处理元数据
              if (data.session_id) state.sessionId = data.session_id;
              if (data.updates) {
                if (data.updates.scene_id) state.currentSceneId = data.updates.scene_id;
                if (data.updates.location_id !== undefined) {
                  const scene = getCurrentScene();
                  if (scene) scene.location = data.updates.location_id;
                }
                if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
                if (data.updates.container_taken) state.containerTaken = data.updates.container_taken;
                if (data.updates.npc_states) state.npcStates = data.updates.npc_states;
                if (data.updates.merchant_states) state.merchantStates = data.updates.merchant_states;
                if (data.updates.hostile_npcs) state.hostileNpcs = data.updates.hostile_npcs;
                if (data.updates.suspicion) state.suspicion = data.updates.suspicion;
                if (data.updates.arrest !== undefined) { state.arrest = data.updates.arrest; watchArrest(state.arrest); }
                if (data.updates.caught !== undefined) state.caught = data.updates.caught;
                if (data.updates.wanted_location !== undefined) state.wantedLocation = data.updates.wanted_location;
                if (data.updates.npc_alerts) state.npcAlerts = data.updates.npc_alerts;
                if (data.updates.merchant_theft) state.merchantTheft = data.updates.merchant_theft;
                if (data.updates.player_stealth) state.playerStealth = data.updates.player_stealth;
                if (data.updates.quest_states) {
                  Object.entries(data.updates.quest_states).forEach(([qid, update]) => {
                    if (state.quests[qid]) Object.assign(state.quests[qid], update);
                    if (state.data && state.data.quests[qid]) Object.assign(state.data.quests[qid], update);
                  });
                }
                watchSuspicion(data.updates);
              }

              // 偷窃得手的装备：直接写入角色卡装备栏（与拾取/购买一致；测试阶段不持久化）
              if (data.loot_equipment && state.character) {
                const def = findItemDef(data.loot_equipment);
                const eqId = (def && (def.equipment_id || def.id)) || data.loot_equipment;
                state.character.inventory = state.character.inventory || { gold: 0, items: [] };
                state.character.inventory.items.push({ equipment_id: eqId, quantity: 1, equipped: false });
                renderAllTabs();
              }

              // 检定提示（在 GM 回复前显示）
              if (data.checks && data.checks.length > 0) {
                const cnSkills = { perception: '侦察（感知）', investigation: '调查（智力）',
                  sleight_of_hand: '巧手（敏捷）', stealth: '隐匿（敏捷）',
                  insight: '洞悉（感知）', persuasion: '游说（魅力）',
                  deception: '欺瞒（魅力）', intimidation: '威吓（魅力）',
                  athletics: '运动（力量）', acrobatics: '体操（敏捷）' };
                data.checks.forEach(c => {
                  const cnName = cnSkills[c.skill] || c.skill;
                  const dcText = c.dc ? `DC ${c.dc}` : '';
                  const rollText = `d20(${c.roll}) + ${c.modifier} = ${c.total}`;
                  const resultText = c.success ? '  ✓ 成功' : '  ✗ 失败';
                  appendLog('check', `${cnName} ${dcText}: ${rollText}${resultText}`, {
                    success: c.success, roll: c.roll, mod: c.modifier, dc: c.dc
                  });
                });
              }

              // 状态变更处理
              if (data.state_changes && data.state_changes.length > 0) {
                for (const ch of data.state_changes) {
                  if (ch.type === 'advance_scene') {
                    navigateToScene(ch.scene_id);
                  } else if (ch.type === 'move_player') {
                    navigateToLocation(ch.location_id);
                  } else if (ch.type === 'move_item' && ch.to?.type === 'player') {
                    appendLog('system', '你获得了：' + getItemName(ch.item_id));
                  }
                }
              }
            } else if (data.type === 'narrative_chunk') {
              // 第一个 chunk 到达时，移除思考提示，创建 GM 条目
              if (!gmEntryCreated) {
                removeLogEntry(thinkingId);
                appendLogEntry({ type: 'gm', text: '', id: gmEntryId });
                gmEntryCreated = true;
              }
              gmFullText += cleanGmText(data.text);
              updateLogEntryText(gmEntryId, gmFullText);
            } else if (data.type === 'done') {
              // 流结束，用最终完整文本替换
              if (data.full_text && data.full_text !== gmFullText) {
                gmFullText = cleanGmText(data.full_text);
                updateLogEntryText(gmEntryId, gmFullText);
              }
            }
          } catch (e) {
            // 跳过解析失败的行
          }
        }
      }

      // 刷新 UI
      renderLocationHeader();
      renderContextPanel();
      await renderRightPanel();
    } catch (e) {
      console.error('GM stream error:', e);
      removeLogEntry(thinkingId);
      appendLog('system', '与 GM 的连接中断，请稍后重试。');
    } finally {
      sendBtn.disabled = false;
    }
  }

  /* ── 面板拖拽调整宽度 ── */
  (function initResize() {
    try {
      const leftPanel = $('#left-panel');
      const rightPanel = $('#right-panel');
      const handleLeft = $('#resize-handle-left');
      const handleRight = $('#resize-handle-right');
      const root = document.documentElement;
      const MIN_W = 120;

      const savedLW = parseInt(localStorage.getItem('adventure-left-panel-w'));
      const savedRW = parseInt(localStorage.getItem('adventure-right-panel-w'));
      if (savedLW && savedLW >= MIN_W) {
        root.style.setProperty('--left-panel-w', savedLW + 'px');
      }
      if (savedRW && savedRW >= MIN_W) {
        root.style.setProperty('--right-panel-w', savedRW + 'px');
      }

      function makeResizable(handle, panel, cssVar, isRight) {
        if (!handle || !panel) return;
        let dragging = false;
        let startX, startW;

        handle.addEventListener('mousedown', e => {
          dragging = true;
          startX = e.clientX;
          startW = panel.getBoundingClientRect().width;
          handle.classList.add('active');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
          e.preventDefault();
        });
        document.addEventListener('mousemove', e => {
          if (!dragging) return;
          const delta = isRight ? (startX - e.clientX) : (e.clientX - startX);
          const newW = Math.max(MIN_W, startW + delta);
          root.style.setProperty(cssVar, newW + 'px');
        });
        document.addEventListener('mouseup', () => {
          if (!dragging) return;
          dragging = false;
          handle.classList.remove('active');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          const w = panel.getBoundingClientRect().width;
          localStorage.setItem(isRight ? 'adventure-right-panel-w' : 'adventure-left-panel-w', Math.round(w));
        });
      }

      makeResizable(handleLeft, leftPanel, '--left-panel-w', false);
      makeResizable(handleRight, rightPanel, '--right-panel-w', true);
    } catch (e) {}
  })();

  /* ── 初始化游戏 ── */
  async function initGame() {
    try {
      // 角色卡由页面统一加载（见文件末尾 window.__playerCharacterReady），战斗端引用同一对象
      state.character = await window.__playerCharacterReady;
      await loadAllData();
      await loadCatalogs();
      initTabs();

      // 左栏场景：?map= 调试入口取该地图对应的第一个冒险场景；正常流程用 returnSceneId
      const debugMapId = new URLSearchParams(location.search).get('map');
      const contextRaw = sessionStorage.getItem('encounterContext');
      if (debugMapId) {
        const mapScene = Object.values(state.data.scenes).find(s => s.map === debugMapId);
        if (!mapScene) throw new Error(`没有冒险场景引用地图: ${debugMapId}`);
        state.currentSceneId = mapScene.id;
      } else if (contextRaw) {
        const context = JSON.parse(contextRaw);
        if (!context.returnSceneId || !state.data.scenes[context.returnSceneId]) {
          throw new Error(`冒险场景不存在: ${context.returnSceneId}`);
        }
        state.currentSceneId = context.returnSceneId;
      } else {
        throw new Error('缺少 encounterContext：请从冒险场景进入战斗地图');
      }

      // 属性跟随已装备物品（护甲 AC / 武器伤害与攻击加值）
      if (state.character) recalcCharacterStats(state.character);

      const scene = getCurrentScene();
      const loc = getCurrentLocation();
      if (!scene || !loc) {
        narrativeLog.innerHTML = '<div class="log-entry system" style="text-align:center;"><div class="log-label">错误</div><div>未找到初始场景</div></div>';
        return;
      }

      // 清空日志 + 显示加载中
      state.log = [];
      narrativeLog.innerHTML = '<div class="log-entry system" style="text-align:center;"><div class="log-label">系统</div><div>游戏加载中，GM 正在准备开场...</div></div>';

      // 请求开场白（后端启动时已预生成，毫秒级响应）
      const resp = await fetch(`/api/game/opening?adventure_id=${encodeURIComponent(ADVENTURE_ID)}&chapter_id=${encodeURIComponent(CHAPTER_ID)}&scene_id=${encodeURIComponent(scene.id)}`);
      const data = await resp.json();

      // 存储 session_id 供后续对话使用
      state.sessionId = data.session_id;

      // 清空加载提示，显示开场白
      state.log = [];
      appendLog('gm', data.opening || loc.scene_text || loc.description || scene.description || '');

      // 渲染 UI
      renderLocationHeader();
      renderContextPanel();
      await renderRightPanel();
      await renderAllTabs();

      // 战斗结算回调：同步右侧面板（HP 等）
      if (window.__combatApi) {
        window.__combatApi.onResolve = (result) => {
          // 玩家 HP 以地图玩家 token 为权威（玩家回合选中、敌人回合未选中都适用）
          const api = window.__combatApi;
          const playerTok = api && api.getPlayerToken ? api.getPlayerToken() : null;
          if (playerTok && playerTok.data && state.character) {
            const hpStr = `${playerTok.data.hpCur ?? 0} / ${playerTok.data.hpMax ?? 0}`;
            state.character.combat.hp = hpStr;
          }
          renderRightPanel().then(() => renderAllTabs()).then(() => refreshCombatButtons());
        };
        // 动作预算变化：刷新动作按钮置灰
        window.__combatApi.onTurnChanged = refreshCombatButtons;
      }
    } catch (err) {
      console.error('初始化失败:', err);
      narrativeLog.innerHTML = `<div class="log-entry system" style="text-align:center;"><div class="log-label">错误</div><div>数据加载失败: ${err.message}</div></div>`;
    }
  }

  /* ── 启动 ── */
  document.body.classList.add('page-in');

  /* ── 先攻顺序头像条：可拖动（在中央区域内自由摆放） ──
   * 拖手柄为左侧 ::before 竖纹；拖动时清除 translateX(-50%)，改用 left/top 定位
   * 边界约束在 .center-area 内，防止拖出屏幕 */
  (function setupInitiativeBarDrag() {
    const bar = document.getElementById('initiative-bar');
    if (!bar) return;
    const dragHandle = () => bar; // 整条均可拖动，::before 仅作视觉提示
    let dragging = false;
    let moved = false;
    let startX = 0, startY = 0;
    let originLeft = 0, originTop = 0;

    const onDown = (e) => {
      // 只响应左键；点击头像本身（init-portrait）不触发拖动
      if (e.button !== 0) return;
      const target = e.target;
      if (target.classList && (target.classList.contains('init-circle') || target.classList.contains('init-name') || target.classList.contains('init-roll'))) return;
      const rect = bar.getBoundingClientRect();
      const parent = bar.parentElement; // .center-area
      const pr = parent.getBoundingClientRect();
      // 切换为绝对像素定位，清除 translateX(-50%)
      bar.style.transform = 'none';
      bar.style.left = (rect.left - pr.left) + 'px';
      bar.style.top = (rect.top - pr.top) + 'px';
      dragging = true;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      originLeft = parseFloat(bar.style.left);
      originTop = parseFloat(bar.style.top);
      bar.classList.add('dragging');
      e.preventDefault();
    };

    const onMove = (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      const parent = bar.parentElement.getBoundingClientRect();
      const bw = bar.offsetWidth;
      const bh = bar.offsetHeight;
      let nl = originLeft + dx;
      let nt = originTop + dy;
      // 约束在父容器内（留 2px 边距）
      nl = Math.max(2, Math.min(nl, parent.width - bw - 2));
      nt = Math.max(2, Math.min(nt, parent.height - bh - 2));
      bar.style.left = nl + 'px';
      bar.style.top = nt + 'px';
    };

    const onUp = () => {
      if (!dragging) return;
      dragging = false;
      bar.classList.remove('dragging');
      // 若未实际移动，不阻止后续点击
    };

    bar.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    // 触屏支持
    bar.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      onDown({ button: 0, target: e.target, clientX: t.clientX, clientY: t.clientY, preventDefault: () => e.preventDefault() });
    }, { passive: false });
    document.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const t = e.touches[0];
      onMove({ clientX: t.clientX, clientY: t.clientY });
      e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchend', onUp);
  })();

  /* 玩家角色卡唯一加载入口：页面加载后交给战斗端
     （main.js 的 initMap 等这份 promise，并让 token.data.character 指向同一份对象） */
  window.__playerCharacterReady = loadCharacter().then(() => state.character);

  initGame();
})();
</script>
<script type="module" src="./js/combat/main.js"></script>
