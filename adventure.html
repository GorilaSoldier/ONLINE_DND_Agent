<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNDBOX · 冒险</title>
<style>
  :root {
    --ink:       #3d2b1f;
    --ink-soft:  #6b4e3d;
    --paper:     #faf6ee;
    --paper-light: #fdfbf7;
    --paper-card:  #fffdf7;
    --paper-dark:  #e5dbca;
    --accent:    #8b5a2b;
    --accent-glow: #b8783e;
    --border:    rgba(61, 43, 31, 0.12);
    --shadow:    rgba(61, 43, 31, 0.12);
    --slot:      rgba(61, 43, 31, 0.06);
    --line-color: rgba(61, 43, 31, 0.35);
    --danger:    #b53b3b;
    --left-panel-w: 240px;
    --right-panel-w: 260px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "Songti SC", Georgia, serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  body.page-in { opacity: 1; }

  /* ── top bar ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--paper);
    flex-shrink: 0;
  }

  .top-bar .brand {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-back-lobby {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color 0.15s, border-color 0.15s;
  }

  .btn-back-lobby:hover {
    color: var(--ink);
    border-color: var(--ink-soft);
  }

  /* ── adventure body ── */
  .adventure-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── left panel ── */
  .left-panel {
    width: var(--left-panel-w);
    min-width: 0;
    flex-shrink: 0;
    padding: 16px 14px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    transition: none;
  }

  .context-section {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--paper-light);
  }

  .context-section h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .context-section h4 {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.8;
  }

  .context-location {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--slot);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .context-location:hover {
    background: rgba(139, 90, 43, 0.10);
  }

  .location-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .location-type-tag {
    font-size: 11px;
    color: var(--ink-soft);
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .context-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .context-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 13px;
  }

  .context-item:hover {
    background: rgba(139, 90, 43, 0.08);
  }

  .context-item-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(139, 90, 43, 0.12);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .context-item-name {
    flex: 1;
    color: var(--ink);
    font-weight: 500;
  }

  .context-item-meta {
    font-size: 11px;
    color: var(--ink-soft);
  }

  .context-placeholder {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    opacity: 0.6;
    text-align: center;
    padding: 8px 0;
  }

  .context-empty {
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.5;
    text-align: center;
    padding: 4px 0;
  }

  /* ── center area ── */
  .center-area {
    flex: 1;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .location-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--paper-light);
    flex-shrink: 0;
    text-align: center;
  }

  .location-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }

  .location-meta {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
    font-style: italic;
  }

  /* ── narrative log ── */
  .narrative-log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .narrative-log::-webkit-scrollbar {
    width: 6px;
  }

  .narrative-log::-webkit-scrollbar-track {
    background: transparent;
  }

  .narrative-log::-webkit-scrollbar-thumb {
    background: rgba(61, 43, 31, 0.15);
    border-radius: 3px;
  }

  .log-entry {
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.75;
    max-width: 720px;
  }

  .log-entry.gm {
    background: rgba(61, 43, 31, 0.03);
    border-left: 3px solid var(--accent);
    align-self: flex-start;
  }

  .log-entry.player {
    background: rgba(139, 90, 43, 0.06);
    border-left: 3px solid var(--ink-soft);
    align-self: flex-end;
    text-align: right;
  }

  .log-entry.system {
    background: rgba(139, 90, 43, 0.04);
    border-left: 3px solid var(--danger);
    align-self: center;
    text-align: center;
    font-size: 13px;
    padding: 10px 16px;
  }

  .log-entry.check {
    background: rgba(139, 90, 43, 0.04);
    border: 1px dashed var(--border);
    align-self: center;
    text-align: center;
    font-size: 13px;
    padding: 10px 16px;
  }

  .log-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .gm .log-label { color: var(--accent); }
  .player .log-label { color: var(--ink-soft); }
  .system .log-label { color: var(--danger); }
  .check .log-label { color: var(--ink-soft); }

  /* ── input area ── */
  .input-area {
    padding: 12px 24px 16px;
    border-top: 1px solid var(--border);
    background: var(--paper-light);
    flex-shrink: 0;
    display: flex;
    gap: 10px;
  }

  .input-area input {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    outline: none;
    transition: border-color 0.15s;
  }

  .input-area input::placeholder {
    color: var(--ink-soft);
    opacity: 0.5;
  }

  .input-area input:focus {
    border-color: var(--accent);
  }

  .input-area button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .input-area button:hover {
    background: var(--accent-glow);
  }

  /* ── right panel ── */
  .right-panel {
    width: var(--right-panel-w);
    min-width: 0;
    flex-shrink: 0;
    padding: calc(var(--right-panel-w) * 0.011) calc(var(--right-panel-w) * 0.010);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: calc(var(--right-panel-w) * 0.010);
    overflow-y: auto;
    transition: none;
  }

  .char-card {
    width: 100%;
    box-sizing: border-box;
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: calc(var(--right-panel-w) * 0.015);
    padding: calc(var(--right-panel-w) * 0.027) calc(var(--right-panel-w) * 0.015);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .char-card-placeholder {
    font-size: calc(var(--right-panel-w) * 0.018);
    color: var(--ink-soft);
    text-align: center;
    padding: calc(var(--right-panel-w) * 0.038) 0;
  }

  .char-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .char-name {
    font-size: calc(var(--right-panel-w) * 0.027);
    font-weight: 700;
    color: var(--ink);
    margin-bottom: calc(var(--right-panel-w) * 0.023);
  }

  .char-portrait-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--right-panel-w) * 0.023);
  }

  .equipment-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--right-panel-w) * 0.011);
    justify-content: flex-start;
    width: calc(var(--right-panel-w) * 0.114);
  }

  .left-slots { align-items: flex-start; }
  .right-slots { align-items: flex-end; }

  .slot {
    width: calc(var(--right-panel-w) * 0.053);
    height: calc(var(--right-panel-w) * 0.053);
    border-radius: calc(var(--right-panel-w) * 0.010);
    background: var(--slot);
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(61, 43, 31, 0.25);
  }

  .slot svg {
    width: 40%; height: 40%;
    fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  .char-portrait {
    width: calc(var(--right-panel-w) * 0.2);
    height: calc(var(--right-panel-w) * 0.257);
    border-radius: calc(var(--right-panel-w) * 0.013);
    background: linear-gradient(135deg, rgba(184, 115, 51, 0.3), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--right-panel-w) * 0.077);
    font-weight: 700;
    color: var(--paper-light);
    box-shadow: 0 4px 16px rgba(139, 90, 43, 0.22);
    flex-shrink: 0;
  }

  .combat-stats {
    display: flex;
    justify-content: center;
    gap: calc(var(--right-panel-w) * 0.038);
    margin-top: calc(var(--right-panel-w) * 0.008);
    width: 100%;
  }

  .combat-stat { text-align: center; }

  .combat-stat-icon {
    width: calc(var(--right-panel-w) * 0.040);
    height: calc(var(--right-panel-w) * 0.040);
    margin: 0 auto calc(var(--right-panel-w) * 0.008);
    border-radius: calc(var(--right-panel-w) * 0.010);
    background: rgba(184, 115, 51, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }

  .combat-stat-icon svg {
    width: 48%; height: 48%;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .combat-stat-value {
    font-size: calc(var(--right-panel-w) * 0.028);
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    margin-bottom: calc(var(--right-panel-w) * 0.004);
  }

  .combat-stat-label {
    font-size: calc(var(--right-panel-w) * 0.020);
    color: var(--ink-soft);
  }

  .char-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--right-panel-w) * 0.023);
    margin-top: calc(var(--right-panel-w) * 0.015);
    width: 100%;
  }

  .char-bottom .char-level {
    width: calc(var(--right-panel-w) * 0.257);
    box-sizing: border-box;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--right-panel-w) * 0.013);
    font-size: calc(var(--right-panel-w) * 0.016);
    color: var(--ink-soft);
  }

  .char-bottom .char-level .xp-bar {
    flex: 1;
    height: calc(var(--right-panel-w) * 0.006);
    background: rgba(61, 43, 31, 0.08);
    border-radius: calc(var(--right-panel-w) * 0.003);
    overflow: hidden;
  }

  .xp-fill {
    height: 100%;
    background: var(--accent);
    border-radius: calc(var(--right-panel-w) * 0.003);
  }

  .level-badge {
    display: flex;
    align-items: center;
    gap: calc(var(--right-panel-w) * 0.006);
    font-weight: 700;
    color: var(--accent);
    font-size: calc(var(--right-panel-w) * 0.016);
  }

  .level-badge .num {
    width: calc(var(--right-panel-w) * 0.027);
    height: calc(var(--right-panel-w) * 0.027);
    border-radius: 50%;
    background: rgba(184, 115, 51, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--right-panel-w) * 0.018);
  }

  .weapon-slot-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--right-panel-w) * 0.006);
  }

  .weapon-slot-label {
    font-size: calc(var(--right-panel-w) * 0.020);
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }

  .weapon-slots {
    display: flex;
    gap: calc(var(--right-panel-w) * 0.008);
  }

  .weapon-slots .slot {
    width: calc(var(--right-panel-w) * 0.053);
    height: calc(var(--right-panel-w) * 0.053);
    border-radius: calc(var(--right-panel-w) * 0.010);
  }

  .weapon-slots .slot svg {
    width: 40%; height: 40%;
  }

  .attack-stats {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: calc(var(--right-panel-w) * 0.023);
    margin-top: calc(var(--right-panel-w) * 0.019);
    padding-top: calc(var(--right-panel-w) * 0.019);
    border-top: 1px solid var(--border);
    width: 100%;
  }

  .attack-weapon-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--right-panel-w) * 0.010);
    width: calc(var(--right-panel-w) * 0.114);
  }

  .attack-weapon-group:first-child { margin-right: calc(var(--right-panel-w) * 0.105); }
  .attack-weapon-group:last-child { margin-left: calc(var(--right-panel-w) * 0.105); }

  .attack-value {
    font-size: calc(var(--right-panel-w) * 0.024);
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    text-align: center;
  }

  .attack-labels {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: calc(var(--right-panel-w) * 0.010);
    text-align: center;
  }

  .attack-label {
    font-size: calc(var(--right-panel-w) * 0.021);
    color: var(--ink-soft);
    font-weight: 600;
  }

  /* ═══ 标签页 — 与 lobby 完全一致 ═══ */

  .tabs { display: flex; justify-content: center; gap: calc(var(--right-panel-w) * 0.008); margin-bottom: calc(var(--right-panel-w) * 0.023); flex-wrap: wrap; }

  .tab {
    padding: calc(var(--right-panel-w) * 0.010) calc(var(--right-panel-w) * 0.019); border-radius: calc(var(--right-panel-w) * 0.008); font-size: calc(var(--right-panel-w) * 0.018); font-weight: 600;
    color: var(--ink-soft); background: transparent; border: 1px solid transparent;
    cursor: pointer; font-family: inherit; transition: all 0.2s ease;
  }
  .tab.active {
    background: var(--paper-card); color: var(--ink);
    border-color: var(--border); box-shadow: 0 2px 8px var(--shadow);
  }
  .tab:hover:not(.active) { background: rgba(184, 115, 51, 0.06); }

  .char-tab-content { display: none; padding: calc(var(--right-panel-w) * 0.008) 0; animation: fadeIn 0.3s ease; }
  .char-tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ── 物品栏 ── */
  .inventory-panel {
    width: 100%; box-sizing: border-box;
    background: var(--paper-card); border: 1px solid var(--border);
    border-radius: calc(var(--right-panel-w) * 0.011); padding: calc(var(--right-panel-w) * 0.013); box-shadow: 0 2px 10px var(--shadow);
  }
  .inventory-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: calc(var(--right-panel-w) * 0.011); }
  .inventory-title {
    display: flex; align-items: center; gap: calc(var(--right-panel-w) * 0.006); font-size: calc(var(--right-panel-w) * 0.018); font-weight: 700; color: var(--ink);
  }
  .inventory-title svg { width: calc(var(--right-panel-w) * 0.015); height: calc(var(--right-panel-w) * 0.015); fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .inventory-gold { font-size: calc(var(--right-panel-w) * 0.016); font-weight: 700; color: var(--accent); display: flex; align-items: center; }

  .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: calc(var(--right-panel-w) * 0.008); }
  .item-card {
    background: rgba(255,255,255,0.4); border: 1px solid var(--border);
    border-radius: calc(var(--right-panel-w) * 0.010); padding: calc(var(--right-panel-w) * 0.010) calc(var(--right-panel-w) * 0.011);
    min-height: calc(var(--right-panel-w) * 0.076);
    display: flex; flex-direction: column; justify-content: space-between;
    transition: background 0.2s; position: relative;
  }
  .item-card:hover { background: rgba(255,255,255,0.6); }
  .item-top { display: flex; align-items: flex-start; gap: calc(var(--right-panel-w) * 0.006); }
  .item-icon { width: calc(var(--right-panel-w) * 0.017); height: calc(var(--right-panel-w) * 0.017); flex-shrink: 0; color: var(--accent); opacity: 0.85; }
  .item-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .item-info { flex: 1; display: flex; flex-direction: column; gap: calc(var(--right-panel-w) * 0.002); min-width: 0; }
  .item-name { font-size: calc(var(--right-panel-w) * 0.014); font-weight: 600; color: var(--ink); line-height: 1.4; padding-right: calc(var(--right-panel-w) * 0.029); }
  .item-equipped {
    position: absolute; top: calc(var(--right-panel-w) * 0.008); right: calc(var(--right-panel-w) * 0.008);
    font-size: calc(var(--right-panel-w) * 0.012); color: var(--accent);
    display: flex; align-items: center; gap: 2px;
  }
  .item-equipped::before { content: "◆"; font-size: 7px; }
  .item-quantity { font-size: calc(var(--right-panel-w) * 0.012); color: var(--ink-soft); padding-top: calc(var(--right-panel-w) * 0.004); }

  .inv-gold { font-size: calc(var(--right-panel-w) * 0.016); font-weight: 700; color: var(--accent); margin-bottom: calc(var(--right-panel-w) * 0.010); }
  .inv-empty { display: block; width: 100%; font-size: calc(var(--right-panel-w) * 0.020); color: var(--ink-soft); font-style: italic; text-align: center; padding: calc(var(--right-panel-w) * 0.010); }

  /* ── 工具提示 ── */
  .item-tooltip {
    position: fixed; z-index: 1000; background: var(--paper-light);
    border: 2px solid var(--accent); border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 8px 28px rgba(61,43,31,0.22); min-width: 220px; max-width: 280px;
    pointer-events: none; opacity: 0; transition: opacity 0.15s; display: none;
  }
  .item-tooltip.show { display: block; opacity: 1; }
  .item-tooltip-name { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .item-tooltip-save { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; }
  .item-tooltip-desc { font-size: 11px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .item-tooltip-breakdown { font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; padding-left: 6px; }

  .inv-list { display: flex; flex-direction: column; gap: 6px; }
  .inv-item {
    display: flex; align-items: center; justify-content: space-between;

<body>

<script>
(function() {
  /* ── 常量 ── */
  const ADVENTURE_ID = 'lost-mine-of-phandelver';
  const CHAPTER_ID = 'ch1';

  /* ── 全局状态 ── */
  let state = {
    adventureId: ADVENTURE_ID,
    chapterId: CHAPTER_ID,
    currentSceneId: null,
    data: null,
    character: null,
    log: [],
    quests: {},
    npcStates: {},
    locationStates: {},
    playerInventory: [],
    sessionStarted: false
  };

  /* ── 辅助 ── */
  function getCurrentScene() {
    if (!state.data || !state.currentSceneId) return null;
    return state.data.scenes[state.currentSceneId] || null;
  }

  function getCurrentLocation() {
    const scene = getCurrentScene();
    if (!scene) return null;
    return state.data.locations[scene.location] || null;
  }

  /* ── DOM 引用 ── */
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  const narrativeLog = $('#narrative-log');
  const playerInput = $('#player-input');
  const sendBtn = $('#send-btn');
  const charCard = $('#char-card');
  const modalOverlay = $('#detail-modal-overlay');
  const modalContent = $('#detail-modal-content');
  const modalClose = $('#detail-modal-close');

  /* ── 数据加载 ── */
  const DEFAULT_CHAR_ID = 'char_20260727185910_c22d22';

  function getAbility(char, key) {
    /* 兼容两种角色卡格式：后端嵌套 abilities.str.value / 前端扁平 str/dex */
    if (char.abilities && char.abilities[key] && char.abilities[key].value != null) {
      return char.abilities[key].value;
    }
    const flatMap = { str: 'strength', dex: 'dexterity', con: 'constitution', int: 'intelligence', wis: 'wisdom', cha: 'charisma' };
    const flatKey = flatMap[key] || key;
    if (char[flatKey] != null) return char[flatKey];
    if (char[key] != null) return char[key];
    return 10;
  }

  function getAbilitiesArray(char) {
    return [
      { name: '力量', key: 'str', abbr: 'STR', val: getAbility(char, 'str') },
      { name: '敏捷', key: 'dex', abbr: 'DEX', val: getAbility(char, 'dex') },
      { name: '体质', key: 'con', abbr: 'CON', val: getAbility(char, 'con') },
      { name: '智力', key: 'int', abbr: 'INT', val: getAbility(char, 'int') },
      { name: '感知', key: 'wis', abbr: 'WIS', val: getAbility(char, 'wis') },
      { name: '魅力', key: 'cha', abbr: 'CHA', val: getAbility(char, 'cha') }
    ];
  }

  async function loadCharacter() {
    /* localStorage 优先，否则从 API 加载默认角色 */
    try {
      const raw = localStorage.getItem('currentCharacter');
      if (raw) {
        state.character = normalizeChar(JSON.parse(raw));
        return;
      }
      const resp = await fetch(`/api/characters/${DEFAULT_CHAR_ID}`);
      if (resp.ok) {
        const data = await resp.json();
        state.character = normalizeChar(data);
        return;
      }
    } catch (e) {
      console.warn('角色加载失败:', e);
    }
    state.character = null;
  }

  function normalizeAbilities(abilities) {
    if (!abilities) return {};
    const result = {};
    const keys = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
    const labels = { str: '力', dex: '敏', con: '体', int: '智', wis: '感', cha: '魅' };
    for (const key of keys) {
      const raw = abilities[key];
      if (typeof raw === 'object' && raw !== null) {
        result[key] = {
          label: raw.label || labels[key] || key,
          value: raw.value != null ? raw.value : 10,
          save_bonus: raw.save_bonus || '+0',
          highlighted: !!raw.highlighted,
        };
      } else {
        const score = typeof raw === 'number' ? raw : 10;
        const mod = Math.floor((score - 10) / 2);
        result[key] = {
          label: labels[key] || key,
          value: score,
          save_bonus: mod >= 0 ? '+' + mod : String(mod),
          highlighted: false,
        };
      }
    }
    return result;
  }

  function normalizeChar(char) {
    if (!char) return char;
    return {
      ...char,
      combat: char.combat || { ac: 10, hp: '0 / 0' },
      xp: char.xp || { current: 0, max: 300, display: '0 / 300' },
      attack: char.attack || {
        melee: { label: '近战', bonus: '+0', damage: '1d4' },
        ranged: { label: '远程', bonus: '+0', damage: '1d4' },
      },
      inventory: char.inventory || { gold: 0, items: [] },
      features: char.features || { status_ids: [], resistance_ids: [], class_feature_ids: [], trait_ids: [] },
      skills: char.skills || { proficiency_bonus: '+2', sections: [] },
      spells: char.spells || { caster_level: 1, action_ids: { normal: ["jump", "throw", "dash"], class: [] }, passive_ids: [], spell_ids: {} },
      background: char.background || {
        class: '', race: '', attributes: {},
        traits: { personality: '', ideal: '', bond: '', flaw: '' },
        story: [],
      },
      abilities: normalizeAbilities(char.abilities),
    };
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  const DATA_URLS = {
    meta: `/data/adventures/${ADVENTURE_ID}/meta.json`,
    globalNpcs: `/data/adventures/${ADVENTURE_ID}/global/npcs.json`,
    chapter: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/chapter.json`,
    locations: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/locations.json`,
    chapterNpcs: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/npcs.json`,
    items: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/items.json`,
    quests: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/quests.json`,
    encounters: `/data/adventures/${ADVENTURE_ID}/chapters/${CHAPTER_ID}/encounters.json`
  };

  async function loadAllData() {
    const results = {};
    const keys = Object.keys(DATA_URLS);

    const responses = await Promise.all(
      keys.map(k => fetch(DATA_URLS[k]).then(r => r.json()))
    );

    keys.forEach((k, i) => { results[k] = responses[i]; });

    // 合并数据
    const allNpcs = {
      ...results.globalNpcs.npcs,
      ...results.chapterNpcs.npcs
    };

    const allItems = results.items.items;
    const chapter = results.chapter;

    // 构建场景索引
    const scenes = {};
    (chapter.scenes || []).forEach(s => { scenes[s.id] = s; });

    state.data = {
      meta: results.meta,
      chapter,
      scenes,
      locations: results.locations.locations,
      npcs: allNpcs,
      items: allItems,
      quests: results.quests.quests,
      encounters: results.encounters.encounters
    };

    state.currentSceneId = chapter.starting_scene || (chapter.scenes && chapter.scenes[0] ? chapter.scenes[0].id : null);
    state.quests = { ...results.quests.quests };
    state.sessionStarted = true;
  }

  /* ── 日志操作 ── */
  function appendLog(type, text, meta) {
    state.log.push({ type, text, timestamp: Date.now(), meta: meta || {} });
    renderNarrativeLog();
  }

  /* ── 渲染叙事日志 ── */
  function renderNarrativeLog() {
    if (state.log.length === 0) {
      narrativeLog.innerHTML = '';
      return;
    }

    const labels = { gm: 'GM', player: '玩家', system: '系统', check: '检定' };

    narrativeLog.innerHTML = state.log.map(entry => {
      let extra = '';
      if (entry.type === 'check' && entry.meta) {
        const m = entry.meta;
        const rollText = m.roll ? `d20(${m.roll})+${m.mod||0}` : '';
        const dcText = m.dc ? ` DC ${m.dc}` : '';
        const result = m.success ? '成功' : '失败';
        const resultClass = m.success ? 'color:var(--accent);' : 'color:var(--danger);';
        extra = `<div style="margin-top:6px;font-size:13px;">掷骰: ${rollText}${dcText} — <span style="${resultClass}font-weight:700;">${result}</span></div>`;
      }
      return `
        <div class="log-entry ${entry.type}">
          <div class="log-label">${labels[entry.type] || entry.type}</div>
          <div>${entry.text}</div>
          ${extra}
        </div>
      `;
    }).join('');

    narrativeLog.scrollTop = narrativeLog.scrollHeight;
  }

  function renderLocationHeader() {
    const scene = getCurrentScene();
    const loc = getCurrentLocation();
    if (!scene) return;

    const titleEl = $('#location-title');
    const metaEl = $('#location-meta');

    // 如果有父地点则显示 "父地点 · 子地点"
    if (loc && loc.parent_location) {
      titleEl.textContent = `${loc.parent_location} · ${loc.name}`;
    } else {
      titleEl.textContent = loc ? loc.name : scene.name;
    }
    const chapter = state.data.chapter;
    metaEl.textContent = chapter ? `${chapter.title} · ${scene.name}` : scene.name;

  /* ── 渲染左侧上下文面板 ── */
  function renderContextPanel() {
    const scene = getCurrentScene();
    const loc = getCurrentLocation();
    if (!scene || !loc) return;

    // 当前地点
    const locEl = $('#context-location');
    if (locEl) {
      locEl.querySelector('.location-name').textContent = loc.name;
      locEl.onclick = () => openDetailModal('location', loc.id);
    }

    // 人物：优先使用场景定义的 npcs
    const npcsEl = $('#context-npcs');
    const npcIds = scene.npcs && scene.npcs.length > 0 ? scene.npcs : (loc.npcs || []);
    if (npcIds.length === 0) {
      npcsEl.innerHTML = '<div class="context-empty">此处没有其他人</div>';
    } else {
      npcsEl.innerHTML = npcIds.map(id => {
        const npc = state.data.npcs[id];
        if (!npc) return '';
        return `
          <div class="context-item" data-type="npc" data-id="${id}">
            <div class="context-item-icon">${npc.name[0]}</div>
            <div class="context-item-name">${npc.name}</div>
            <div class="context-item-meta">${npc.role || ''}</div>
          </div>
        `;
      }).join('');
      npcsEl.querySelectorAll('.context-item').forEach(el => {
        el.addEventListener('click', () => openDetailModal('npc', el.dataset.id));
      });
    }

    // 物品：优先使用场景定义的 items
    const itemsEl = $('#context-items');
    const sceneItemIds = (scene.items && scene.items.length > 0) ? scene.items : null;
    let locItems = loc.items || [];
    let visibleItems;
    if (sceneItemIds) {
      // 场景定义了物品列表，从 items 数据中查找详细信息（包括 location items 中匹配的）
      visibleItems = sceneItemIds.map(id => ({ id, visible: true }));
    } else {
      visibleItems = locItems.filter(i => i.visible !== false);
    }
    if (visibleItems.length === 0) {
      itemsEl.innerHTML = '<div class="context-empty">此处没有可见物品</div>';
    } else {
      itemsEl.innerHTML = visibleItems.map(entry => {
        const item = state.data.items[entry.id];
        if (!item) return '';
        return `
          <div class="context-item" data-type="item" data-id="${entry.id}">
            <div class="context-item-icon">I</div>
            <div class="context-item-name">${item.name}</div>
          </div>
        `;
      }).join('');
      itemsEl.querySelectorAll('.context-item').forEach(el => {
        el.addEventListener('click', () => openDetailModal('item', el.dataset.id));
      });
    }

    // 可去地点：仅显示当前地点的物理出口
    const exitsSection = $('#context-exits-section');
    const exitsEl = $('#context-exits');
    const exits = buildSceneExits(scene);
    if (exits.length === 0) {
      exitsSection.style.display = 'none';
    } else {
      exitsSection.style.display = '';
      exitsEl.innerHTML = exits.map((exit, i) => `
        <div class="context-item" data-type="exit" data-index="${i}">
          <div class="context-item-icon" style="font-size:11px;">→</div>
          <div class="context-item-name">${exit.name}</div>
        </div>
      `).join('');
      exitsEl.querySelectorAll('.context-item').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.index);
          const exit = exits[idx];
          if (!exit || !exit.targetLocationId) return;

          // 检查目标地点是否属于另一个场景
          const targetScene = Object.values(state.data.scenes).find(
            s => s.location === exit.targetLocationId
          );
          if (targetScene && targetScene.id !== state.currentSceneId) {
            // 跨场景跳转（如洞穴房间之间）
            navigateToScene(targetScene.id);
          } else {
            // 同场景内探索（如绝冬城内各地点）
            navigateToLocation(exit.targetLocationId);
          }
        });
      });
    }

    // 任务
    const questsEl = $('#context-quests');
    const quests = state.data.quests;
    const questIds = Object.keys(quests).filter(id => quests[id].status !== 'hidden');
    if (questIds.length === 0) {
      questsEl.innerHTML = '<div class="context-empty">暂无任务</div>';
    } else {
      questsEl.innerHTML = questIds.map(id => {
        const q = quests[id];
        const statusLabel = q.status === 'completed' ? '(已完成)' : '';
        return `
          <div class="context-item">
            <div class="context-item-icon" style="font-size:10px;">Q</div>
            <div class="context-item-name">${q.name}</div>
            <div class="context-item-meta">${statusLabel}</div>
          </div>
        `;
      }).join('');
    }
  }

  /* ── 悬浮提示（物品 + 技能法术，0.5s 延迟） ── */
  (function initTooltip() {
    const tooltip = document.createElement('div');
    tooltip.className = 'item-tooltip';
    document.body.appendChild(tooltip);

    let hoverTimer = null;

    function showTooltip(e, card) {
      const name = card.dataset.name || card.querySelector('.item-name')?.textContent || '';
      const description = card.dataset.description || '';
      const equipped = card.querySelector('.item-equipped');
      const eqText = equipped ? '（已装备）' : '';
      tooltip.innerHTML = `
        <div class="item-tooltip-name">${name} ${eqText}</div>
        <div class="item-tooltip-desc">${description || '详细属性待补充'}</div>
      `;
      positionTooltip(e, tooltip);
      tooltip.classList.add('show');
    }

    function positionTooltip(e, el) {
      const rect = el.getBoundingClientRect();
      let x = e.clientX + 14;
      let y = e.clientY - 10;
      if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - 14;
      if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 10;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }

    function hideTooltip() {
      tooltip.classList.remove('show');
    }

    /* 物品悬浮提示 */
    document.addEventListener('mouseenter', function(e) {
      const card = e.target.closest('.item-card');
      if (!card) return;
      hoverTimer = setTimeout(() => showTooltip(e, card), 500);
    }, true);

    document.addEventListener('mousemove', function(e) {
      const card = e.target.closest('.item-card');
      if (!card) return;
      if (tooltip.classList.contains('show')) showTooltip(e, card);
    });

    document.addEventListener('mouseleave', function(e) {
      const card = e.target.closest('.item-card');
      if (!card) return;
      clearTimeout(hoverTimer);
      hideTooltip();
    }, true);

    /* 技能/法术悬浮提示 */
    document.addEventListener('mouseenter', function(e) {
      const block = e.target.closest('.skill-block');
      if (!block) return;
      hoverTimer = setTimeout(() => {
        const spellId = block.dataset.spellId;
        const lookup = window.spellLookup || {};
        const spell = spellId ? lookup[spellId] : null;
        const name = block.textContent.trim();
        if (spell) {
          let html = `<div class="item-tooltip-name">${spell.name}</div>`;
          if (spell.school || spell.casting_time)
            html += `<div class="item-tooltip-save">${[spell.school, spell.casting_time].filter(Boolean).join(' · ')}</div>`;
          if (spell.description)
            html += `<div class="item-tooltip-desc">${spell.description}</div>`;
          if (spell.range)
            html += `<div class="item-tooltip-breakdown">射程：${spell.range}</div>`;
          tooltip.innerHTML = html;
        } else {
          tooltip.innerHTML = `<div class="item-tooltip-name">${name}</div><div class="item-tooltip-desc">详细描述待补充</div>`;
        }
        const r = block.getBoundingClientRect();
        tooltip.style.left = Math.max(8, r.left) + 'px';
        tooltip.style.top = (r.bottom + 8) + 'px';
        const tr = tooltip.getBoundingClientRect();
        if (tr.right > window.innerWidth) tooltip.style.left = (window.innerWidth - tr.width - 8) + 'px';
        if (tr.bottom > window.innerHeight) tooltip.style.top = (r.top - tr.height - 8) + 'px';
        tooltip.classList.add('show');
      }, 500);
    }, true);

    document.addEventListener('mouseleave', function(e) {
      const block = e.target.closest('.skill-block');
      if (!block) return;
      clearTimeout(hoverTimer);
      hideTooltip();
    }, true);

    document.addEventListener('scroll', hideTooltip);
  })();

  /* ═══ 职业特性（抄自 lobby renderClassAttr） ═══ */
  function renderClassAttrTab(char) {
    const features = catalogs.features || {};
    const classes = catalogs.classes || {};
    const classData = char.class_id ? classes[char.class_id] : null;
    const subclassData = classData && char.subclass_id ? (classData.subclasses || {})[char.subclass_id] : null;

    const statusItems = (char.features?.status_ids || []).map(id => features.status ? features.status[id] : null).filter(Boolean);
    const resistanceItems = (char.features?.resistance_ids || []).map(id => features.resistances ? features.resistances[id] : null).filter(Boolean);
    const classFeatureItems = (char.features?.class_feature_ids || []).map(id => features.class_features ? features.class_features[id] : null).filter(Boolean);
    const traitItems = (char.features?.trait_ids || []).map(id =>
      (features.traits && features.traits[id]) || (features.racial && features.racial[id]) || null
    ).filter(Boolean);

    const abilityOrder = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
    const abilityHtml = abilityOrder.map(key => {
      const a = char.abilities[key];
      return `<div class="ability">
        <div class="ability-star">${a.highlighted ? '&#9733;' : ''}</div>
        <div class="ability-label">${escapeHtml(a.label)}</div>
        <div class="ability-value ${a.highlighted ? 'highlighted' : ''}">${a.value}</div>
      </div>`;
    }).join('');

    const featSection = (title, items) => items.length
      ? `<div class="divider"><span>${title}</span></div><ul class="feature-list">${items.map(f => `<li>${escapeHtml(f.name)} <span class="feature-arrow"><svg viewBox="0 0 12 8"><polyline points="2,2 6,6 10,2"></polyline></svg></span></li><div class="feature-detail">${escapeHtml(f.description || '')}</div>`).join('')}</ul>`
      : '';

    const raceName = char.background?.race || '';
    const className = classData ? classData.name : (char.class || '');
    return `
      <div class="class-panel">
        <div class="class-race">${escapeHtml(raceName)}</div>
        <div class="class-icon">${escapeHtml(classData ? (classData.icon || '') : '')}</div>
        <div class="class-subclass">${escapeHtml(subclassData ? subclassData.name : '')}</div>
        <div class="class-level">等级${char.level || 1} ${escapeHtml(className)}</div>

        <div class="ability-scores">${abilityHtml}</div>
        ${featSection('状态', statusItems)}
        ${featSection('抗性', resistanceItems)}
        ${featSection('职业特性', classFeatureItems)}
        ${featSection('重要特性', traitItems)}
      </div>
    `;
  }

  /* ═══ 熟练加值（抄自 lobby renderSkills） ═══ */
  function renderSkillsTab(char) {
    const sections = char.skills?.sections || [];
    const pb = char.skills?.proficiency_bonus || '+2';
    return `
      <div class="prof-bonus"><span class="star">★</span>熟练项加值 (${escapeHtml(pb)})</div>
      ${sections.map(section => `
        <div class="divider"><span>${escapeHtml(section.ability)} (${escapeHtml(section.modifier)})</span></div>
        ${section.skills.map(skill => `
          <div class="skill-row">
            <span class="skill-name">${escapeHtml(skill.name)}</span>
            <span class="skill-value ${skill.type}">${escapeHtml(skill.value)}</span>
          </div>
        `).join('')}
      `).join('')}
    `;
  }

  /* ═══ 技能&法术（抄自 lobby renderSpells） ═══ */
  function renderSpellsTab(char) {
    const spells = catalogs.spells || {};

    // 构建快速查找表
    window.spellLookup = {};
    const addLookup = (catalog) => { if (catalog) Object.entries(catalog).forEach(([id, s]) => { window.spellLookup[id] = s; }); };
    addLookup(spells.actions?.normal);
    addLookup(spells.actions?.class);
    addLookup(spells.passive);
    addLookup(spells.spells?.level_1);
    addLookup(spells.cantrips);

    const lookupNames = (ids, catalog) =>
      (ids || []).map(id => (catalog && catalog[id]) ? catalog[id].name : id);

    const normalItems = lookupNames((char.spells?.action_ids || {}).normal || [], spells.actions?.normal);
    const classItems  = lookupNames((char.spells?.action_ids || {}).class || [], spells.actions?.class);
    const passiveItems = lookupNames(char.spells?.passive_ids || [], spells.passive);
    const spellL1Items = lookupNames((char.spells?.spell_ids || {}).level_1 || [], spells.spells?.level_1);
    const cantripItems = lookupNames(char.cantrip_ids || [], spells.cantrips);

    const renderBlock = (name, spellId) =>
      `<div class="skill-block" data-spell-id="${escapeHtml(spellId || '')}">${escapeHtml(name)}</div>`;

    const renderGroup = (list, catalog) => {
      return list.map(item => {
        const entries = catalog ? Object.entries(catalog) : [];
        const found = entries.find(([, v]) => v.name === item);
        return renderBlock(item, found ? found[0] : '');
      }).join('');
    };

    const section = (title, items, catalog) => items.length
      ? `<div class="divider"><span>${title}</span></div><div class="skill-grid">${renderGroup(items, catalog)}</div>`
      : '';

    return `
      ${section('常规动作', normalItems, spells.actions?.normal)}
      ${section('职业动作', classItems, spells.actions?.class)}
      ${section('被动技能', passiveItems, spells.passive)}
      ${section('戏法', cantripItems, spells.cantrips)}
      ${section('1环法术', spellL1Items, spells.spells?.level_1)}
    `;
  }

  /* ═══ 人物背景（抄自 lobby renderBackground） ═══ */
  function renderBackgroundTab(char) {
    const bg = char.background;
    const labelMap = { move_speed:'移动速度', darkvision:'黑暗视觉范围', ranged_range:'远程攻击范围', melee_range:'近战攻击范围', throw_range:'投掷范围', size:'体型', weight:'重量', carry_weight:'负重' };
    const attrsHtml = Object.entries(bg.attributes || {}).map(([k, v]) =>
      `<div class="bg-info-row"><span class="bg-info-label">${labelMap[k] || k}</span><span class="bg-info-value">${escapeHtml(String(v))}</span></div>`
    ).join('');

    const saveAbilities = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
    const saveHtml = saveAbilities.map(key => {
      const a = char.abilities[key];
      return `<div class="ability"><div class="ability-label">${escapeHtml(a.label)}</div><div class="ability-value highlighted">${escapeHtml(a.save_bonus)}</div></div>`;
    }).join('');

    const traitMap = { personality:'个人特点', ideal:'理想', bond:'牵绊', flaw:'缺点' };
    const traitsHtml = Object.entries(bg.traits || {}).map(([k, text]) =>
      `<div class="bg-trait"><div class="bg-trait-title">${traitMap[k] || k}</div><div class="bg-trait-text">${escapeHtml(text || '—')}</div></div>`
    ).join('');

    return `
      <div class="divider"><span>属性</span></div>
      ${attrsHtml}
      <div class="divider"><span>豁免</span></div>
      <div class="ability-scores">${saveHtml}</div>
      <div class="divider"><span>背景</span></div>
      ${traitsHtml}
    `;
  }

  /* ── 详情弹窗 ── */
  function openDetailModal(type, id, extra) {
    let title = '';
    let meta = '';
    let desc = '';
    let avatar = '?';

    switch (type) {
      case 'npc': {
        const npc = state.data.npcs[id];
        if (!npc) return;
        title = npc.name;
        meta = `${npc.race || ''} · ${npc.role || ''}`;
        desc = npc.description || '';
        avatar = npc.name[0];
        break;
      }
      case 'item': {
        const item = state.data.items[id];
        if (!item) return;
        title = item.name;
        meta = item.type || '';
        desc = item.description || '';
        avatar = 'I';
        if (item.stealable) {
          desc += '\n\n可偷取: 是 · 难度 DC ' + (item.difficulty || '?');
        }
        if (item.owner) {
          const owner = state.data.npcs[item.owner];
          desc += '\n拥有者: ' + (owner ? owner.name : item.owner);
        }
        break;
      }
      case 'exit': {
        const targetLoc = state.data.locations[id];
        title = extra.name || '出口';
        meta = extra.description || '';
        desc = targetLoc ? `通往: ${targetLoc.name}` : '';
        avatar = '→';
        break;
      }
      case 'location': {
        const loc = state.data.locations[id];
        if (!loc) return;
        title = loc.name;
        meta = loc.type || '';
        desc = loc.description || '';
        avatar = loc.name[0];
        break;
      }
    }

    modalContent.innerHTML = `
      <div class="modal-header">
        <div class="modal-avatar">${avatar}</div>
        <div>
          <div class="modal-name">${title}</div>
          <div class="modal-meta">${meta}</div>
        </div>
      </div>
      <div class="modal-desc">${desc.replace(/\n/g, '<br>')}</div>
    `;

    modalOverlay.classList.add('active');
  }

  function closeDetailModal() {
    modalOverlay.classList.remove('active');
  }

  modalClose.addEventListener('click', closeDetailModal);
  modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) closeDetailModal();
  });

  /* ── 掷骰 ── */
  function rollDice(sides, mod) {
    const roll = Math.floor(Math.random() * sides) + 1;
    return { roll, mod: mod || 0, total: roll + (mod || 0) };
  }

  /* ── 快捷检定按钮 ── */
  async function handleQuickCheck(type) {
    if (!state.character) {
      appendLog('system', '未选择角色，无法进行检定。');
      return;
    }
    await handlePlayerInput(type === 'perception' ? '侦察周围环境' : '调查这个区域');
  }

  $$('.check-btn').forEach(btn => {
    btn.addEventListener('click', () => handleQuickCheck(btn.dataset.check));
  });

  /* ── 构建场景出口列表 ── */
  function buildSceneExits(scene) {
    if (!scene) return [];
    const exits = [];
    const loc = getCurrentLocation();

    // 只展示物理地点出口（不展示场景跳转）
    if (loc && loc.exits) {
      loc.exits.forEach(exit => {
        const targetLoc = state.data.locations[exit.target];
        exits.push({
          name: exit.name,
          targetLocationId: exit.target,
          targetSceneId: null,
          description: exit.description || (targetLoc ? targetLoc.description : '')
        });
      });
    }

    return exits;
  }

  /* ── 地点跳转（同场景内自由探索） ── */
  function navigateToLocation(locationId) {
    const targetLoc = state.data.locations[locationId];
    if (!targetLoc) return;

    // 检查目标地点是否在当前场景的 free_locations 内（如果定义了的话）
    const scene = getCurrentScene();
    if (scene && scene.free_locations && scene.free_locations.length > 0 && !scene.free_locations.includes(locationId)) {
      appendLog('system', '无法到达那个地方。');
      return;
    }

    // 更新场景的 location 引用（不切换场景）
    scene.location = locationId;
    appendLog('system', `你来到了: ${targetLoc.name}`);
    appendLog('gm', targetLoc.scene_text || targetLoc.description || '');

    renderLocationHeader();
    renderContextPanel();
  }

  /* ── 场景跳转 ── */
  function navigateToScene(sceneId) {
    const targetScene = state.data.scenes[sceneId];
    if (!targetScene) return;

    const targetLoc = state.data.locations[targetScene.location];
    if (!targetLoc) {
      appendLog('system', `无法到达: ${targetScene.name}`);
      return;
    }

    state.currentSceneId = sceneId;
    appendLog('gm', targetLoc.scene_text || targetLoc.description || targetScene.description || '');

    renderLocationHeader();
    renderContextPanel();
  }

  /* ── 处理玩家输入（接入后端 API） ── */
  async function handlePlayerInput(text) {
    if (!text || !text.trim()) return;
    appendLog('player', text.trim());
    playerInput.value = '';

    try {
      const resp = await fetch('/api/game/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          adventure_id: ADVENTURE_ID,
          chapter_id: CHAPTER_ID,
          scene_id: state.currentSceneId,
          player_input: text.trim(),
          character: state.character ? {
            name: state.character.name,
            level: state.character.level,
            wisdom: state.character.abilities?.wis?.value ?? 10,
            intelligence: state.character.abilities?.int?.value ?? 10,
            dexterity: state.character.abilities?.dex?.value ?? 10,
            strength: state.character.abilities?.str?.value ?? 10,
          } : null,
        }),
      });

      if (!resp.ok) {
        appendLog('system', '与 GM 通讯失败，请稍后重试。');
        return;
      }

      const result = await resp.json();

      // GM 回复
      if (result.gm_text) {
        appendLog('gm', result.gm_text);
      }

      // 检定提示
      if (result.checks && result.checks.length > 0) {
        result.checks.forEach(c => {
          appendLog('check', `检定项: ${c.skill}${c.dc ? ' (DC ' + c.dc + ')' : ''} - ${c.reason || ''}`);
        });
      }

      // 状态变更
      if (result.state_changes && result.state_changes.length > 0) {
        for (const ch of result.state_changes) {
          if (ch.type === 'advance_scene') {
            navigateToScene(ch.scene_id);
          } else if (ch.type === 'move') {
            navigateToLocation(ch.location_id);
          }
        }
      }

      renderLocationHeader();
      renderContextPanel();
    } catch (e) {
      console.error('GM API error:', e);
      appendLog('system', '与 GM 的连接中断，请稍后重试。');
    }
  }

  sendBtn.addEventListener('click', () => {
    const text = playerInput.value;
    if (text.trim()) {
      handlePlayerInput(text);
      playerInput.value = '';
    }
  });

  playerInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const text = playerInput.value;
      if (text.trim()) {
        handlePlayerInput(text);
        playerInput.value = '';
      }
    }
  });

  /* ── 键盘快捷操作 ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (modalOverlay.classList.contains('active')) {
        closeDetailModal();
      }
    }
  });

  /* ── 面板拖拽调整宽度 ── */
  (function initResize() {
    try {
      const leftPanel = $('#left-panel');
      const rightPanel = $('#right-panel');
      const handleLeft = $('#resize-handle-left');
      const handleRight = $('#resize-handle-right');
      const root = document.documentElement;
      const MIN_W = 120;

      const savedLW = parseInt(localStorage.getItem('adventure-left-panel-w'));
      const savedRW = parseInt(localStorage.getItem('adventure-right-panel-w'));
      if (savedLW && savedLW >= MIN_W) {
        root.style.setProperty('--left-panel-w', savedLW + 'px');
      }
      if (savedRW && savedRW >= MIN_W) {
        root.style.setProperty('--right-panel-w', savedRW + 'px');
      }

      function makeResizable(handle, panel, cssVar, isRight) {
        if (!handle || !panel) return;
        let dragging = false;
        let startX, startW;

        handle.addEventListener('mousedown', e => {
          dragging = true;
          startX = e.clientX;
          startW = panel.getBoundingClientRect().width;
          handle.classList.add('active');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
          e.preventDefault();
        });
        document.addEventListener('mousemove', e => {
          if (!dragging) return;
          const delta = isRight ? (startX - e.clientX) : (e.clientX - startX);
          const newW = Math.max(MIN_W, startW + delta);
          root.style.setProperty(cssVar, newW + 'px');
        });
        document.addEventListener('mouseup', () => {
          if (!dragging) return;
          dragging = false;
          handle.classList.remove('active');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          const w = panel.getBoundingClientRect().width;
          localStorage.setItem(isRight ? 'adventure-right-panel-w' : 'adventure-left-panel-w', Math.round(w));
        });
      }

      makeResizable(handleLeft, leftPanel, '--left-panel-w', false);
      makeResizable(handleRight, rightPanel, '--right-panel-w', true);
    } catch (e) {}
  })();

  /* ── 初始化游戏 ── */
  async function initGame() {
    try {
      await loadCharacter();
      await loadAllData();
      await loadCatalogs();
      initTabs();

      const scene = getCurrentScene();
      const loc = getCurrentLocation();
      if (!scene || !loc) {
        narrativeLog.innerHTML = '<div class="log-entry system" style="text-align:center;"><div class="log-label">错误</div><div>未找到初始场景</div></div>';
        return;
      }

      // 清空日志
      state.log = [];

      // 初始 GM 描述
      appendLog('gm', loc.scene_text || loc.description || scene.description || '');

      // 渲染 UI
      renderLocationHeader();
      renderContextPanel();
      renderRightPanel();
      renderAllTabs();
    } catch (err) {
      console.error('初始化失败:', err);
      narrativeLog.innerHTML = `<div class="log-entry system" style="text-align:center;"><div class="log-label">错误</div><div>数据加载失败: ${err.message}</div></div>`;
    }
  }

  /* ── 启动 ── */
  document.body.classList.add('page-in');
  initGame();
})();
</script>
