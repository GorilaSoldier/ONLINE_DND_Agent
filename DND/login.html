<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNDBOX</title>
  <style>
    :root {
      --ink: #3d2b1f;
      --ink-soft: #6b4e3d;
      --paper: #faf6ee;
      --paper-light: #fdfbf7;
      --paper-dark: #e5dbca;
      --accent: #8b5a2b;
      --accent-hover: #6d4520;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(139, 90, 43, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(62, 43, 31, 0.06) 0%, transparent 50%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      background-size: auto, auto, 200px 200px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(61, 43, 31, 0.04) 1px, transparent 1px),
        linear-gradient(rgba(61, 43, 31, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.5;
    }

    header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--ink);
    }

    .logo svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 120px;
      text-align: center;
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: var(--paper-light);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 8px 24px rgba(61, 43, 31, 0.12),
        0 2px 4px rgba(61, 43, 31, 0.08);
      border: 1px solid rgba(139, 90, 43, 0.2);
    }

    .brand-icon svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 20px;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    h1 span {
      color: var(--accent);
    }

    .tagline {
      max-width: 560px;
      font-size: 20px;
      line-height: 1.8;
      color: var(--ink-soft);
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .divider {
      font-size: 16px;
      color: var(--ink-soft);
      opacity: 0.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      text-decoration: none;
      position: relative;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--paper-light);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 4px 12px rgba(139, 90, 43, 0.25),
        0 0 0 rgba(200, 160, 60, 0);
    }

    .btn-primary:hover {
      transform: translateY(-4px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        0 12px 28px rgba(139, 90, 43, 0.4),
        0 0 24px rgba(200, 160, 60, 0.45),
        0 0 48px rgba(200, 160, 60, 0.2);
    }

    .btn-secondary {
      background: rgba(139, 90, 43, 0.06);
      color: var(--ink);
      border: 1px solid rgba(139, 90, 43, 0.25);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        0 2px 8px rgba(139, 90, 43, 0.1),
        0 0 0 rgba(180, 140, 60, 0);
    }

    .btn-secondary:hover {
      transform: translateY(-4px);
      background: rgba(139, 90, 43, 0.12);
      border-color: rgba(139, 90, 43, 0.45);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        0 10px 24px rgba(139, 90, 43, 0.25),
        0 0 18px rgba(180, 140, 60, 0.35),
        0 0 36px rgba(180, 140, 60, 0.15);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    footer {
      margin-top: 100px;
      padding: 12px 20px 0;
      text-align: center;
      font-size: 16px;
      color: var(--ink-soft);
      opacity: 0.75;
    }

    footer::before {
      content: "❧";
      display: block;
      margin-bottom: 10px;
      font-size: 20px;
      color: var(--accent);
      opacity: 0.6;
    }

    @media (max-width: 560px) {
      h1 {
        font-size: 52px;
      }

      .actions {
        flex-direction: column;
        width: 100%;
        max-width: 280px;
      }

      .divider {
        display: none;
      }

      .btn {
        width: 100%;
      }
    }

    /* 页面过渡动画 */
    body {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    body.page-out {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>
      </svg>
      DNDBOX
    </div>
  </header>

  <main>
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
        <path d="M2 17l10 5 10-5"></path>
        <path d="M2 12l10 5 10-5"></path>
      </svg>
    </div>

    <h1>DNDBOX</h1>

    <p class="tagline">
      掷下二十面骰，开始你的冒险之旅。
    </p>

    <div class="actions">
      <button class="btn btn-primary" type="button" id="btn-login">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        登录
      </button>
      <span class="divider">— 或 —</span>
      <button class="btn btn-secondary" type="button" id="btn-register">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <line x1="19" y1="8" x2="23" y2="8"></line>
          <line x1="21" y1="6" x2="21" y2="10"></line>
        </svg>
        注册
      </button>
    </div>
    <footer>
      吟游诗人正在谱曲
    </footer>
  </main>

  <script>
    function navigateTo(url) {
      document.body.classList.add('page-out');
      setTimeout(() => {
        window.location.href = url;
      }, 250);
    }

    document.getElementById('btn-login').addEventListener('click', () => navigateTo('lobby.html'));
    document.getElementById('btn-register').addEventListener('click', () => navigateTo('lobby.html'));
  </script>
</body>
</html>
