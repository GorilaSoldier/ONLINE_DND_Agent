<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNDBOX - 人物卡</title>
  <style>
    :root {
      --ink: #3d2b1f;
      --ink-soft: #6b4e3d;
      --paper: #e8d5b5;
      --paper-light: #f3e8d3;
      --paper-card: #fdf6e9;
      --sidebar: #2b1f16;
      --accent: #b87333;
      --accent-light: #d69a5c;
      --border: rgba(61, 43, 31, 0.12);
      --shadow: rgba(61, 43, 31, 0.12);
      --slot: rgba(61, 43, 31, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(139, 90, 43, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(62, 43, 31, 0.06) 0%, transparent 50%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      background-size: auto, auto, 200px 200px;
      min-height: 100vh;
      display: flex;
    }

    aside {
      width: 240px;
      flex-shrink: 0;
      background: var(--sidebar);
      color: var(--paper-light);
      display: flex;
      flex-direction: column;
      padding: 24px 0;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 24px 28px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--paper-light);
    }

    .brand svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-section {
      padding: 0 16px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      margin: 2px 0;
      border-radius: 8px;
      font-size: 14px;
      color: rgba(232, 213, 181, 0.75);
      cursor: default;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-item:hover {
      background: rgba(232, 213, 181, 0.08);
      color: var(--paper-light);
    }

    .nav-item.active {
      background: rgba(232, 213, 181, 0.14);
      color: var(--paper-light);
      box-shadow: inset 2px 0 0 var(--accent-light);
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    main {
      flex: 1;
      margin-left: 240px;
      min-height: 100vh;
      padding: 32px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 人物卡头部 */
    .char-card {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 16px var(--shadow);
      margin-bottom: 24px;
    }

    .char-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 24px;
    }

    .equipment-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slot {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      background: var(--slot);
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(61, 43, 31, 0.25);
    }

    .slot svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .char-portrait-wrap {
      text-align: center;
    }

    .char-name {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .char-portrait {
      width: 140px;
      height: 180px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      font-weight: 700;
      color: var(--paper-light);
      box-shadow: 0 8px 24px rgba(139, 90, 43, 0.28);
      margin: 0 auto;
    }

    .char-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .meta-tag {
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(184, 115, 51, 0.1);
      border: 1px solid rgba(184, 115, 51, 0.2);
    }

    .char-level {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .level-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: var(--accent);
    }

    .level-badge .num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(184, 115, 51, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .xp-bar {
      width: 240px;
      height: 6px;
      background: rgba(61, 43, 31, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }

    .xp-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
    }

    /* 护甲 & 生命值 */
    .combat-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .combat-stat {
      text-align: center;
    }

    .combat-stat-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 8px;
      border-radius: 10px;
      background: rgba(184, 115, 51, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .combat-stat-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .combat-stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
      margin-bottom: 4px;
    }

    .combat-stat-label {
      font-size: 12px;
      color: var(--ink-soft);
    }

    /* 标签页 */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid transparent;
      cursor: default;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: var(--paper-card);
      color: var(--ink);
      border-color: var(--border);
      box-shadow: 0 2px 8px var(--shadow);
    }

    /* 物品栏 */
    .inventory-panel {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px var(--shadow);
    }

    .inventory-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .inventory-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
    }

    .inventory-title svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .inventory-gold {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .item-card {
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.2s ease;
    }

    .item-card:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    .item-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.5;
    }

    .item-equipped {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .item-equipped::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4caf50;
    }

    .item-quantity {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: auto;
      padding-top: 12px;
    }

    @media (max-width: 720px) {
      aside {
        width: 64px;
        align-items: center;
      }

      .brand {
        padding: 0 0 28px;
        justify-content: center;
      }

      .brand span,
      .nav-item span {
        display: none;
      }

      .nav-item {
        justify-content: center;
        padding: 12px;
      }

      main {
        margin-left: 64px;
        padding: 20px;
      }

      .char-top {
        gap: 12px;
      }

      .slot {
        width: 44px;
        height: 44px;
      }

      .char-portrait {
        width: 110px;
        height: 150px;
        font-size: 56px;
      }

      .char-name {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>
      </svg>
      <span>DNDBOX</span>
    </div>

    <nav class="nav-section">
      <div class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>冒险日记</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>我的好友</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>游戏剧本</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>房间列表</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>个人设置</span>
      </div>
    </nav>
  </aside>

  <main>
    <div class="container">
      <div class="char-card">
        <div class="char-top">
          <div class="equipment-column left-slots">
            <div class="slot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></div>
            <div class="slot"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></div>
            <div class="slot"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg></div>
            <div class="slot"><svg viewBox="0 0 24 24"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path><line x1="16" y1="8" x2="2" y2="22"></line><line x1="17.5" y1="15" x2="9" y2="15"></line></svg></div>
          </div>

          <div class="char-portrait-wrap">
            <div class="char-name">埃利亚斯·灰溪</div>
            <div class="char-portrait">埃</div>
            <div class="char-meta">
              <span class="meta-tag">半精灵 Half-Elf</span>
              <span class="meta-tag">中型</span>
              <span class="meta-tag">圣武士 Paladin</span>
              <span class="meta-tag">士兵 Soldier</span>
            </div>
            <div class="char-level">
              <div class="level-badge">
                <span class="num">4</span>
                <span>等级</span>
              </div>
              <div class="xp-bar"><div class="xp-fill"></div></div>
              <span>XP 0 / 6,500</span>
            </div>
          </div>

          <div class="equipment-column right-slots">
            <div class="slot"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></div>
            <div class="slot"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect></svg></div>
            <div class="slot"><svg viewBox="0 0 24 24"><path d="M12 2l7 19-7-4-7 4 7-19z"></path></svg></div>
            <div class="slot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg></div>
          </div>
        </div>

        <div class="combat-stats">
          <div class="combat-stat">
            <div class="combat-stat-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
            </div>
            <div class="combat-stat-value">12</div>
            <div class="combat-stat-label">护甲等级</div>
          </div>
          <div class="combat-stat">
            <div class="combat-stat-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </div>
            <div class="combat-stat-value">36 / 36</div>
            <div class="combat-stat-label">生命值</div>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" type="button">物品栏</button>
        <button class="tab" type="button">职业&属性</button>
        <button class="tab" type="button">技能&特性</button>
        <button class="tab" type="button">人物背景</button>
      </div>

      <div class="inventory-panel">
        <div class="inventory-header">
          <div class="inventory-title">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            背包物资
          </div>
          <div class="inventory-gold">500 G</div>
        </div>

        <div class="items-grid">
          <div class="item-card">
            <div>
              <div class="item-name">旅行服装</div>
            </div>
            <div class="item-quantity">x1</div>
          </div>

          <div class="item-card">
            <div>
              <div class="item-equipped">已装备</div>
              <div class="item-name">胸甲 Breastplate</div>
            </div>
            <div class="item-quantity">x1</div>
          </div>

          <div class="item-card">
            <div>
              <div class="item-equipped">已装备</div>
              <div class="item-name">盾牌</div>
            </div>
            <div class="item-quantity">x1</div>
          </div>

          <div class="item-card">
            <div>
              <div class="item-equipped">已装备</div>
              <div class="item-name">徽章 Emblem</div>
            </div>
            <div class="item-quantity">x1</div>
          </div>

          <div class="item-card">
            <div>
              <div class="item-name">普通服装 Common Clothes</div>
            </div>
            <div class="item-quantity">x1</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
