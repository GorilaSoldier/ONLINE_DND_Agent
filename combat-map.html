<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNDBOX · 战斗地图</title>
<style>

  :root {
    --ink:       #3d2b1f;
    --ink-soft:  #6b4e3d;
    --paper:     #faf6ee;
    --paper-light: #fdfbf7;
    --paper-card:  #fffdf7;
    --paper-dark:  #e5dbca;
    --accent:    #8b5a2b;
    --accent-glow: #b8783e;
    --border:    rgba(61, 43, 31, 0.12);
    --shadow:    rgba(61, 43, 31, 0.12);
    --slot:      rgba(61, 43, 31, 0.06);
    --line-color: rgba(61, 43, 31, 0.35);
    --danger:    #b53b3b;
    --left-panel-w: 240px;
    --right-panel-w: 260px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "Songti SC", Georgia, serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  body.page-in { opacity: 1; }

  /* ── top bar ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--paper);
    flex-shrink: 0;
  }

  .top-bar .brand {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-back-lobby {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color 0.15s, border-color 0.15s;
  }

  .btn-back-lobby:hover {
    color: var(--ink);
    border-color: var(--ink-soft);
  }

  /* ── adventure body ── */
  .adventure-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── left panel（尺寸随面板宽度等比缩放） ── */
  .left-panel {
    width: var(--left-panel-w);
    min-width: 0;
    flex-shrink: 0;
    padding: calc(var(--left-panel-w) * 0.048) calc(var(--left-panel-w) * 0.041);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: calc(var(--left-panel-w) * 0.041);
    overflow-y: auto;
    transition: none;
  }

  .context-section {
    border: 1px solid var(--border);
    border-radius: calc(var(--left-panel-w) * 0.03);
    padding: calc(var(--left-panel-w) * 0.036) calc(var(--left-panel-w) * 0.041);
    background: var(--paper-light);
  }

  /* ── 战斗日志区（左侧面板底部，固定高度内部滚动） ── */
  .combat-log {
    height: 460px;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.7;
    padding: 8px 10px;
    background: rgba(20, 20, 30, 0.04);
    border-radius: 4px;
    scrollbar-width: thin;
  }
  .combat-log::-webkit-scrollbar { width: 6px; }
  .combat-log::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
  .combat-log-empty { color: #999; text-align: center; padding: 16px 0; font-style: italic; font-size: 15px; }
  /* 角色分组分隔条：换角色时插入，上下边线作为分隔符 */
  .combat-log-divider {
    margin-top: 10px;
    padding: 6px 8px;
    border-top: 2px solid rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(0,0,0,0.10);
    font-size: 14px;
    font-weight: 600;
    color: #444;
    text-align: center;
    background: rgba(0,0,0,0.05);
    border-radius: 3px;
    letter-spacing: 0.5px;
  }
  .combat-log-divider:first-child { margin-top: 0; }
  .combat-log-entry {
    padding: 4px 6px;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .combat-log-entry.log-attack { color: #b03a3a; }
  .combat-log-entry.log-heal { color: #2d8a4e; }
  .combat-log-entry.log-move { color: #4a6a8a; }
  .combat-log-entry.log-system { color: #666; }
  .combat-log-entry.log-crit { color: #c2185b; font-weight: bold; }

  .context-section h3 {
    font-size: calc(var(--left-panel-w) * 0.039);
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: calc(var(--left-panel-w) * 0.024);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .context-section h4 {
    font-size: calc(var(--left-panel-w) * 0.036);
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: calc(var(--left-panel-w) * 0.018);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.8;
  }

  .context-location {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(var(--left-panel-w) * 0.024) calc(var(--left-panel-w) * 0.036);
    background: var(--slot);
    border-radius: calc(var(--left-panel-w) * 0.024);
    cursor: pointer;
    transition: background 0.15s;
  }

  .context-location:hover {
    background: rgba(139, 90, 43, 0.10);
  }

  .location-name {
    font-size: calc(var(--left-panel-w) * 0.041);
    font-weight: 600;
    color: var(--ink);
  }

  .location-type-tag {
    font-size: calc(var(--left-panel-w) * 0.033);
    color: var(--ink-soft);
    padding: calc(var(--left-panel-w) * 0.006) calc(var(--left-panel-w) * 0.024);
    border: 1px solid var(--border);
    border-radius: calc(var(--left-panel-w) * 0.018);
  }

  .context-list {
    display: flex;
    flex-direction: column;
    gap: calc(var(--left-panel-w) * 0.012);
  }

  .context-item {
    display: flex;
    align-items: center;
    gap: calc(var(--left-panel-w) * 0.024);
    padding: calc(var(--left-panel-w) * 0.018) calc(var(--left-panel-w) * 0.03);
    border-radius: calc(var(--left-panel-w) * 0.018);
    cursor: pointer;
    transition: background 0.15s;
    font-size: calc(var(--left-panel-w) * 0.039);
  }

  .context-item:hover {
    background: rgba(139, 90, 43, 0.08);
  }

  .context-item-icon {
    width: calc(var(--left-panel-w) * 0.084);
    height: calc(var(--left-panel-w) * 0.084);
    border-radius: 50%;
    background: rgba(139, 90, 43, 0.12);
    color: var(--accent);
    font-size: calc(var(--left-panel-w) * 0.039);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .context-item-name {
    flex: 1;
    color: var(--ink);
    font-weight: 500;
  }

  .context-item-meta {
    font-size: calc(var(--left-panel-w) * 0.033);
    color: var(--ink-soft);
  }

  /* ── 任务子项（侧边栏展开用） ── */
  .quest-subtasks { width: 100%; padding-top: calc(var(--left-panel-w) * 0.012); border-top: 1px solid rgba(139,90,43,0.1); margin-top: calc(var(--left-panel-w) * 0.012); }
  .quest-subtask {
    display: flex; align-items: flex-start; gap: calc(var(--left-panel-w) * 0.018);
    padding: calc(var(--left-panel-w) * 0.012) 0 calc(var(--left-panel-w) * 0.012) calc(var(--left-panel-w) * 0.012); font-size: calc(var(--left-panel-w) * 0.036); color: var(--ink-soft);
    cursor: pointer; border-radius: calc(var(--left-panel-w) * 0.012); transition: background 0.15s;
  }
  .quest-subtask:hover { background: rgba(139,90,43,0.06); }
  .quest-subtask.done { opacity: 0.65; }
  .quest-subtask.done .quest-subtask-text { text-decoration: line-through; }
  .quest-subtask-check {
    width: calc(var(--left-panel-w) * 0.048);
    height: calc(var(--left-panel-w) * 0.048);
    border-radius: 50%;
    border: calc(var(--left-panel-w) * 0.004) solid var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: calc(var(--left-panel-w) * 0.003); font-size: calc(var(--left-panel-w) * 0.03); color: transparent;
  }
  .quest-subtask.done .quest-subtask-check { border-color: var(--accent); background: var(--accent); color: #fff; }
  .quest-subtask-text { flex: 1; line-height: 1.5; }
  .quest-item { cursor: pointer; flex-wrap: wrap; }
  .quest-expand-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: calc(var(--left-panel-w) * 0.067);
    height: calc(var(--left-panel-w) * 0.067);
    flex-shrink: 0;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.25s ease, color 0.2s ease;
  }
  .quest-expand-btn svg {
    width: calc(var(--left-panel-w) * 0.05);
    height: calc(var(--left-panel-w) * 0.05);
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .quest-expand-btn:hover { color: var(--accent); }
  .quest-expand-btn.open { transform: rotate(180deg); color: var(--accent); }

  /* ── 任务详情模态框（完全照抄 lobby.html） ── */
  .task-columns {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 20px;
    align-items: flex-start;
  }
  .task-sidebar {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-height: 480px;
    overflow-y: auto;
  }
  .task-category {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .task-category-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(61, 43, 31, 0.04);
    margin-bottom: 4px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s ease;
  }
  .task-category-title:hover {
    background: rgba(61, 43, 31, 0.08);
  }
  .task-category-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    color: var(--ink-soft);
    transition: transform 0.25s ease;
  }
  .task-category-arrow svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .task-category.collapsed .task-category-arrow {
    transform: rotate(-90deg);
  }
  .task-category.collapsed .task-category-list {
    display: none;
  }
  .task-category-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .task-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .task-nav-item:hover {
    background: rgba(184, 115, 51, 0.08);
  }
  .task-nav-item.active {
    background: rgba(184, 115, 51, 0.16);
    color: var(--ink);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .task-nav-item.task-completed {
    color: var(--ink-soft);
  }
  .task-nav-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .task-nav-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--ink-soft);
    transition: transform 0.25s ease;
  }
  .task-nav-arrow svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .task-nav-item.expanded .task-nav-arrow {
    transform: rotate(180deg);
  }
  .task-nav-item.no-expand {
    padding-right: 12px;
  }
  .task-nav-status {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .task-nav-status.ongoing {
    color: var(--paper-light);
    background: var(--accent);
  }
  .task-nav-status.completed {
    color: var(--ink-soft);
    background: rgba(61, 43, 31, 0.08);
  }
  .task-sub-nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px 7px 28px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .task-sub-nav-item:hover {
    background: rgba(184, 115, 51, 0.06);
  }
  .task-sub-nav-item.active {
    background: rgba(184, 115, 51, 0.12);
    color: var(--ink);
  }
  .task-sub-nav-item.completed {
    color: var(--ink-soft);
  }
  .task-sub-nav-item.completed .sub-nav-dot {
    background: var(--accent);
    opacity: 0.5;
  }
  .task-sub-nav-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sub-nav-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .task-detail {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px var(--shadow);
    min-height: 420px;
  }
  .task-detail-header {
    margin-bottom: 24px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .task-detail-tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    margin-bottom: 10px;
  }
  .task-detail-tag.ongoing {
    color: var(--paper-light);
    background: var(--accent);
  }
  .task-detail-tag.completed {
    color: var(--ink-soft);
    background: rgba(61, 43, 31, 0.08);
  }
  .task-detail-header h2 {
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin: 0;
  }
  .task-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .task-section-title::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .task-subtasks {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: 24px;
    background: rgba(255, 255, 255, 0.45);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .subtask {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .subtask:last-child { border-bottom: none; }
  .subtask-check {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .subtask-check svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .subtask.completed .subtask-check svg { color: var(--accent); }
  .subtask-text {
    font-size: 14px;
    color: var(--ink);
  }
  .subtask.completed .subtask-text {
    text-decoration: line-through;
    color: var(--ink-soft);
  }
  .task-description {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.7;
  }

  .context-placeholder {
    font-size: calc(var(--left-panel-w) * 0.036);
    color: var(--ink-soft);
    font-style: italic;
    opacity: 0.6;
    text-align: center;
    padding: calc(var(--left-panel-w) * 0.024) 0;
  }

  .context-empty {
    font-size: calc(var(--left-panel-w) * 0.036);
    color: var(--ink-soft);
    opacity: 0.5;
    text-align: center;
    padding: calc(var(--left-panel-w) * 0.012) 0;
  }

  /* ── center area ── */
  .center-area {
    flex: 1;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .location-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--paper-light);
    flex-shrink: 0;
    text-align: center;
  }

  .location-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }

  .location-meta {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
    font-style: italic;
  }

  /* ── narrative log ── */
  .narrative-log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .narrative-log::-webkit-scrollbar {
    width: 6px;
  }

  .narrative-log::-webkit-scrollbar-track {
    background: transparent;
  }

  .narrative-log::-webkit-scrollbar-thumb {
    background: rgba(61, 43, 31, 0.15);
    border-radius: 3px;
  }

  .log-entry {
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.75;
    max-width: 720px;
  }

  .log-entry.gm {
    background: rgba(61, 43, 31, 0.03);
    border-left: 3px solid var(--accent);
    align-self: flex-start;
  }

  .log-entry.player {
    background: rgba(139, 90, 43, 0.06);
    border-left: 3px solid var(--ink-soft);
    align-self: flex-end;
    text-align: right;
  }

  .log-entry.system {
    background: rgba(139, 90, 43, 0.04);
    border-left: 3px solid var(--danger);
    align-self: center;
    text-align: center;
    font-size: 13px;
    padding: 10px 16px;
  }

  .log-entry.check {
    background: rgba(139, 90, 43, 0.04);
    border: 1px dashed var(--border);
    align-self: center;
    text-align: center;
    font-size: 13px;
    padding: 10px 16px;
  }

  .log-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .log-text {
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .gm .log-label { color: var(--accent); }
  .player .log-label { color: var(--ink-soft); }
  .system .log-label { color: var(--danger); }
  .check .log-label { color: var(--ink-soft); }

  /* ── input area ── */
  .input-area {
    padding: 12px 24px 16px;
    border-top: 1px solid var(--border);
    background: var(--paper-light);
    flex-shrink: 0;
    display: flex;
    gap: 10px;
  }

  .input-area input {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    outline: none;
    transition: border-color 0.15s;
  }

  .input-area input::placeholder {
    color: var(--ink-soft);
    opacity: 0.5;
  }

  .input-area input:focus {
    border-color: var(--accent);
  }

  .input-area button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .input-area button:hover {
    background: var(--accent-glow);
  }

  /* ── right panel ── */
  .right-panel {
    width: var(--right-panel-w);
    min-width: 0;
    flex-shrink: 0;
    padding: calc(var(--right-panel-w) * 0.011) calc(var(--right-panel-w) * 0.010);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: calc(var(--right-panel-w) * 0.010);
    overflow-y: auto;
    transition: none;
  }

  .char-card {
    width: 100%;
    box-sizing: border-box;
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: calc(var(--right-panel-w) * 0.015);

  }

  /* ── 非致命打击开关（被动技能栏内的可点击 toggle，D&D 5e PHB p198）── */
  .skill-block.nonlethal-toggle {
    cursor: pointer; user-select: none;
    transition: background 0.2s, box-shadow 0.2s, border-color 0.2s, color 0.2s;
  }
  .skill-block.nonlethal-toggle:hover { background: rgba(255,255,255,0.7); box-shadow: 0 2px 6px var(--shadow); }
  .skill-block.nonlethal-toggle.active {
    border-color: #d4af37;
    background: linear-gradient(135deg, rgba(212,175,55,0.28), rgba(212,175,55,0.08));
    color: #8a6d10;
    box-shadow: 0 0 8px rgba(212,175,55,0.45), inset 0 0 4px rgba(212,175,55,0.15);
  }

  /* ── 昏迷标记 Zzz 浮动动画 ── */
  @keyframes zz-float {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-3px); }
  }

  /* ── 人物背景 ── */
  .bg-info-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(var(--right-panel-w) * 0.007) calc(var(--right-panel-w) * 0.006); border-radius: calc(var(--right-panel-w) * 0.008);
    font-size: calc(var(--right-panel-w) * 0.020); transition: background 0.2s;
  }
  .bg-info-row:hover { background: rgba(255,255,255,0.4); }
  .bg-info-label { color: var(--ink-soft); }
  .bg-info-value { color: var(--ink); font-weight: 600; text-align: right; }

  .bg-trait {
    background: rgba(255,255,255,0.5); border: 1px solid var(--border);
    border-radius: calc(var(--right-panel-w) * 0.010); padding: calc(var(--right-panel-w) * 0.011) calc(var(--right-panel-w) * 0.013);
    margin-bottom: calc(var(--right-panel-w) * 0.008);
  }
  .bg-trait-title {
    text-align: center; font-size: calc(var(--right-panel-w) * 0.020); font-weight: 700; color: var(--ink);
    margin-bottom: calc(var(--right-panel-w) * 0.006);
  }
  .bg-trait-text { font-size: calc(var(--right-panel-w) * 0.019); color: var(--ink-soft); line-height: 1.6; text-align: center; }

  .saving-throw-scores {
    display: flex; justify-content: center; gap: calc(var(--right-panel-w) * 0.008); margin: calc(var(--right-panel-w) * 0.006) 0 calc(var(--right-panel-w) * 0.010); flex-wrap: wrap;
  }

  /* ── quick checks ── */
  .quick-checks {
    display: flex;
    gap: calc(var(--right-panel-w) * 0.008);
  }

  .check-btn,
  .rest-btn {
    flex: 1;
    font-family: inherit;
    font-size: calc(var(--right-panel-w) * 0.020);
    font-weight: 600;
    padding: calc(var(--right-panel-w) * 0.010) calc(var(--right-panel-w) * 0.011);
    border: 1px solid var(--border);
    border-radius: calc(var(--right-panel-w) * 0.010);
    cursor: pointer;
    background: var(--paper-card);
    color: var(--ink);
    transition: all 0.15s;
  }

  .check-btn:hover,
  .rest-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(139, 90, 43, 0.06);
  }

  /* ── resize handles ── */
  .resize-handle {
    width: 6px;
    flex-shrink: 0;
    cursor: col-resize;
    background: transparent;
    transition: background 0.15s;
    position: relative;
    z-index: 10;
    user-select: none;
  }

  .resize-handle::after {
    content: "";
    position: absolute;
    inset: 0;
    background: transparent;
    transition: background 0.15s;
  }

  .resize-handle:hover::after,
  .resize-handle.active::after {
    background: var(--accent);
    opacity: 0.3;
  }

  /* ── modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 18, 10, 0.55);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }

  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .modal {
    background: var(--paper-card);
    border-radius: 16px;
    box-shadow: 0 12px 48px rgba(30, 18, 10, 0.35);
    max-width: 480px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
    padding: 32px 28px 24px;
    animation: modalIn 0.3s ease;
  }

  .modal.task-panel {
    max-width: 1100px;
    width: 95vw;
    max-height: 92vh;
    padding: 28px 24px 20px;
  }

  .modal.task-panel .modal-close {
    top: 16px; right: 20px;
    width: 36px; height: 36px;
    font-size: 24px;
    z-index: 10;
    background: var(--paper-card);
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(30, 18, 10, 0.12);
  }

  /* ── 交易弹窗 ── */
  #trade-modal-overlay { z-index: 1010; }
  .modal.trade-modal {
    max-width: 860px;
    width: 94vw;
    max-height: 88vh;
    padding: 28px 24px 20px;
  }
  .trade-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;

  }
  .trade-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;

  }
  .trade-title .modal-avatar { width: 40px; height: 40px; font-size: 17px; }
  .trade-role { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
  .trade-gold {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .trade-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .trade-col {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    background: var(--paper-light);
    max-height: 58vh;
    overflow-y: auto;
  }
  .trade-col-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 10px;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .trade-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .trade-item .item-icon { width: 26px; height: 26px; color: var(--accent); flex-shrink: 0; }
  .trade-item .item-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .trade-item-name { flex: 1; font-size: 14px; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trade-item-qty { font-size: 12px; color: var(--ink-soft); margin-right: 6px; }
  .trade-item-price { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-right: 8px; white-space: nowrap; }
  .trade-btn {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .trade-btn:hover { background: var(--accent-glow); }
  .trade-btn:disabled { opacity: 0.5; cursor: default; }
  .trade-btn.sell { background: none; color: var(--accent); }
  .trade-btn.sell:hover { background: rgba(139, 90, 43, 0.1); }
  .trade-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .trade-empty { font-size: 13px; color: var(--ink-soft); padding: 12px 0; text-align: center; }

  @keyframes modalIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-close {
    position: absolute;
    top: 12px; right: 16px;
    width: 32px; height: 32px;
    border: none; background: none;
    cursor: pointer;
    color: var(--ink-soft);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: color 0.15s, background 0.15s;
  }

  .modal-close:hover {
    color: var(--ink);
    background: var(--slot);
  }

  .modal-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .modal-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(139, 90, 43, 0.15);
    color: var(--accent);
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .modal-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }

  .modal-meta {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .modal-desc {
    font-size: 14px;
    line-height: 1.75;
    color: var(--ink);
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .modal-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
  }

  /* NPC 详情弹窗状态徽章样式 */
  .npc-status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 6px;
  }
  .npc-status-dead { background: rgba(220, 53, 69, 0.18); color: #dc3545; border: 1px solid rgba(220, 53, 69, 0.4); }
  .npc-status-unconscious { background: rgba(255, 193, 7, 0.18); color: #d99e00; border: 1px solid rgba(255, 193, 7, 0.4); }
  .npc-status-stunned { background: rgba(108, 117, 125, 0.18); color: #6c757d; border: 1px solid rgba(108, 117, 125, 0.4); }
  .npc-status-left { background: rgba(108, 117, 125, 0.12); color: #6c757d; border: 1px dashed rgba(108, 117, 125, 0.3); }

  .inv-box-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .inv-box-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .inv-box-item .item-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    color: var(--accent);
    opacity: 0.85;
  }

  .inv-box-item .item-icon svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .inv-box-name {
    flex: 1;
    font-size: 14px;
    color: var(--ink);
  }

  .inv-box-qty {
    color: var(--ink-soft);
    font-size: 13px;
    margin-left: 6px;
  }

  .take-btn {
    flex-shrink: 0;
    padding: 5px 14px;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }

  .take-btn:hover { opacity: 0.9; }
  .take-btn:disabled { opacity: 0.5; cursor: default; }

  .inv-supplies-title {
    margin-top: 16px;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
  }

  .modal-info-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
  }

  .modal-info-label {
    color: var(--ink-soft);
  }

  .modal-info-value {
    color: var(--ink);
    font-weight: 500;
  }

  .modal-info-list {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .modal-info-tag {
    font-size: 11px;
    padding: 3px 8px;
    background: var(--slot);
    border-radius: 6px;
    color: var(--ink-soft);
  }

  @media (max-width: 900px) {
    .left-panel { width: 180px !important; padding: 12px 8px; }
    .right-panel { width: 180px !important; padding: 12px 8px; }
    .narrative-log { padding: 12px 16px; }
    .input-area { padding: 10px 16px 12px; }
    .log-entry { max-width: 100%; }
  }

  @media (max-width: 680px) {
    .adventure-body { flex-direction: column; overflow-y: auto; }
    .left-panel { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .right-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    .center-area { order: -1; }
  }



  /* ── 战斗地图区域（替代原叙事日志/输入框） ── */
  .combat-map-wrapper {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
  }

  #combat-map-container {
    /* 宽高由 JS 计算 */
  }

  /* 中央区域作为 initiative-bar 拖拽锚点 */
  .center-area { position: relative; }

  /* 中央旧区域隐藏（叙事日志 / 输入框 / 地点标题） */
  .narrative-log, .input-area, .location-header { display: none; }

  /* 左栏隐藏：当前场景、可去地点 */
  #context-location-section, #context-exits-section { display: none; }

  /* 右栏隐藏：侦察/调查/短休/长休快捷按钮 */
  .quick-checks { display: none; }

  /* ── 状态栏 ── */
  .status-bar {
    flex-shrink: 0;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto 12px;
    padding: 10px 18px;
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
    overflow: hidden;
  }

  /* 状态栏文字不换行：避免「结束回合」按钮被挤到下一行 */
  .status-bar > #combat-status {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1 1 auto;
    min-width: 0;
  }

  .end-turn-btn {
    flex: 0 0 auto;
    white-space: nowrap !important;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--player);
  }

  .legend {
    margin-left: auto;
    display: flex;
    gap: 16px;
    font-size: 12px;
  }

  .legend-item { display: flex; align-items: center; gap: 6px; }

  .legend-color {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid;
  }

  /* ── 动作经济资源条（动作● 附赠● 移动x米） ── */
  .resource-bar {
    display: none;

  }
  .resource-bar.enemy-turn { opacity: 0.45; }
  .res-chip {
    display: inline-flex;

  }
  .res-chip.used { opacity: 0.35; filter: grayscale(1); }

  /* 动作按钮：类型角标 + 预算耗尽置灰 */
  .cost-tag {
    display: inline-block;
    margin-left: 4px;
    padding: 0 4px;

    vertical-align: 1px;
    background: rgba(120, 120, 120, 0.15);

  }
  .cost-tag.bonus { background: rgba(184, 115, 51, 0.2); }
  .combat-action.disabled { opacity: 0.35; pointer-events: none; }
  /* 被动技能：不可点击、不消耗动作预算，与可操作动作视觉区分 */
  .passive-skill { opacity: 0.7; cursor: default; }
  .passive-skill:hover { background: rgba(120,120,120,0.08); }

  /* ── 先攻顺序头像条（可拖动悬浮，默认地图上方中央） ── */
  .initiative-bar {
    position: absolute;
    top: 56px;            /* 默认停在地图上方中央（避开 location-header）*/
    left: 50%;
    transform: translateX(-50%);  /* 拖动时由 JS 改 left/top 并清除此 transform */
    z-index: 30;
    display: flex;
    gap: 6px;
    padding: 6px 10px 6px 22px;  /* 左侧留 22px 给拖动手柄 */
    border-radius: 10px;
    background: rgba(20, 20, 30, 0.6);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    align-items: center;
    max-width: calc(100% - 24px);
    overflow-x: auto;
    scrollbar-width: thin;
    cursor: default;
    user-select: none;
  }
  .initiative-bar:empty { display: none; }
  /* 拖动手柄：左侧竖纹 */
  .initiative-bar::before {
    content: '⋮⋮';

    left: 4px;
    top: 50%;
    transform: translateY(-50%);

    font-size: 12px;
    line-height: 1;
    cursor: grab;
    letter-spacing: -2px;
  }
  .initiative-bar.dragging { cursor: grabbing; opacity: 0.92; }
  .initiative-bar.dragging::before { cursor: grabbing; }
  .init-portrait {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 2px 4px;
    border-radius: 6px;
    border: 1px solid transparent;
    transition: all 0.2s;
    min-width: 36px;
  }
  .init-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    line-height: 1;
  }
  .init-name {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.85);

    overflow: hidden;

  .init-roll {

    box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8);

  .init-portrait.next {
    opacity: 0.7;
    border-color: rgba(255, 255, 255, 0.25);
  }

  .init-portrait.dead {
    opacity: 0.3;
    filter: grayscale(1);
  }
  .init-portrait.dead .init-circle {
    text-decoration: line-through;
  }

<div class="top-bar">

  async function loadAllData() {
    const results = {};
    const keys = Object.keys(DATA_URLS);

    const responses = await Promise.all(
      keys.map(k => fetch(DATA_URLS[k]).then(r => r.json()))
    );

    keys.forEach((k, i) => { results[k] = responses[i]; });

    // 合并 NPC 数据：先合并 _templates（global + chapter），再对每个实例做模板展开
    const allTemplates = {
      ...(results.globalNpcs._templates || {}),
      ...(results.chapterNpcs._templates || {})
    };
    const rawNpcs = {
      ...results.globalNpcs.npcs,
      ...results.chapterNpcs.npcs
    };
    const allNpcs = {};
    for (const [npcId, npc] of Object.entries(rawNpcs)) {
      if (npc.template && allTemplates[npc.template]) {
        allNpcs[npcId] = { id: npcId, ...allTemplates[npc.template], ...npc };

        allNpcs[npcId] = { id: npcId, ...npc };

      locations: results.locations.locations,
      npcs: allNpcs,
      items: allItems,
      quests: results.quests.quests,
      encounters: results.encounters.encounters

  /* ── 悬浮提示（物品 + 技能法术，0.5s 延迟） ── */
  (function initTooltip() {
    const tooltip = document.createElement('div');
    tooltip.className = 'item-tooltip';
    document.body.appendChild(tooltip);

    let hoverTimer = null;
    let hoverTarget = null;  // 当前悬停目标（物品卡/装备槽/技能块），用于内部移动去重

    function showTooltip(e, card) {
      const name = card.dataset.name || card.querySelector('.item-name')?.textContent || '';
      const description = card.dataset.description || '';
      const props = card.dataset.props || '';
      const equipped = card.querySelector('.item-equipped');
      const eqText = equipped ? '（已装备）' : '';
      tooltip.innerHTML = `
        <div class="item-tooltip-name">${name} ${eqText}</div>
        ${props ? `<div class="item-tooltip-save">${props}</div>` : ''}
        <div class="item-tooltip-desc">${description || '详细属性待补充'}</div>
      `;
      tooltip.classList.add('show');  // 先显示才能测量真实尺寸，避免越界修正失效
      positionTooltip(e, tooltip);
    }

    function positionTooltip(e, el) {
      const rect = el.getBoundingClientRect();
      let x = e.clientX + 14;
      let y = e.clientY - 10;
      if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - 14;
      if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 10;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }

    function hideTooltip() {
      tooltip.classList.remove('show');
      tooltip._nlBound = null;  // 隐藏时清除绑定标记
    }

    function showSkillTooltip(block) {
      // 非致命打击 toggle：自定义 tooltip（规则说明 + 当前状态）
      if (block.classList.contains('nonlethal-toggle')) {
        const api = window.__combatApi;
        const on = (typeof api?.getNonlethal === 'function') ? api.getNonlethal() : false;
        tooltip.innerHTML = `
          <div class="item-tooltip-name">非致命打击</div>
          <div class="item-tooltip-save">被动 · 不消耗动作</div>
          <div class="item-tooltip-desc">开启后近战攻击将敌人 HP 归零时强制留 1 滴血，敌人陷入昏迷（不致死），可战后处置。远程攻击和法术不受开关影响，强制致命。</div>
          <div class="item-tooltip-breakdown">当前状态：${on ? '已开启（近战留活口）' : '已关闭（近战致命）'}</div>
          <div class="item-tooltip-breakdown" style="opacity:.7">点击切换开关</div>
        `;
        tooltip._nlBound = block;  // 标记 tooltip 当前绑定到非致命按钮，供 toggleNonlethal 刷新内容
        tooltip.classList.add('show');
        const r = block.getBoundingClientRect();
        tooltip.style.left = Math.max(8, r.left) + 'px';
        tooltip.style.top = (r.bottom + 8) + 'px';
        const tr = tooltip.getBoundingClientRect();
        if (tr.right > window.innerWidth) tooltip.style.left = (window.innerWidth - tr.width - 8) + 'px';
        if (tr.bottom > window.innerHeight) tooltip.style.top = (r.top - tr.height - 8) + 'px';
        return;
      }
      tooltip._nlBound = null;  // 非 非致命按钮时清除标记
      const spellId = block.dataset.spellId;
      const lookup = window.spellLookup || {};
      const spell = spellId ? lookup[spellId] : null;
      const name = block.textContent.trim();
      if (spell) {
        let html = `<div class="item-tooltip-name">${spell.name}</div>`;
        if (spell.school || spell.action_cost)
          html += `<div class="item-tooltip-save">${[window.SCHOOL_LABEL?.[spell.school] || spell.school, window.ACTION_COST_LABEL?.[spell.action_cost] || spell.action_cost].filter(Boolean).join(' · ')}</div>`;
        if (spell.description)
          html += `<div class="item-tooltip-desc">${spell.description}</div>`;
        if (spell.range)
          html += `<div class="item-tooltip-breakdown">射程：${window.rangeLabel?.(spell.range) || '—'}</div>`;
        tooltip.innerHTML = html;
      } else {
        tooltip.innerHTML = `<div class="item-tooltip-name">${name}</div><div class="item-tooltip-desc">详细描述待补充</div>`;
      }
      tooltip.classList.add('show');  // 先显示才能测量真实尺寸，避免越界修正失效
      const r = block.getBoundingClientRect();
      tooltip.style.left = Math.max(8, r.left) + 'px';
      tooltip.style.top = (r.bottom + 8) + 'px';
      const tr = tooltip.getBoundingClientRect();
      if (tr.right > window.innerWidth) tooltip.style.left = (window.innerWidth - tr.width - 8) + 'px';
      if (tr.bottom > window.innerHeight) tooltip.style.top = (r.top - tr.height - 8) + 'px';
    }

    /* 物品/装备槽/技能法术统一悬浮提示（mouseover/mouseout 委托，避免 timer 泄漏） */
    document.addEventListener('mouseover', function(e) {
      if (!e.target || typeof e.target.closest !== 'function') return;
      const card = e.target.closest('.item-card, .slot.filled, .inv-box-item, .trade-item');
      const block = e.target.closest('.skill-block');
      const el = card || block;
      if (!el) return;
      if (hoverTarget === el) return;  // 在元素内部移动，不重复计时
      hoverTarget = el;
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(() => {
        if (el.classList.contains('skill-block')) showSkillTooltip(el);
        else showTooltip(e, el);
      }, 500);
    });

    document.addEventListener('mouseout', function(e) {
      if (!e.target || typeof e.target.closest !== 'function') return;
      const card = e.target.closest('.item-card, .slot.filled, .inv-box-item, .trade-item');
      const block = e.target.closest('.skill-block');
      const el = card || block;
      if (!el) return;
      // 仍停留在同一元素内（进入其子元素）则忽略
      const to = e.relatedTarget;
      if (to && typeof to.closest === 'function' && to.closest('.item-card, .slot.filled, .inv-box-item, .trade-item, .skill-block') === el) return;
      clearTimeout(hoverTimer);
      hoverTimer = null;
      hoverTarget = null;
      hideTooltip();
    });

    document.addEventListener('scroll', function() {
      clearTimeout(hoverTimer);
      hoverTimer = null;
      hideTooltip();
    });
  })();

  /* 物品右键菜单（抄自 lobby.html，equip/discard 落地到角色数据） */
  (function initItemContextMenu() {
    const contextMenu = document.createElement('div');

    function showContextMenu(e, card) {

      const equipped = !!card.querySelector('.item-equipped');
      const equipmentId = card.dataset.equipmentId;
      const catalogItem = catalogs.equipment ? catalogs.equipment[equipmentId] : null;
      const isEquippable = catalogItem && (catalogItem.type === 'weapon' || catalogItem.type === 'armor');
      const name = card.dataset.name || '';
      const isSupplyItem = card.dataset.kind === 'item';
      const itemId = card.dataset.itemId;
      const supplyItem = isSupplyItem && itemId ? state.data.items[itemId] : null;

      let html = '';
      if (isSupplyItem) {
        // 道具：有效果（如治疗药水）提供"使用"；有装备定义（如火把/矿灯）提供"装备"；均提供丢弃/赠送
        const equipDef = supplyItem && supplyItem.equipment_id
          ? (catalogs.equipment ? catalogs.equipment[supplyItem.equipment_id] : null) : null;
        if (supplyItem && supplyItem.effect) {
          html += `<button class="menu-action" data-action="use">使用</button>`;
        }
        if (equipDef) {
          html += `<button class="menu-action" data-action="equip">装备</button>`;
        }
        html += `<button class="menu-action" data-action="sell">出售</button>`;
        html += `<button class="menu-action" data-action="discard">丢弃</button>`;
        html += `<button class="menu-action" data-action="gift">赠送</button>`;
      } else {
        if (isEquippable) {
          html += `<button class="menu-action" data-action="equip">${equipped ? '卸下' : '装备'}</button>`;
        }
        html += `<button class="menu-action" data-action="discard">丢弃</button>`;
        html += `<button class="menu-action" data-action="gift">赠送</button>`;
      }
      contextMenu.innerHTML = html;

      let x = e.clientX;
      let y = e.clientY;
      const rect = contextMenu.getBoundingClientRect();
      if (x + 150 > window.innerWidth) x = window.innerWidth - 150;
      if (y + rect.height > window.innerHeight) y = e.clientY - rect.height;
      contextMenu.style.left = x + 'px';
      contextMenu.style.top = y + 'px';
      contextMenu.classList.add('visible');

      contextMenu.querySelectorAll('.menu-action').forEach(btn => {
        btn.addEventListener('click', async () => {
          const action = btn.dataset.action;
          contextMenu.classList.remove('visible');
          if (isSupplyItem) {
            await handleSupplyItemAction(action, itemId, name);
          } else {
            const idx = parseInt(card.dataset.idx ?? '-1', 10);
            await handleItemAction(action, idx, name);
          }
        });
      });
    }

    document.addEventListener('contextmenu', function(e) {
      if (!e.target || typeof e.target.closest !== 'function') return;
      const card = e.target.closest('.item-card');
      if (!card) return;
      showContextMenu(e, card);
    });

    document.addEventListener('click', function(e) {
      if (!e.target || typeof e.target.closest !== 'function' || !e.target.closest('.item-context-menu')) {
        hideContextMenu();
      }
    });

    document.addEventListener('scroll', function() {
      hideContextMenu();
    });
  })();

  async function handleItemAction(action, idx, itemName) {
    const char = state.character;
    if (!char) return;
    const list = char.inventory?.items || [];
    const item = list[idx];
    if (!item) return;
    const equipmentId = item.equipment_id;
    const catalogItem = catalogs.equipment ? catalogs.equipment[equipmentId] : null;

    if (action === 'equip' && catalogItem && (catalogItem.type === 'weapon' || catalogItem.type === 'armor')) {
      if (item.equipped) {
        item.equipped = false;
      } else {
        // 护甲同类互斥：同 category 的护甲互斥，盾牌只与其他盾牌互斥
        // 双手武器占满两格：装备时自动卸下同类型的其他已装备武器
        const cat = catalogItem.stats ? catalogItem.stats.category : null;
        const twoHanded = catalogItem.type === 'weapon' && !!catalogItem.stats?.two_handed;
        const allEquip = char.inventory?.items || [];
        allEquip.forEach(i => {
          if (i === item || !i.equipped) return;
          const ci = catalogs.equipment ? catalogs.equipment[i.equipment_id] : null;
          if (!ci || !ci.stats) return;
          if (catalogItem.type === 'armor') {
            if (ci.type === 'armor' && ci.stats.category === cat && ci.stats.category !== 'shield') i.equipped = false;
            if (ci.type === 'armor' && ci.stats.category === 'shield' && cat === 'shield') i.equipped = false;
          } else if (ci.type === 'weapon' && ci.stats.category === cat) {
            // 装备双手武器：卸下同类型所有武器（占满两格）；
            // 装备单手武器：卸下同类型中的双手武器（单手之间仍可双持）
            if (twoHanded || ci.stats.two_handed) i.equipped = false;
          }
        });
        item.equipped = true;
      }
    } else if (action === 'discard') {
      const removed = list.splice(idx, 1);
      if (removed.length > 0) await dropItemToLocation(equipmentId, itemName);
    } else if (action === 'gift') {
      appendLog('system', '赠送功能开发中。');
      return;
    }

    recalcCharacterStats(char);
    syncCombatVision(); // 装/卸火把等光源：立即刷新迷雾照明
    renderAllTabs();
    await renderRightPanel();
    await saveCharacter();
  }

  /* 物品定义查找：先查冒险物品，再查全局装备目录（丢弃物可能是装备） */
  function findItemDef(id) {
    if (state.data.items && state.data.items[id]) return state.data.items[id];
    return (catalogs.equipment && catalogs.equipment[id]) || null;
  }

  /* 丢弃物品到当前地点：落后端世界状态 + 前端本地记录（左侧物品列表显示） */
  async function dropItemToLocation(itemId, itemName) {
    try {
      const res = await fetch('/api/game/drop_item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: state.sessionId,
          adventure_id: ADVENTURE_ID,
          chapter_id: CHAPTER_ID,
          item_id: itemId,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '丢弃失败');
      if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
    } catch (err) {
      appendLog('system', `丢弃失败: ${err.message}`);
      return false;
    }
    // 本地记录：出现在当前地点左侧物品列表（其他角色/同页面可拾取）
    const loc = getCurrentLocation();
    if (loc) {
      state.droppedItems = state.droppedItems || {};
      const list = state.droppedItems[loc.id] || (state.droppedItems[loc.id] = []);
      if (!list.includes(itemId)) list.push(itemId);
    }
    renderContextPanel();
    appendLog('system', `已丢弃 ${itemName}`);
    return true;
  }

  /* 道具操作（治疗药水等）：使用回血（后端解析效果，播报实际恢复量），丢弃 */
  async function handleSupplyItemAction(action, itemId, itemName) {
    const char = state.character;
    if (!char) return;
    const item = state.data.items[itemId];

    if (action === 'sell') {
      // 出售：需要当前有打开的交易弹窗（确定卖给哪个商人）
      if (!currentTradeNpcId) {
        appendLog('system', '附近没有商人，无法出售。请先打开与商人的交易窗口。');
        return;
      }
      await callSellItem(currentTradeNpcId, itemId);
      if (tradeModalOverlay.classList.contains('active')) await renderTradeModal();
    } else if (action === 'use') {
      if (!item || !item.use?.effect) {
        appendLog('system', '该道具无法使用。');
        return;
      }
      const curHp = char.combat?.hp?.cur ?? 0;
      const maxHp = char.combat?.hp?.max ?? curHp;
      // 通知后端解析效果并消耗道具（heal 由后端掷骰并按 HP 截断，返回实际恢复值与文案）
      try {
        const res = await fetch('/api/game/use_item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: state.sessionId,
            adventure_id: ADVENTURE_ID,
            chapter_id: CHAPTER_ID,
            item_id: itemId,
            character: state.character,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '使用失败');
        if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
        // HP 后端权威结算，从 updates 同步到角色卡
        applyGameUpdates(data.updates);
        // 播报后端生成的效果文案
        const actorName = (state.character && state.character.name) || '你';
        appendLog('gm', `${actorName} 使用了 ${item.name}${data.message ? `，${data.message}` : ''}。`);
        await renderAllTabs();
        await renderRightPanel();
        await saveCharacter();
      } catch (err) {
        appendLog('system', `使用失败: ${err.message}`);
        return;
      }
    } else if (action === 'equip') {
      if (!item || !item.equipment_id) return;
      // 通知后端同步移除背包道具（防止被 SSE 覆盖回去）
      try {
        const res = await fetch('/api/game/equip_item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: state.sessionId,
            adventure_id: ADVENTURE_ID,
            chapter_id: CHAPTER_ID,
            item_id: itemId,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '装备失败');
        if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
      } catch (err) {
        appendLog('system', `装备失败: ${err.message}`);
        return;
      }
      // 转移进角色装备栏（占近战槽，由 computeEquippedSlots 自动分配）
      char.inventory = char.inventory || { gold: 0, items: [] };
      char.inventory.items.push({ equipment_id: item.equipment_id, quantity: 1, equipped: true });
      const actorName = (state.character && state.character.name) || '你';
      appendLog('gm', `${actorName} 装备了 ${item.name}。`);
      recalcCharacterStats(char);
      syncCombatVision(); // 装/卸火把等光源：立即刷新迷雾照明
      await renderAllTabs();
      await renderRightPanel();
      await saveCharacter();
    } else if (action === 'discard') {
      const idx = state.playerInventory.indexOf(itemId);
      if (idx < 0) return;
      state.playerInventory.splice(idx, 1);
      await dropItemToLocation(itemId, itemName);
      await renderAllTabs();
    } else if (action === 'gift') {
      appendLog('system', '赠送功能开发中。');
    }
  }

  /* ═══ 技能&法术（抄自 lobby renderSpells） ═══ */
  function renderSpellsTab(char) {
    const vm = buildSpellViewModel(char, catalogs, { state });

    // 判断某法术/动作的交互类型：
    //  - 'self'  → 自身目标（跳跃/冲刺/回气等），点击直接使用
    //  - 'target' → 需要在地图上选目标（普攻/远程法术/触碰治疗）
    const kindOf = (spellId) => {
      const s = vm.lookup[spellId];
      if (!s) return 'self';
      return s.range?.kind === 'self' ? 'self' : 'target';
    };

    // 动作类型角标：读 spells.json action_cost（附赠动作=bonus / 1动作=action / 自由动作=free）
    const costOf = (spellId) => vm.lookup[spellId]?.action_cost || 'action';
    const costTag = (cost) =>
      cost === 'bonus' ? '<small class="cost-tag bonus">附赠</small>'
      : cost === 'free' ? '<small class="cost-tag">自由</small>'
      : '<small class="cost-tag">动作</small>';

    // 战斗页是「操作台」：胶囊额外携带 data-action-kind / data-cost 供 combat 逻辑识别
    const actionBlock = (item) => {
      const k = kindOf(item.id);
      const cost = costOf(item.id);
      return `<div class="skill-block combat-action" data-action-kind="${k}" data-cost="${cost}" data-spell-id="${escapeHtml(item.id)}">${escapeHtml(item.name)}${costTag(cost)}</div>`;
    };
    const spellBlock = (item) => {
      const k = kindOf(item.id);
      const cost = costOf(item.id);
      return `<div class="skill-block spell-block combat-action" data-action-kind="${k}" data-cost="${cost}" data-action-type="spell" data-spell-id="${escapeHtml(item.id)}">${escapeHtml(item.name)}${costTag(cost)}</div>`;
    };

    // ── 普攻按钮（近战 / 远程，基于角色卡 combat.attacks.current）──
    const melee = primaryAttack(char, 'melee');
    const ranged = primaryAttack(char, 'ranged');
    const meleeButton = `<div class="skill-block combat-action" data-action-kind="target" data-cost="action" data-action-type="attack" data-attack-kind="melee">${escapeHtml(melee.name || '近战')}攻击 <small style="opacity:.7">(${escapeHtml(bonusText(melee.bonus))} / ${escapeHtml(melee.damage || '—')})</small>${costTag('action')}</div>`;
    const rangedButton = ranged.name ? `<div class="skill-block combat-action" data-action-kind="target" data-cost="action" data-action-type="attack" data-attack-kind="ranged">${escapeHtml(ranged.name)}攻击 <small style="opacity:.7">(${escapeHtml(bonusText(ranged.bonus))} / ${escapeHtml(ranged.damage || '—')})</small>${costTag('action')}</div>` : '';
    const attackButtons = `
      <div class="divider"><span>攻击</span></div>
      <div class="skill-grid">
        ${meleeButton}
        ${rangedButton}
      </div>`;

    // 非致命打击开关（session 内存，调用 main.js 的 __combatApi.setNonlethal）
    // 放在被动技能栏首位：本身不消耗动作预算（D&D 5e PHB p198：非致命是攻击的一部分）
    // 复用 .skill-block 悬浮提示系统：hover 显示规则说明 + 当前状态
    const nonlethalOn = (typeof window.__combatApi?.getNonlethal === 'function')
      ? window.__combatApi.getNonlethal() : false;
    const nonlethalBlock = `<div class="skill-block nonlethal-toggle ${nonlethalOn ? 'active' : ''}" id="nonlethal-toggle" onclick="toggleNonlethal()" data-nl="1">非致命打击</div>`;
    const passiveBlock = (item) => `<div class="skill-block passive-skill">${escapeHtml(item.name)}</div>`;

    return `
      ${attackButtons}
      ${spellSection('常规动作', vm.normalItems, actionBlock)}
      ${spellSection('职业动作', vm.classItems, actionBlock)}
      ${vm.passiveItems.length || nonlethalBlock ? `<div class="divider"><span>被动技能</span></div><div class="skill-grid">${nonlethalBlock}${vm.passiveItems.map(passiveBlock).join('')}</div>` : ''}
      ${spellSection('戏法 · 无限施放', vm.cantrips, spellBlock)}
      ${spellSection(`1 环法术 · 法术位 ${vm.slotText1}`, vm.spellsL1, spellBlock)}
    `;
  }

  /* 物品详情附加内容：容器显示内含物品，普通无主物品显示拿取按钮 */
  async function buildItemModalExtra(itemId, item) {
    const parts = [];
    const loc = getCurrentLocation();

    // 判断是否为容器：显式声明 contains 字段（即使是空数组）即视为容器
    if (Array.isArray(item.contains)) {
      const contains = item.contains;
      if (contains.length === 0) {
        // 空容器：不显示"内含物品"标题，不显示"拿取"按钮（如空地图匣）
        return '';
      }
      // 容器：按 contains 聚合剩余数量（减去已取走的）
      const taken = (loc && state.containerTaken[loc.id]?.[itemId]) || [];
      const counts = {};
      for (const cid of contains) {
        const remaining = contains.filter(x => x === cid).length - taken.filter(x => x === cid).length;
        if (remaining > 0) counts[cid] = remaining;
      }
      let rows = '';
      if (Object.keys(counts).length > 0) {
        const items = await Promise.all(Object.entries(counts).map(async ([cid, n]) => {
          const sub = state.data.items[cid];
          if (!sub) return '';
          const iconSvg = await loadSvgIcon(sub.icon || 'pouch');
          const props = itemEffectText(sub, catalogs.equipment || {});
          return `
            <div class="inv-box-item" data-name="${escapeHtml(sub.name)}" data-description="${escapeHtml(sub.description || '')}" data-props="${escapeHtml(props)}">
              <div class="item-icon">${iconSvg}</div>
              <div class="inv-box-name">${escapeHtml(sub.name)} <span class="inv-box-qty">×${n}</span></div>
              <button type="button" class="take-btn" data-container="${itemId}" data-item="${cid}">拿取</button>
            </div>`;
        }));
        rows = items.join('');
      }
      parts.push(`<div class="modal-section-title">内含物品</div><div class="inv-box-list">${rows || '<div class="context-empty">箱子已空</div>'}</div>`);
    } else {
      // 普通物品：当前地点可见（含本会话丢弃物）且无主 → 可拿取
      const locItemIds = (loc ? (loc.items || []) : []).map(e => (typeof e === 'object' ? e.id : e));
      const isDroppedHere = !!(loc && (state.droppedItems || {})[loc.id] && (state.droppedItems)[loc.id].includes(itemId));
      if ((locItemIds.includes(itemId) || isDroppedHere) && !item.owner) {
        parts.push(`<div class="inv-box-list"><div class="inv-box-item"><button type="button" class="take-btn" data-item="${itemId}">拿取</button></div></div>`);
      }
    }

    return parts.join('');
  }

  /* 拿取物品（专用端点，不经 AI 解析） */
  async function callTakeItem(containerId, itemId) {
    try {
      const res = await fetch('/api/game/take_item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: state.sessionId,
          adventure_id: ADVENTURE_ID,
          chapter_id: CHAPTER_ID,
          container_id: containerId || undefined,
          item_id: itemId,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '拿取失败');
      if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
      if (data.updates.container_taken) state.containerTaken = data.updates.container_taken;
      const item = state.data.items[itemId];
      const actorName = (state.character && state.character.name) || '你';
      appendLog('gm', `${actorName} 拿取了 ${item ? item.name : itemId}${containerId ? '。' : '，收进背包。'}`);
      if (data.is_equipment && item && item.equipment_id && state.character) {
        // 装备类：直接写入角色卡装备栏（内存，测试阶段不持久化，刷新即回退）
        state.character.inventory = state.character.inventory || { gold: 0, items: [] };
        state.character.inventory.items.push({ equipment_id: item.equipment_id, quantity: 1, equipped: false });
      }
      if (!containerId) {
        // 普通物品：从当前地点本地移除并记录（切场景回来不重复显示）
        state.takenLocationItems.push(itemId);
        const loc = getCurrentLocation();
        if (loc) {
          if (Array.isArray(loc.items)) {
            loc.items = loc.items.filter(e => (typeof e === 'object' ? e.id : e) !== itemId);
          }
          // 若是本会话丢弃的物品，拾取后从左侧丢弃列表移除
          const dropped = (state.droppedItems || {})[loc.id];
          if (dropped) {
            const di = dropped.indexOf(itemId);
            if (di >= 0) dropped.splice(di, 1);
          }
        }
      }
      // 拿取成功：关闭详情弹窗并刷新左侧与背包（不再重开弹窗，避免再次弹出）
      closeDetailModal();
      renderContextPanel();
      await renderAllTabs();
    } catch (err) {
      appendLog('system', `拿取失败: ${err.message}`);
    }
  }

  /* ── 交易系统 ── */
  let currentTradeNpcId = null;

  /* 商人是否已敌对（偷窃败露/失败后涨价） */
  function isHostileTo(npcId) {
    return (state.hostileNpcs || []).includes(npcId);
  }

  /* 商人收购价：库存内物品按售价半价，否则按物品自身 price 半价（与后端一致）；敌对后买价 ×1.5、卖价更低 */
  function merchantOffer(npc, itemId) {
    const entry = (npc.merchant.inventory || []).find(e => e.item_id === itemId);
    const item = findItemDef(itemId);
    let price = entry ? entry.price : (item && item.price);
    if (price == null) return null;
    if (isHostileTo(currentTradeNpcId)) price = Math.ceil(price * 1.5);
    return Math.max(1, Math.round(price / 2));
  }

  async function renderTradeModal() {
    const npc = state.data.npcs[currentTradeNpcId];
    if (!npc || !npc.merchant) return;
    const tradeContent = $('#trade-modal-content');
    const merchantGold = (state.merchantStates[currentTradeNpcId] && state.merchantStates[currentTradeNpcId].gold != null)
      ? state.merchantStates[currentTradeNpcId].gold : (npc.merchant.gold || 0);
    const char = state.character || {};
    const playerGold = (char.inventory && char.inventory.gold) || 0;

    // 商人货架
    const soldMap = (state.merchantStates[currentTradeNpcId] && state.merchantStates[currentTradeNpcId].sold) || {};
    const stolenMap = (state.merchantTheft[currentTradeNpcId]) || {};
    const hostile = isHostileTo(currentTradeNpcId);
    const shopRows = await Promise.all((npc.merchant.inventory || []).map(async entry => {
      const sub = findItemDef(entry.item_id);
      if (!sub) return '';
      const iconSvg = await loadSvgIcon(sub.icon || 'pouch');
      const props = itemEffectText(sub, catalogs.equipment || {});
      const stockLeft = entry.stock == null ? null : Math.max(0, entry.stock - (soldMap[entry.item_id] || 0) - (stolenMap[entry.item_id] || 0));
      if (stockLeft === 0) return ''; // 售罄的商品直接从货架移除
      const stockText = stockLeft != null ? `<span class="trade-item-qty">剩余${stockLeft}</span>` : '';
      const displayPrice = hostile ? Math.ceil(entry.price * 1.5) : entry.price;
      return `
        <div class="trade-item" data-name="${escapeHtml(sub.name)}" data-description="${escapeHtml(sub.description || '')}" data-props="${escapeHtml(props)}">
          <div class="item-icon">${iconSvg}</div>
          <div class="trade-item-name">${escapeHtml(sub.name)} ${stockText}</div>
          <div class="trade-item-price">${displayPrice} G${hostile ? '<span class="trade-item-qty" title="敌对商人涨价">▲</span>' : ''}</div>
          <button type="button" class="trade-btn" data-buy="${escapeHtml(entry.item_id)}">购买</button>
        </div>`;
    }));
    const shopHtml = shopRows.join('') || '<div class="trade-empty">货架空空如也</div>';

    // 你的背包：可出售道具（按 id 聚合数量），装备类物品暂不可出售
    const invItems = state.playerInventory || [];
    const counts = {};
    invItems.forEach(iid => counts[iid] = (counts[iid] || 0) + 1);
    const bagRows = await Promise.all(Object.entries(counts).map(async ([iid, n]) => {
      const sub = findItemDef(iid);
      if (!sub) return '';
      const offer = merchantOffer(npc, iid);
      if (offer == null) return '';
      const iconSvg = await loadSvgIcon(sub.icon || 'pouch');
      const props = itemEffectText(sub, catalogs.equipment || {});
      return `
        <div class="trade-item" data-sell="${escapeHtml(iid)}" data-name="${escapeHtml(sub.name)}" data-description="${escapeHtml(sub.description || '')}" data-props="${escapeHtml(props)}">
          <div class="item-icon">${iconSvg}</div>
          <div class="trade-item-name">${escapeHtml(sub.name)} <span class="trade-item-qty">×${n}</span></div>
          <div class="trade-item-price">${offer} G</div>
          <button type="button" class="trade-btn sell" data-sell="${escapeHtml(iid)}">出售</button>
        </div>`;
    }));
    const bagHtml = bagRows.join('') || '<div class="trade-empty">背包里没有可出售的道具</div>';

    tradeContent.innerHTML = `
      <div class="trade-header">
        <div class="trade-title"><span class="modal-avatar">${escapeHtml(npc.name[0] || '?')}</span>
          交易 · ${escapeHtml(npc.name)}<span class="trade-role">（${escapeHtml(npc.role || '')}）</span>
        </div>
        <div class="trade-gold">商人金币 ${merchantGold} G</div>
      </div>
      <div class="trade-cols">
        <div class="trade-col">
          <div class="trade-col-title">商人货架</div>
          ${shopHtml}
        </div>
        <div class="trade-col">
          <div class="trade-col-title">你的背包 <span class="trade-item-qty">${playerGold} G</span></div>
          ${bagHtml}
        </div>
      </div>`;

    tradeContent.querySelectorAll('[data-buy]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        await callBuyItem(currentTradeNpcId, btn.dataset.buy);
        await renderTradeModal();
      });
    });
    tradeContent.querySelectorAll('[data-sell]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        await callSellItem(currentTradeNpcId, btn.dataset.sell);
        await renderTradeModal();
      });
    });
    // 背包行右键：弹出出售菜单（复用 item-context-menu 样式）
    tradeContent.querySelectorAll('.trade-item[data-sell]').forEach(row => {
      row.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const itemId = row.dataset.sell;
        document.querySelectorAll('.trade-context-menu').forEach(m => m.remove());
        const menu = document.createElement('div');
        menu.className = 'item-context-menu trade-context-menu visible';
        menu.innerHTML = `<button class="menu-action" data-action="sell">出售</button>`;
        document.body.appendChild(menu);
        let x = e.clientX, y = e.clientY;
        const rect = menu.getBoundingClientRect();
        if (x + 150 > window.innerWidth) x = window.innerWidth - 150;
        if (y + rect.height > window.innerHeight) y = e.clientY - rect.height;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        menu.querySelector('button').addEventListener('click', async () => {
          menu.remove();
          await callSellItem(currentTradeNpcId, itemId);
          await renderTradeModal();
        });
        const hide = (ev) => {
          if (!menu.contains(ev.target)) {
            menu.remove();
            document.removeEventListener('click', hide);
            document.removeEventListener('scroll', hide);
          }
        };
        setTimeout(() => {
          document.addEventListener('click', hide);
          document.addEventListener('scroll', hide);
        }, 0);
      });
    });
  }

  function openTradeModal(npcId) {
    currentTradeNpcId = npcId;
    renderTradeModal();
    tradeModalOverlay.classList.add('active');
  }

  /* 汇总本次交易（购买/出售的物品与金额），关闭交易弹窗时一次性播报 */
  function summarizeTradeLog() {
    const log = state.tradeLog || [];
    if (log.length === 0) return null;
    const buys = {}, sells = {};
    let buyGold = 0, sellGold = 0;
    log.forEach(t => {
      if (t.type === 'buy') { buys[t.name] = (buys[t.name] || 0) + t.qty; buyGold += t.gold; }
      else { sells[t.name] = (sells[t.name] || 0) + t.qty; sellGold += t.gold; }
    });
    const fmt = o => Object.entries(o).map(([n, q]) => q > 1 ? `${n}×${q}` : n).join('、');
    const parts = [];
    if (Object.keys(buys).length) parts.push(`购买了 ${fmt(buys)}，花费 ${buyGold} 金币`);
    if (Object.keys(sells).length) parts.push(`出售了 ${fmt(sells)}，获得 ${sellGold} 金币`);
    const npc = state.data.npcs[currentTradeNpcId];
    const npcName = npc ? npc.name : '商人';
    const actor = (state.character && state.character.name) || '你';
    return `${actor}与${npcName}完成交易：${parts.join('；')}。`;
  }

  function closeTradeModal() {
    const msg = summarizeTradeLog();
    if (msg) appendLog('gm', msg);
    state.tradeLog = [];
    currentTradeNpcId = null;
    tradeModalOverlay.classList.remove('active');
  }

  async function callBuyItem(npcId, itemId) {
    try {
      const res = await fetch('/api/game/buy_item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: state.sessionId,
          adventure_id: ADVENTURE_ID,
          chapter_id: CHAPTER_ID,
          npc_id: npcId,
          item_id: itemId,
          quantity: 1,
          location_id: currentLocationId(),
          character: state.character,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '购买失败');
      if (data.updates.player_inventory) state.playerInventory = data.updates.player_inventory;
      if (data.updates.merchant_states) state.merchantStates = data.updates.merchant_states;
      if (state.character && data.gold != null) {
        state.character.inventory = state.character.inventory || { gold: 0, items: [] };
        state.character.inventory.gold = data.gold;
      }
      if (data.is_equipment && state.character) {
        const item = findItemDef(itemId);
        if (item) {
          // 全局装备库物品没有 equipment_id 字段，直接用 item_id 作为装备索引
          const eqId = item.equipment_id || itemId;
          // 装备类：直接写入角色卡装备栏（内存，测试阶段不持久化，刷新即回退）
          state.character.inventory = state.character.inventory || { gold: 0, items: [] };
          state.character.inventory.items.push({ equipment_id: eqId, quantity: 1, equipped: false });
        }
      }
      // 静默记录交易，关闭交易弹窗时统一播报
      const bought = findItemDef(itemId);
      state.tradeLog.push({ type: 'buy', name: bought ? bought.name : itemId, qty: data.quantity || 1, gold: data.cost || 0 });
      await renderAllTabs();
      await renderRightPanel();
      // 金币由后端写回角色 JSON，前端只读展示
    } catch (err) {
      appendLog('system', `购买失败: ${err.message}`);
    }
  }

  /* ── 偷窃系统 ── */
  function applyGameUpdates(updates) {
    if (!updates) return;
    if (updates.player_inventory) state.playerInventory = updates.player_inventory;
    if (updates.merchant_states) state.merchantStates = updates.merchant_states;
    if (updates.hostile_npcs) state.hostileNpcs = updates.hostile_npcs;
    if (updates.suspicion) state.suspicion = updates.suspicion;
    if (updates.npc_alerts) state.npcAlerts = updates.npc_alerts;
    if (updates.merchant_theft) state.merchantTheft = updates.merchant_theft;
    if (updates.player_stealth) state.playerStealth = updates.player_stealth;
    // 被抓住状态 / 通缉 / 逮捕（卫兵流程、监狱）
    if (updates.caught) state.caught = updates.caught;
    if (updates.wanted_location !== undefined) state.wantedLocation = updates.wanted_location;
    if (updates.arrest !== undefined) state.arrest = updates.arrest;
    // 逃脱传送：后端已切换地点，同步前端场景 location 并刷新
    if (updates.location_id !== undefined && updates.location_id !== currentLocationId()) {
      const scene = getCurrentScene();
      if (scene) {
        scene.location = updates.location_id;
        const loc = state.data.locations[updates.location_id];
        if (loc) {
          appendLog('system', `你来到了: ${loc.name}`);
          renderLocationHeader();
          renderContextPanel();
        }
      }
    }
    // HP / 法术位 / 短休（后端权威，同步到角色卡显示）
    if (updates.player_hp) {
      state.playerHp = updates.player_hp;
      if (state.character) {
        state.character.combat = state.character.combat || {};
        state.character.combat.hp = `${updates.player_hp.cur} / ${updates.player_hp.max}`;
      }
    }
    if (updates.spell_slots_used !== undefined) state.spellSlotsUsed = updates.spell_slots_used;
    if (updates.short_rests_left !== undefined) state.shortRestsLeft = updates.short_rests_left;
    watchSuspicion(updates);
    watchArrest(updates.arrest);
  }

  /* 监狱狱卒巡逻：在场时真实时间倒计时（guard_until 为秒级时间戳），到点播报"去巡逻"并本地置 away，
     玩家此时可以撬锁（后端在下一次动作时懒计算确认，权威状态以后端为准） */
  let jailGuardTimer = null;
  function watchArrest(arrest) {
    if (jailGuardTimer) { clearTimeout(jailGuardTimer); jailGuardTimer = null; }
    if (!arrest || !arrest.active || arrest.phase !== 'jailed') return;
    if (arrest.jail_guard !== 'present') return;
    const msLeft = (arrest.guard_until || 0) * 1000 - Date.now();
    if (msLeft <= 0) return;
    jailGuardTimer = setTimeout(() => {
      jailGuardTimer = null;
      if (state.arrest && state.arrest.active && state.arrest.phase === 'jailed' &&
          state.arrest.jail_guard === 'present') {
        state.arrest.jail_guard = 'away';
        appendLog('system', '狱卒起身去巡逻了，走廊里暂时没人——现在可以试着撬锁！');
      }
    }, msLeft);
  }

  /* 当前是否正被怀疑（强制对话中）：flagrante（情况二，人赃并获）立即锁定；discovered（情况四，延迟败露）超过 5 秒反应期才锁定 */
  function activeSuspicion() {
    const s = state.suspicion || {};
    const now = Date.now();
    for (const [nid, v] of Object.entries(s)) {
      if (!(v && v.active)) continue;
      if (v.mode === 'flagrante') return [nid, v]; // 人赃并获：无反应期，立即锁定质问
      // detected_at 为后端秒级时间戳，换算为毫秒再比较
      if (now - (v.detected_at || 0) * 1000 >= 5000) return [nid, v];
    }
    return null;
  }

  /* 被怀疑：锁定移动 + NPC 质问（玩家在聊天框回应，AI 扮演 NPC 推进）。mode=flagrante 为人赃并获，discovered 为延迟败露 */
  function triggerSuspicion(npcId, mode) {
    const npc = state.data.npcs[npcId];
    const npcName = npc ? npc.name : '对方';
    if (mode === 'flagrante') {
      appendLog('npc', `${npcName}一把抓住你的手腕，怒目而视："人赃并获！你还有什么话说？！"`);
      appendLog('system', '你被当场抓住。请在聊天框回应：给钱了事 / 欺骗 / 威吓 / 逃跑（挣脱）等');
    } else {
      appendLog('npc', `${npcName}一把拦住你："站住！我刚清点过货，怎么转眼就少了东西……是不是你偷的？让我搜一搜！"`);
      appendLog('system', '你被怀疑偷窃，暂时无法离开此地。请在聊天框回应：同意搜身 / 给钱承认 / 拒绝 / 欺骗 / 威吓 / 游说 / 逃跑等');
    }
  }

  /* 偷窃败露处理：flagrante 立即质问；discovered 走 5 秒反应期（期间不锁定，玩家可离开逃脱；超时仍在原地则触发质问） */
  const suspicionTimers = {};
  function watchSuspicion(updates) {
    if (!updates || !updates.suspicion) return;
    const now = Date.now();
    for (const [nid, v] of Object.entries(updates.suspicion)) {
      if (!(v && v.active)) { if (suspicionTimers[nid]) { clearTimeout(suspicionTimers[nid]); delete suspicionTimers[nid]; } continue; }
      if (v.mode === 'flagrante') {
        // 人赃并获：立即质问，不进 5 秒反应期
        if (!suspicionTimers[nid]) {
          suspicionTimers[nid] = setTimeout(() => {}, 0); // 占位标记，避免重复触发
          triggerSuspicion(nid, 'flagrante');
        }
        continue;
      }
      if (suspicionTimers[nid]) continue; // 已有计时器
      const elapsed = now - (v.detected_at || 0) * 1000; // detected_at 为秒级，换算毫秒
      if (elapsed < 5000) {
        suspicionTimers[nid] = setTimeout(() => {
          delete suspicionTimers[nid];
          if (activeSuspicion()) triggerSuspicion(nid, 'discovered');
        }, 5000 - elapsed);
      }
    }
  }

  /* 当前地点 id（前端自由切换后同步给后端接口） */
  function currentLocationId() {
    const loc = getCurrentLocation();
    return loc ? loc.id : null;
  }

  /* 确定性端点流式调用（SSE：meta → narrative_chunk → done）。
     meta 到达即应用状态/骰子；narrative_chunk 流式渲染 GM 润色播报；AI 失败后端已回退固定播报。 */
  async function callDeterministicStream(url, payload, thinkingText) {
    const thinkingId = 'thinking-' + Date.now();
    let gmEntryId = null, gmEntryCreated = false, gmFullText = '';
    if (thinkingText) appendLog('system', thinkingText, { id: thinkingId });
    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        if (thinkingId) removeLogEntry(thinkingId);
        throw new Error(err.detail || '操作失败');
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            if (data.type === 'meta') {
              if (data.session_id) state.sessionId = data.session_id;
              if (data.updates) applyGameUpdates(data.updates);
              if (data.checks && data.checks.length > 0) data.checks.forEach(c => showCheckLog(c));
              if (data.gold != null && state.character) {
                state.character.inventory = state.character.inventory || { gold: 0, items: [] };
                state.character.inventory.gold = data.gold;
              }
            } else if (data.type === 'narrative_chunk') {
              if (!gmEntryCreated) {
                if (thinkingId) removeLogEntry(thinkingId);
                gmEntryId = 'gm-' + Date.now();
                appendLogEntry({ type: 'gm', text: '', id: gmEntryId });
                gmEntryCreated = true;
              }
              gmFullText += data.text;
              updateLogEntryText(gmEntryId, gmFullText);
            } else if (data.type === 'done') {
              if (data.full_text && data.full_text !== gmFullText) {
                gmFullText = data.full_text;
                if (gmEntryId) updateLogEntryText(gmEntryId, gmFullText);
              }
            }
          } catch (e) { /* 跳过解析失败的行 */ }
        }
      }
    } catch (err) {
      if (thinkingId) removeLogEntry(thinkingId);
      appendLog('system', `操作失败: ${err.message}`);
      throw err;
    }
  }

  /* 被怀疑质问的回应：search（同意搜查）/ pay（给钱承认）/ refuse（拒绝）/ deception/intimidation/persuasion（社交检定），确定性接口 */
  async function callResolveSuspicion(npcId, action) {

     否则越狱成功（传送市场 + 通缉 + 清状态）。SSE 流式：meta 先应用状态，GM 流式叙事（成功/被关回都会说话） */

  /* 潜行（确定性接口，前端关键词触发，绕过 AI 意图识别——保证有骰子播报、无需指定目标、响应快） */

  /* 展示检定结果（复用 meta.checks 的显示逻辑） */
  function showCheckLog(c) {
    if (!c) return;
    const cnSkills = { perception: '侦察（感知）', investigation: '调查（智力）',
      sleight_of_hand: '巧手（敏捷）', stealth: '隐匿（敏捷）',
      insight: '洞悉（感知）', persuasion: '游说（魅力）',
      deception: '欺瞒（魅力）', intimidation: '威吓（魅力）' };
    const cnName = cnSkills[c.skill] || c.skill;
    const dcText = c.dc ? `DC ${c.dc}` : '';
    const rollText = `d20(${c.roll}) + ${c.modifier} = ${c.total}`;
    const resultText = c.success ? '  ✓ 成功' : '  ✗ 失败';
    appendLog('check', `${cnName} ${dcText}: ${rollText}${resultText}`, {
      success: c.success, roll: c.roll, mod: c.modifier, dc: c.dc
    });
  }

  /* ── 掷骰 ── */
  function rollDice(sides, mod) {
    const roll = Math.floor(Math.random() * sides) + 1;
    return { roll, mod: mod || 0, total: roll + (mod || 0) };
  }

  /* ── 快捷检定按钮 ── */
  async function handleQuickCheck(type) {
    if (!state.character) {
      appendLog('system', '未选择角色，无法进行检定。');

    }
